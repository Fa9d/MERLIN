<?xml version="1.0" encoding="UTF-8"?>
<!--
  MESANGE — LOGO PRIMAIRE
  Mésange en réserve sur carré noir. Tout est dans un seul groupe centré.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="MESANGE">
  <title>MESANGE</title>
  <style>
    .bg     { fill: #0a0a0a; }
    .figure { fill: #fdfaf2; }
    .eye    { fill: #0a0a0a; }
  </style>

  <rect class="bg" width="400" height="400" rx="16"/>

  <g transform="translate(60, 130)">
    <!-- Silhouette : tête à gauche, queue effilée à droite, posture compacte -->
    <path class="figure" d="M 80 70
             Q 72 12 118 -4
             Q 155 -12 182 6
             Q 208 -4 240 6
             Q 262 16 268 42
             Q 245 48 218 46
             Q 245 76 255 112
             Q 218 94 182 89
             Q 175 122 150 134
             Q 128 122 128 94
             Q 95 86 80 70 Z"/>
    <!-- Bec triangle effilé -->
    <polygon class="figure" points="75,24 50,30 75,36"/>
    <!-- Œil -->
    <circle class="eye" cx="108" cy="22" r="4.2"/>
  </g>
</svg>
