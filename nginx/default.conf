map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 ipv6=off valid=30s;

server {
    listen 80;
    server_name ${MERLIN_SERVER_NAME};

    client_max_body_size 64m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        set $merlin_api_upstream http://api:8000;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass $merlin_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /livekit {
        set $merlin_livekit_upstream http://livekit:7880;
        proxy_pass $merlin_livekit_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /livekit/ {
        set $merlin_livekit_upstream http://livekit:7880;
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass $merlin_livekit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $merlin_frontend_upstream http://frontend:3000;
        proxy_pass $merlin_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# SSL ready / Certbot compatible:
# 1. Issue certificates on the host with Certbot using `./nginx/certbot/www`.
# 2. Once the files exist, enable the 443 server block below.
#
server {
    listen 443 ssl;
    http2 on;
    server_name ${MERLIN_SERVER_NAME};

    ssl_certificate ${SSL_CERTIFICATE_PATH};
    ssl_certificate_key ${SSL_CERTIFICATE_KEY_PATH};

    client_max_body_size 64m;

    location /api/ {
        set $merlin_api_upstream http://api:8000;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass $merlin_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /livekit {
        set $merlin_livekit_upstream http://livekit:7880;
        proxy_pass $merlin_livekit_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /livekit/ {
        set $merlin_livekit_upstream http://livekit:7880;
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass $merlin_livekit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $merlin_frontend_upstream http://frontend:3000;
        proxy_pass $merlin_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name status.ivia.quebec logs.ivia.quebec;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}


# ============================================================================
# status.ivia.quebec → Uptime Kuma (status page publique)
# ============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name status.ivia.quebec;

    ssl_certificate /etc/letsencrypt/live/status.ivia.quebec/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.ivia.quebec/privkey.pem;

    location / {
        set $uptime_upstream http://uptime-kuma:3001;
        proxy_pass $uptime_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ============================================================================
# logs.ivia.quebec → Dozzle (UI logs Docker, auth basic)
# ============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name logs.ivia.quebec;

    ssl_certificate /etc/letsencrypt/live/logs.ivia.quebec/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logs.ivia.quebec/privkey.pem;

    auth_basic "MERLIN Logs - Acces restreint";
    auth_basic_user_file /etc/nginx/.htpasswd_dozzle;

    location / {
        set $dozzle_upstream http://dozzle:8080;
        proxy_pass $dozzle_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
