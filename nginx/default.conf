map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 ipv6=off valid=30s;

server {
    listen 80;
    listen [::]:80;
    server_name ${MERLIN_SERVER_NAME};

    client_max_body_size 64m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${MERLIN_SERVER_NAME};

    ssl_certificate ${SSL_CERTIFICATE_PATH};
    ssl_certificate_key ${SSL_CERTIFICATE_KEY_PATH};

    client_max_body_size 64m;

    # ── Security headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        set $merlin_api_upstream http://api:8000;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass $merlin_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /livekit {
        set $merlin_livekit_upstream http://livekit:7880;
        proxy_pass $merlin_livekit_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /livekit/ {
        set $merlin_livekit_upstream http://livekit:7880;
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass $merlin_livekit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Site statique IVIA (ivia_site_v2) ───────────────────────────────────
    location / {
        root /opt/merlin/ivia_site_v2;
        index index.html;
        # Essai dans l'ordre : fichier exact, fichier .html, dossier/, 404
        try_files $uri $uri.html $uri/ /404.html;

        # Cache agressif sur assets statiques
        location ~* \.(js|css|woff2?|ttf|otf|svg|ico|webp|png|jpg|jpeg|gif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

server {
    listen 80;
    server_name status.ivia.quebec logs.ivia.quebec;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}


# ============================================================================
# status.ivia.quebec → Uptime Kuma (status page publique)
# ============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name status.ivia.quebec;

    ssl_certificate /etc/letsencrypt/live/status.ivia.quebec/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.ivia.quebec/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        set $uptime_upstream http://uptime-kuma:3001;
        proxy_pass $uptime_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ============================================================================
# logs.ivia.quebec → Dozzle (UI logs Docker, auth basic)
# ============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name logs.ivia.quebec;

    ssl_certificate /etc/letsencrypt/live/logs.ivia.quebec/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logs.ivia.quebec/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    auth_basic "MERLIN Logs - Acces restreint";
    auth_basic_user_file /etc/nginx/.htpasswd_dozzle;

    location / {
        set $dozzle_upstream http://dozzle:8080;
        proxy_pass $dozzle_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
