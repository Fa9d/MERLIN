# IVIA — Lexique vivant (Correspondances vivantes)
#
# Voir doctrine : 00_DOCTRINE/correspondances-vivantes.md
# Voir CLAUDE.md racine §0 (glossaire) et §6.4 (constitution).
#
# Règles dures :
# - `correspondances_conventionnelles` est USAGE INTERNE uniquement. Ne JAMAIS le renvoyer en sortie client.
# - Seules les `formulations_autorisees` peuvent être restituées au client.
# - `niveau_risque: urgent` => au moins un `seuils_reference` avec orientation 811/911/Info-Social.
# - Toute modification de wording autorisé/interdit nécessite relecture humaine.

id: ivia_living_lexicon
version: v0.2
date: 2026-05-15
statut: scaffolding
langue: fr-CA
# Ordre canonique des axes. `territoire` est placé EN PREMIER : c'est doctrinal.
# Le territoire est le sol vivant qui précède et conditionne corps, métabolisme, émotions,
# relations, famille, mémoire transgénérationnelle, société, spirituel/existentiel.
# Voir doctrine : 00_DOCTRINE/correspondances-vivantes.md §3.
# Cet ordre régit la taxonomie globale et l'ordre de citation — il ne force PAS
# `territoire` dans toutes les entrées : on l'inscrit lorsqu'il est sémantiquement actif.
axes_referentiel:
  - territoire
  - corps
  - metabolisme
  - emotions
  - mental
  - relations
  - famille
  - transgenerationnel
  - societe
  - spirituel_existentiel
  - urgence_reference

expressions:

  - id: je-suis-vide
    expression: "je suis vidé / je suis vidée"
    variantes:
      - "j'ai plus de jus"
      - "j'ai plus de batterie"
      - "je suis à plat"
    sens_possibles:
      - "épuisement physique cumulé"
      - "épuisement émotionnel après une période de don de soi"
      - "perte de sens, vide existentiel"
      - "récupération difficile après un événement marquant"
    axes_merlin: [corps, emotions, mental, spirituel_existentiel]
    questions_clarification:
      - "Depuis quand est-ce que vous vous sentez comme ça ?"
      - "Est-ce que c'est plutôt le corps, la tête, ou les deux ?"
      - "Est-ce qu'il y a quelque chose ou quelqu'un qui vous remplit encore un peu ?"
    correspondances_conventionnelles:
      - "fatigue chronique"
      - "épuisement émotionnel (axe d'évaluation du burn-out)"
      - "anhédonie partielle"
    correspondances_complementaires:
      - "perte d'élan vital"
      - "donneur sans retour — relation déséquilibrée"
    niveau_preuve: medium
    niveau_risque: medium
    formulations_autorisees:
      - "Ce que vous décrivez, c'est une fatigue profonde, presque jusqu'à vide. C'est quelque chose qu'on entend souvent quand le corps et le sens demandent une pause."
      - "Une voie possible serait d'en parler à un praticien qui pourra écouter ce qui s'est accumulé."
    formulations_interdites:
      - "Vous faites probablement un burn-out."
      - "Vous êtes en dépression."
    seuils_reference:
      - condition: "épuisement + idées de disparition ou de mort"
        action: "escalade urgence — orientation 811 option 2 (Info-Social) ou 911 si risque immédiat"

  - id: dans-le-brouillard
    expression: "dans le brouillard"
    variantes:
      - "dans la brume"
      - "j'ai la tête dans le coton"
      - "j'arrive plus à penser"
    sens_possibles:
      - "trouble de la concentration"
      - "sidération suite à un événement"
      - "fatigue cognitive"
      - "sentiment de déconnexion du présent"
    axes_merlin: [mental, corps, emotions]
    questions_clarification:
      - "Quand le brouillard est arrivé, est-ce qu'il s'est passé quelque chose ?"
      - "Est-ce que ça arrive plutôt le matin, le soir, ou tout le temps ?"
      - "Est-ce que vous arrivez encore à faire les choses du quotidien ?"
    correspondances_conventionnelles:
      - "brouillard cognitif (cognitive fog)"
      - "dissociation légère"
    correspondances_complementaires:
      - "tête séparée du corps"
      - "protection psychique"
    niveau_preuve: medium
    niveau_risque: medium
    formulations_autorisees:
      - "Cette sensation de brouillard est quelque chose dont beaucoup de personnes parlent. Elle peut venir du corps, du sommeil, du contexte ou d'un événement récent."
    formulations_interdites:
      - "Vous avez un trouble cognitif."
      - "C'est probablement neurologique."
    seuils_reference:
      - condition: "perte de repères temporels ou de mémoire récente importante"
        action: "orientation médecin traitant rapidement"

  - id: corps-en-feu
    expression: "j'ai le corps en feu"
    variantes:
      - "ça brûle en dedans"
      - "je suis tout en feu"
    sens_possibles:
      - "douleurs diffuses, inflammation perçue"
      - "colère contenue qui prend forme dans le corps"
      - "hypervigilance, système nerveux sur la défensive"
      - "symptôme physique potentiellement médical à évaluer"
    axes_merlin: [corps, emotions, urgence_reference]
    questions_clarification:
      - "Est-ce que c'est partout pareil ou plus à certains endroits ?"
      - "Est-ce que c'est constant ou par vagues ?"
      - "Est-ce qu'il y a une émotion qui s'y rattache, ou pas du tout ?"
    correspondances_conventionnelles:
      - "douleur somatique diffuse"
      - "hypersensibilité sensorielle"
    correspondances_complementaires:
      - "feu — colère ancienne — système nerveux en alerte"
    niveau_preuve: low
    niveau_risque: medium
    formulations_autorisees:
      - "Le corps parle. Une voie possible est d'en parler d'abord à un médecin pour écarter une cause physique, puis à un praticien pour écouter ce que ce feu raconte."
    formulations_interdites:
      - "C'est psychosomatique."
      - "Ce n'est rien."
    seuils_reference:
      - condition: "douleur aiguë nouvelle, fièvre, signes neurologiques"
        action: "orientation 811 ou consultation médicale rapide"

  - id: je-suis-tanne
    expression: "je suis tanné / je suis tannée"
    variantes:
      - "j'en peux plus"
      - "je suis écœuré"
      - "j'en ai mon voyage"
    sens_possibles:
      - "saturation accumulée"
      - "désir de changement non encore formulé"
      - "perte de motivation contextuelle"
      - "colère sourde mal nommée"
    axes_merlin: [emotions, mental, societe, relations]
    questions_clarification:
      - "Tanné de quoi en particulier, si vous pouvez le dire ?"
      - "Si rien ne changeait dans six mois, qu'est-ce qui arriverait ?"
    correspondances_conventionnelles:
      - "lassitude / démoralisation"
    correspondances_complementaires:
      - "signal de changement à entendre"
    niveau_preuve: medium
    niveau_risque: low
    formulations_autorisees:
      - "« Tanné », c'est un mot fort au Québec. Souvent il dit qu'une bascule est en cours. On peut prendre le temps de regarder ce qui demande à bouger."
    formulations_interdites:
      - "Vous êtes en dépression."
    seuils_reference: []

  - id: je-ne-me-reconnais-plus
    expression: "je ne me reconnais plus"
    variantes:
      - "je me reconnais plus"
      - "c'est plus moi"
    sens_possibles:
      - "transition identitaire en cours"
      - "perte de repères suite à un événement"
      - "dépersonnalisation"
      - "désalignement avec ses valeurs"
    axes_merlin: [mental, emotions, spirituel_existentiel, relations]
    questions_clarification:
      - "Si vous regardez en arrière, à quel moment vous vous reconnaissiez encore ?"
      - "Est-ce qu'il y a quelqu'un dans votre vie qui vous reconnaît, lui ou elle ?"
    correspondances_conventionnelles:
      - "crise identitaire"
      - "dépersonnalisation (à évaluer)"
    correspondances_complementaires:
      - "mue intérieure"
    niveau_preuve: low
    niveau_risque: medium
    formulations_autorisees:
      - "Ne plus se reconnaître, c'est souvent le signe qu'une partie de vous a déjà commencé à changer. C'est un passage qui mérite d'être accompagné."
    formulations_interdites:
      - "Vous avez un trouble dissociatif."
    seuils_reference:
      - condition: "épisodes de dépersonnalisation prolongés ou angoissants"
        action: "orientation vers un praticien formé à ces états"

  - id: je-mange-mes-emotions
    expression: "je mange mes émotions"
    variantes:
      - "je mange par stress"
      - "je grignote pour me calmer"
    sens_possibles:
      - "stratégie de régulation émotionnelle par la nourriture"
      - "lien stress / glycémie / besoin de réconfort"
      - "héritage relationnel autour de la nourriture"
    axes_merlin: [metabolisme, emotions, famille]
    questions_clarification:
      - "Quelle émotion arrive juste avant que vous mangiez ?"
      - "Dans votre famille, la nourriture a quelle place ?"
    correspondances_conventionnelles:
      - "alimentation émotionnelle"
    correspondances_complementaires:
      - "réconfort, transmission, douceur empruntée"
    niveau_preuve: medium
    niveau_risque: medium
    formulations_autorisees:
      - "Manger ses émotions, ce n'est pas un défaut de volonté. C'est souvent un soin qu'on s'est appris à se donner faute d'autre."
    formulations_interdites:
      - "Vous avez un trouble du comportement alimentaire."
    seuils_reference:
      - condition: "compulsions, vomissements, restrictions extrêmes, perte ou prise de poids rapide"
        action: "orientation médecin et praticien spécialisé"

  - id: je-suis-pris
    expression: "je suis pris / je suis prise"
    variantes:
      - "je suis coincé"
      - "je suis enfermé"
      - "j'ai pas le choix"
    sens_possibles:
      - "sentiment de captivité dans une situation (travail, couple, famille)"
      - "perception réduite des options"
      - "contrainte économique réelle"
    axes_merlin: [societe, relations, mental, famille]
    questions_clarification:
      - "Pris par quoi exactement ? Une personne, une situation, une obligation ?"
      - "Si vous aviez une porte, où mènerait-elle ?"
    correspondances_conventionnelles:
      - "impuissance perçue"
    correspondances_complementaires:
      - "loyauté invisible, contrat tacite"
    niveau_preuve: medium
    niveau_risque: medium
    formulations_autorisees:
      - "Se sentir pris, c'est parfois la situation, parfois ce qu'on s'est engagé à porter. Distinguer les deux peut déjà alléger un peu."
    formulations_interdites:
      - "Vous devez quitter cette situation."
    seuils_reference:
      - condition: "violence conjugale, menaces, contrôle coercitif"
        action: "orientation SOS violence conjugale + 911 si danger immédiat"

  - id: ca-se-repete-toujours
    expression: "ça se répète toujours"
    variantes:
      - "c'est toujours la même chose"
      - "je retombe toujours dedans"
    sens_possibles:
      - "schéma relationnel répétitif"
      - "loyauté transgénérationnelle"
      - "réactivation de blessures anciennes"
    axes_merlin: [transgenerationnel, famille, relations, mental]
    questions_clarification:
      - "Si on remontait à la première fois, ça ressemblait à quoi ?"
      - "Est-ce qu'il y a quelqu'un dans votre famille à qui ça arrivait aussi ?"
    correspondances_conventionnelles:
      - "schémas répétitifs (patterns)"
    correspondances_complementaires:
      - "héritage familial, fidélité invisible"
    niveau_preuve: medium
    niveau_risque: low
    formulations_autorisees:
      - "Ces répétitions ont presque toujours une histoire. Les nommer ensemble est une voie possible."
    formulations_interdites:
      - "C'est génétique."
    seuils_reference: []

  - id: je-dors-plus
    expression: "je ne dors plus"
    variantes:
      - "je dors mal"
      - "je me réveille la nuit"
      - "j'arrive pas à m'endormir"
    sens_possibles:
      - "hypervigilance"
      - "anxiété nocturne"
      - "douleur physique"
      - "rythme de vie en surcharge"
    axes_merlin: [corps, mental, emotions]
    questions_clarification:
      - "Est-ce surtout l'endormissement, ou les réveils, ou les deux ?"
      - "Que se passe-t-il dans votre tête quand vous êtes éveillé la nuit ?"
    correspondances_conventionnelles:
      - "insomnie d'endormissement / de maintien"
    correspondances_complementaires:
      - "garde nocturne — corps qui surveille"
    niveau_preuve: high
    niveau_risque: medium
    formulations_autorisees:
      - "Le sommeil parle souvent en premier. Avant tout, écarter les causes physiques avec un médecin est une étape simple et utile."
    formulations_interdites:
      - "Prenez des somnifères."
    seuils_reference:
      - condition: "insomnie sévère > 2 semaines avec retentissement fort"
        action: "orientation médecin traitant"

  - id: je-suis-anxieux
    expression: "je suis anxieux / anxieuse tout le temps"
    variantes:
      - "j'ai tout le temps peur"
      - "je suis sur le qui-vive"
    sens_possibles:
      - "système nerveux en activation chronique"
      - "anticipation négative apprise"
      - "contexte de vie réellement insécurisant"
    axes_merlin: [corps, emotions, mental, societe]
    questions_clarification:
      - "Anxieux de quoi en particulier, ou plutôt une ambiance générale ?"
      - "Est-ce que votre contexte de vie est sécurisant en ce moment ?"
    correspondances_conventionnelles:
      - "anxiété généralisée (à évaluer)"
    correspondances_complementaires:
      - "vigilance ancienne, héritée"
    niveau_preuve: high
    niveau_risque: medium
    formulations_autorisees:
      - "L'anxiété continue est un signal du corps. Un praticien peut aider à distinguer ce qui vient du contexte et ce qui vient d'un apprentissage ancien."
    formulations_interdites:
      - "Vous souffrez d'anxiété généralisée."
    seuils_reference:
      - condition: "attaques de panique répétées, évitement majeur, retentissement fort"
        action: "orientation médecin et/ou psychothérapeute"

  - id: je-pleure-tout-le-temps
    expression: "je pleure tout le temps"
    variantes:
      - "ça sort tout seul"
      - "je pleure pour rien"
    sens_possibles:
      - "trop-plein émotionnel qui demande passage"
      - "deuil non reconnu"
      - "hypersensibilité contextuelle"
    axes_merlin: [emotions, corps, relations]
    questions_clarification:
      - "Quand ça sort, ça parle de quoi, si vous deviez deviner ?"
      - "Y a-t-il une perte récente, même petite, qui n'a pas eu sa place ?"
    correspondances_conventionnelles:
      - "labilité émotionnelle"
    correspondances_complementaires:
      - "deuil à reconnaître"
    niveau_preuve: medium
    niveau_risque: medium
    formulations_autorisees:
      - "Pleurer beaucoup n'est pas forcément un problème — c'est parfois ce qu'il fallait. Mais c'est aussi un appel à être écouté."
    formulations_interdites:
      - "Vous êtes dépressif."
    seuils_reference:
      - condition: "pleurs + idées noires"
        action: "voir entrée `idees-noires`"

  - id: idees-noires
    expression: "j'ai des idées noires"
    variantes:
      - "j'aurais pas envie d'être là"
      - "ça serait moins compliqué si j'étais pas là"
      - "j'ai envie que ça s'arrête"
    sens_possibles:
      - "détresse psychique à risque"
      - "épuisement extrême sans intention immédiate"
      - "appel à l'aide"
    axes_merlin: [urgence_reference, emotions, mental]
    questions_clarification:
      - "Est-ce que ces pensées arrivent juste comme ça, ou est-ce qu'il y a un plan ?"
      - "Est-ce qu'il y a quelqu'un à qui vous pourriez en parler tout de suite ?"
    correspondances_conventionnelles:
      - "idéations suicidaires (à évaluer cliniquement)"
    correspondances_complementaires:
      - "appel à un changement profond"
    niveau_preuve: high
    niveau_risque: urgent
    formulations_autorisees:
      - "Ce que vous me partagez est important. Vous n'avez pas à porter ça seul·e. Vous pouvez appeler le 811 option 2 (Info-Social) maintenant, ou le 911 si vous sentez un danger immédiat."
    formulations_interdites:
      - "Ça va passer."
      - "Il faut positiver."
    seuils_reference:
      - condition: "présence d'idées noires"
        action: "orientation immédiate 811 option 2 (Info-Social) ; 911 si danger imminent ; signalement humain interne"

  - id: jai-mal-partout
    expression: "j'ai mal partout"
    variantes:
      - "ça me fait mal de partout"
      - "tout fait mal"
    sens_possibles:
      - "douleurs diffuses à explorer médicalement"
      - "somatisation d'un stress chronique"
      - "fatigue physique extrême"
    axes_merlin: [corps, emotions]
    questions_clarification:
      - "Depuis quand ?"
      - "Est-ce que c'est plus intense à certains moments de la journée ?"
    correspondances_conventionnelles:
      - "douleurs diffuses"
    correspondances_complementaires:
      - "corps qui demande à être entendu"
    niveau_preuve: medium
    niveau_risque: medium
    formulations_autorisees:
      - "Quand le corps a mal partout, la première étape est souvent une visite médicale pour écarter une cause physique."
    formulations_interdites:
      - "C'est dans la tête."
    seuils_reference:
      - condition: "douleur nouvelle, intense, ou signes médicaux associés"
        action: "orientation médecin / 811"

  - id: je-suis-tout-le-temps-en-colere
    expression: "je suis tout le temps en colère"
    variantes:
      - "je suis à cran"
      - "je m'énerve pour rien"
    sens_possibles:
      - "fatigue qui s'exprime en irritabilité"
      - "limite franchie de façon répétée"
      - "colère ancienne réactivée"
    axes_merlin: [emotions, corps, relations, famille]
    questions_clarification:
      - "Est-ce que la colère est dirigée vers une personne en particulier ?"
      - "Est-ce que vous étiez comme ça avant ?"
    correspondances_conventionnelles:
      - "irritabilité (symptôme transverse)"
    correspondances_complementaires:
      - "limite à poser"
    niveau_preuve: medium
    niveau_risque: medium
    formulations_autorisees:
      - "La colère continue dit souvent quelque chose d'une limite, ou d'une fatigue. Elle mérite d'être écoutée avant d'être réprimée."
    formulations_interdites:
      - "Vous avez un problème de gestion de la colère."
    seuils_reference:
      - condition: "violence verbale ou physique envers proches"
        action: "orientation ressource spécialisée violence (ex. organisme local) et arrêt immédiat des comportements"

  - id: je-fonctionne-mais
    expression: "je fonctionne, mais…"
    variantes:
      - "ça va, mais ça va pas"
      - "je tiens, mais à fond"
    sens_possibles:
      - "fonctionnement de surface, épuisement sous-jacent"
      - "haut potentiel d'adaptation masquant le coût réel"
      - "incapacité culturelle à dire qu'on ne va pas bien"
    axes_merlin: [emotions, mental, societe, corps]
    questions_clarification:
      - "Si vous n'étiez pas obligé de fonctionner, qu'est-ce qui apparaîtrait ?"
      - "Combien d'énergie ça vous coûte de tenir ?"
    correspondances_conventionnelles:
      - "fonctionnement à coût caché"
    correspondances_complementaires:
      - "high-functioning, masquage social"
    niveau_preuve: medium
    niveau_risque: medium
    formulations_autorisees:
      - "Fonctionner peut cacher beaucoup. Le fait d'avoir à mettre un « mais » est déjà un signal qui mérite attention."
    formulations_interdites:
      - "Si vous fonctionnez, c'est que ça va."
    seuils_reference: []

  - id: jai-honte
    expression: "j'ai honte"
    variantes:
      - "je m'en veux"
      - "je me dégoûte"
    sens_possibles:
      - "honte sociale héritée"
      - "honte d'un événement subi"
      - "auto-jugement appris"
    axes_merlin: [emotions, relations, famille, transgenerationnel, societe]
    questions_clarification:
      - "Honte par rapport à quoi, ou à qui ?"
      - "Est-ce que cette honte vous appartient vraiment, ou est-ce qu'on vous l'a donnée ?"
    correspondances_conventionnelles:
      - "honte (émotion auto-évaluative)"
    correspondances_complementaires:
      - "honte transmise — secret familial possible"
    niveau_preuve: medium
    niveau_risque: medium
    formulations_autorisees:
      - "La honte est souvent partagée, même quand elle se vit seul·e. Parler avec un praticien peut commencer à déposer un peu de ce poids."
    formulations_interdites:
      - "Vous n'avez pas à avoir honte." # nie l'expérience
    seuils_reference:
      - condition: "honte liée à un événement traumatique récent"
        action: "orientation praticien formé au psychotraumatisme"

  - id: jai-perdu-quelquun
    expression: "j'ai perdu quelqu'un"
    variantes:
      - "il/elle est parti"
      - "on l'a perdu"
    sens_possibles:
      - "deuil en cours"
      - "deuil ancien non terminé qui se réactive"
    axes_merlin: [emotions, relations, famille, spirituel_existentiel]
    questions_clarification:
      - "Quand est-ce que c'est arrivé ?"
      - "Est-ce que vous avez pu en parler, depuis ?"
    correspondances_conventionnelles:
      - "deuil"
    correspondances_complementaires:
      - "lien qui se réorganise"
    niveau_preuve: high
    niveau_risque: medium
    formulations_autorisees:
      - "Un deuil n'a pas de bonne durée. Ce que vous traversez mérite un espace pour être déposé, pas pour être résolu."
    formulations_interdites:
      - "Il faut tourner la page."
    seuils_reference:
      - condition: "deuil + idées noires"
        action: "voir entrée `idees-noires`"

  - id: je-bois-pour-tenir
    expression: "je bois pour tenir"
    variantes:
      - "je prends un verre pour décompresser"
      - "j'ai besoin de quelque chose le soir"
    sens_possibles:
      - "stratégie d'apaisement par substance"
      - "dépendance en construction"
      - "auto-médication d'un mal nommé autrement"
    axes_merlin: [metabolisme, emotions, societe]
    questions_clarification:
      - "Combien, à peu près, par semaine ?"
      - "Qu'est-ce qui arrive si vous ne buvez pas un soir ?"
    correspondances_conventionnelles:
      - "consommation à risque, à évaluer"
    correspondances_complementaires:
      - "stratégie d'apaisement"
    niveau_preuve: high
    niveau_risque: medium
    formulations_autorisees:
      - "Boire pour tenir, c'est une stratégie. Elle a un coût. On peut en parler sans jugement avec un praticien ou Drogue : aide et référence (1 800 265-2626 au Québec)."
    formulations_interdites:
      - "Vous êtes alcoolique."
    seuils_reference:
      - condition: "consommation quotidienne ou retentissement fonctionnel"
        action: "orientation ressource spécialisée addiction"

  - id: jai-pas-envie-de-rien
    expression: "j'ai envie de rien"
    variantes:
      - "rien me tente"
      - "même ce que j'aimais m'intéresse plus"
    sens_possibles:
      - "perte de plaisir contextuelle"
      - "épuisement"
      - "signe de détresse psychique à évaluer"
    axes_merlin: [emotions, mental, corps]
    questions_clarification:
      - "Depuis quand ?"
      - "Y a-t-il un moment de la journée où une étincelle revient, même petite ?"
