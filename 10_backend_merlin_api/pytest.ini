[pytest]
testpaths = tests
pythonpath = .
addopts = -v -m "not real_api"
# Les tests real_api (smoke bout-en-bout : Postgres reel + Claude API) sont opt-in :
#   python -m pytest -m real_api -o addopts=""  (necessite DB + ANTHROPIC_API_KEY)

markers =
    integration: tests necessitant des ressources externes
    real_api: tests appelant Claude API en vrai (couteux). Exclure: pytest -m 'not real_api'
    replay: tests utilisant fixtures enregistrees (sans reseau).
