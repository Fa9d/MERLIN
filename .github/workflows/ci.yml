name: CI

# Filet CI MERLIN — lint + tests + sécurité. Gates BLOQUANTS : ruff (lint) + tests sans
# DB (unit) + suite complète avec Postgres (full-suite, bloquant depuis le 22 juin 2026)
# + gitleaks (secrets) + pip-audit (CVE dépendances) depuis le 8 juillet 2026.
# Les safety evals restent scaffolées (job commenté) tant que le secret ANTHROPIC_API_KEY
# n'est pas fourni — à activer pour faire de la safety suite un gate dur (CLAUDE.md §8.3).

on:
  push:
    branches: [main, master, refonte-ivia-site-unifie]
  pull_request:

defaults:
  run:
    working-directory: 10_backend_merlin_api

jobs:
  # ── Lint (bloquant) : pyflakes + erreurs de syntaxe (haut signal, faible bruit) ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.9.6
      - name: ruff check
        run: ruff check .

  # ── Tests unitaires sans DB (bloquant) : registre + route des référentiels ──
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: pytest (référentiels + transcription, sans DB)
        run: >-
          python -m pytest
          tests/test_referentiels_registry.py
          tests/test_referentiels_route.py
          tests/test_transcription_provider.py
          -o addopts="" -p no:cacheprovider -q

  # ── Suite complète avec Postgres (BLOQUANT depuis le 22 juin 2026) : migrations + tous
  #    les tests sauf real_api. Une régression DB casse désormais le build (au lieu de passer). ──
  full-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: merlin_v1
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MERLIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:55432/merlin_v1
      MERLIN_AUTH_SECRET_KEY: ci-test-secret-not-for-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Migrations Alembic
        run: alembic upgrade head
      - name: pytest (tout sauf real_api)
        run: python -m pytest -m "not real_api" -o addopts="" -q

  # ── Secrets (BLOQUANT) : gitleaks sur tout l'historique, allowlist .gitleaks.toml ──
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── CVE dépendances (BLOQUANT pour toute NOUVELLE vulnérabilité) ──
  # Les vulnérabilités listées en --ignore-vuln sont un risque ACCEPTÉ le 2026-07-08
  # (correctif = bump fastapi/starlette, chantier dédié M17). Retirer les ignores
  # après le bump. Toute nouvelle CVE non listée casse le build.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit (requirements épinglés)
        run: >-
          python -m pip_audit -r requirements.txt --no-deps
          --ignore-vuln PYSEC-2026-1845
          --ignore-vuln CVE-2026-53533
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-1942
          --ignore-vuln CVE-2026-48818
          --ignore-vuln CVE-2026-48817

  # ── Safety evals (informatif) : nécessite le secret ANTHROPIC_API_KEY ──
  # Décommenter et fournir le secret pour faire de la safety suite un gate dur
  # (cf. CLAUDE.md §8.3 — aucune fusion d'un prompt client sans run de safety suite).
