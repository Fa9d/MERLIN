services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - merlin_network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - merlin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - merlin_network

  api:
    build:
      context: ./10_backend_merlin_api
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - >-
        mkdir -p /app/storage/recordings &&
        chmod 0775 /app/storage/recordings &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      TZ: ${TZ}
      MERLIN_ENV: ${MERLIN_ENV}
      MERLIN_APP_NAME: ${MERLIN_APP_NAME}
      MERLIN_API_V1_PREFIX: ${MERLIN_API_V1_PREFIX}
      MERLIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MERLIN_AUTH_SECRET_KEY: ${MERLIN_AUTH_SECRET_KEY}
      MERLIN_AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${MERLIN_AUTH_ACCESS_TOKEN_EXPIRE_MINUTES}
      MERLIN_MEDIA_PROVIDER_CODE: ${MERLIN_MEDIA_PROVIDER_CODE}
      MERLIN_MEDIA_LIVEKIT_WS_URL: ws://livekit:7880
      MERLIN_MEDIA_LIVEKIT_PUBLIC_WS_URL: ${MERLIN_MEDIA_LIVEKIT_PUBLIC_WS_URL}
      MERLIN_MEDIA_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      MERLIN_MEDIA_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      MERLIN_MEDIA_RECORDING_ENABLED: ${MERLIN_MEDIA_RECORDING_ENABLED}
      MERLIN_MEDIA_RECORDING_STRATEGY: ${MERLIN_MEDIA_RECORDING_STRATEGY}
      MERLIN_MEDIA_RECORDINGS_DIR: /app/storage/recordings
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_RECORDING_STORAGE: ${LIVEKIT_RECORDING_STORAGE}
      LIVEKIT_RECORDING_LOCAL_DIR: /app/storage/recordings
      LIVEKIT_S3_ENDPOINT: ${LIVEKIT_S3_ENDPOINT}
      LIVEKIT_S3_BUCKET: ${LIVEKIT_S3_BUCKET}
      LIVEKIT_S3_ACCESS_KEY: ${LIVEKIT_S3_ACCESS_KEY}
      LIVEKIT_S3_SECRET_KEY: ${LIVEKIT_S3_SECRET_KEY}
      LIVEKIT_S3_REGION: ${LIVEKIT_S3_REGION}
      LIVEKIT_S3_FORCE_PATH_STYLE: ${LIVEKIT_S3_FORCE_PATH_STYLE}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
      MERLIN_TRANSCRIPTION_PROVIDER: ${MERLIN_TRANSCRIPTION_PROVIDER:-auto}
      MERLIN_WHISPER_MODEL: ${MERLIN_WHISPER_MODEL:-medium}
      MERLIN_WHISPER_DEVICE: ${MERLIN_WHISPER_DEVICE:-cpu}
      MERLIN_WHISPER_COMPUTE_TYPE: ${MERLIN_WHISPER_COMPUTE_TYPE:-int8}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MERLIN_CORS_ORIGINS: ${MERLIN_CORS_ORIGINS}
      MERLIN_AUTO_CREATE_TABLES: ${MERLIN_AUTO_CREATE_TABLES}
    volumes:
      - /opt/merlin/11_PROMPTS:/11_PROMPTS:ro
      # Référentiels vivants — requis par app/referentiels/registry.py (comme 11_PROMPTS)
      - /opt/merlin/00_DOCTRINE:/00_DOCTRINE:ro
      # Cache des modèles faster-whisper (téléchargés au premier usage)
      - merlin_whisper_models:/root/.cache/huggingface
      - merlin_recordings:/app/storage/recordings
      - ./10_backend_merlin_api/alembic/versions:/app/alembic/versions
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - merlin_network

  # ── Frontend Next.js (09_app_ivia_merlin) RETIRÉ de la prod — 2026-06-23 ──────
  # Le site public est servi par nginx depuis ivia_site_v2/ (statique) :
  #   nginx/default.conf → location / { root /opt/merlin/ivia_site_v2; }
  # nginx ne route JAMAIS vers ce conteneur : il était rebâti (~8 min) à chaque
  # déploiement SANS recevoir de trafic public. Code conservé en repo (legacy).
  # Pour le réactiver un jour : restaurer ce service + un location nginx dédié.

  livekit:
    image: livekit/livekit-server:v1.8.3
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        printf '%s\n'
        'port: 7880'
        'bind_addresses:'
        '  - 0.0.0.0'
        'rtc:'
        '  tcp_port: 7881'
        '  port_range_start: ${LIVEKIT_RTC_PORT_RANGE_START}'
        '  port_range_end: ${LIVEKIT_RTC_PORT_RANGE_END}'
        '  use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP}'
        'room:'
        '  auto_create: true'
        'redis:'
        '  address: redis:6379'
        'keys:'
        '  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
        'logging:'
        '  level: ${LIVEKIT_LOG_LEVEL}'
        > /tmp/livekit.yaml &&
        exec /livekit-server --config /tmp/livekit.yaml
    ports:
      - "7881:7881/tcp"
      - "${LIVEKIT_RTC_PORT_RANGE_START}-${LIVEKIT_RTC_PORT_RANGE_END}:${LIVEKIT_RTC_PORT_RANGE_START}-${LIVEKIT_RTC_PORT_RANGE_END}/udp"
    networks:
      - merlin_network

  livekit-egress:
    image: livekit/egress:v1.8.3
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      api:
        condition: service_healthy
    environment:
      EGRESS_CONFIG_BODY: |-
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        health_port: 8081
        template_port: 7980
        logging:
          level: ${LIVEKIT_LOG_LEVEL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - merlin_recordings:/app/storage/recordings
    networks:
      - merlin_network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_started
      livekit-egress:
        condition: service_started
    environment:
      MERLIN_SERVER_NAME: ${MERLIN_SERVER_NAME}
      SSL_CERTIFICATE_PATH: ${SSL_CERTIFICATE_PATH}
      SSL_CERTIFICATE_KEY_PATH: ${SSL_CERTIFICATE_KEY_PATH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/.htpasswd_dozzle:/etc/nginx/.htpasswd_dozzle:ro
      - ./ivia_site_v2:/opt/merlin/ivia_site_v2:ro
    networks:
      - merlin_network


  dozzle:
    image: amir20/dozzle:latest
    container_name: merlin-dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - merlin_network

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: merlin-uptime-kuma
    restart: unless-stopped
    volumes:
      - merlin_uptime_data:/app/data
    networks:
      - merlin_network

  # ── Matomo — mesure d'audience souveraine (données Québec, Loi 25) ──────
  # UI + suivi : https://stats.ivia.quebec (proxy nginx). Mode sans témoin
  # (cookieless) configuré côté balise dans ivia_site_v2/shared/analytics.js.
  matomo-db:
    image: mariadb:11
    restart: unless-stopped
    command: --max-allowed-packet=64MB
    environment:
      MYSQL_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MYSQL_PASSWORD: ${MATOMO_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - merlin_matomo_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - merlin_network

  matomo:
    image: matomo:5-apache
    restart: unless-stopped
    depends_on:
      matomo-db:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
      MATOMO_DATABASE_DBNAME: matomo
      TZ: ${TZ}
    volumes:
      - merlin_matomo_data:/var/www/html
    networks:
      - merlin_network

volumes:
  merlin_postgres_data:
  merlin_recordings:
  merlin_uptime_data:
  merlin_whisper_models:
  merlin_matomo_db:
  merlin_matomo_data:

networks:
  merlin_network:
    driver: bridge
