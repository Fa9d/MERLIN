<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IVIA — Préparer ma séance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300..700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --color-bg:#f4f7f4;--color-surface:#ffffff;--color-surface-2:#f0f4f0;
  --color-surface-offset:#e8efe8;--color-border:rgba(30,80,40,.1);
  --color-text:#1a2e1a;--color-text-muted:#5a7a5a;--color-text-faint:#9ab09a;
  --color-primary:#1a6b3a;--color-primary-hover:#145430;--color-primary-hl:#d4eadc;
  --color-gold:#c8860a;--color-gold-hl:#fdf0d4;
  --color-rgnr-corps:#2e7d5c;--color-rgnr-emotions:#8b4a9c;
  --color-rgnr-pensees:#1a6b8a;--color-rgnr-env:#c8860a;
  --shadow-sm:0 1px 3px rgba(20,60,20,.08);--shadow-md:0 4px 16px rgba(20,60,20,.10);
  --radius-sm:.375rem;--radius-md:.5rem;--radius-lg:.75rem;--radius-xl:1rem;--radius-full:9999px;
  --font-display:'DM Serif Display',Georgia,serif;--font-body:'DM Sans','Helvetica Neue',sans-serif;
  --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);--text-sm:clamp(.875rem,.8rem + .35vw,1rem);
  --text-base:clamp(1rem,.95rem + .25vw,1.125rem);--text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-5:1.25rem;
  --space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;--space-12:3rem;
  --transition:180ms cubic-bezier(.16,1,.3,1);
}
[data-theme="dark"]{
  --color-bg:#0f1a0f;--color-surface:#152015;--color-surface-2:#1a281a;
  --color-surface-offset:#1f301f;--color-border:rgba(100,200,100,.1);
  --color-text:#d4e8d4;--color-text-muted:#7a9a7a;--color-text-faint:#4a6a4a;
  --color-primary:#5ab878;--color-primary-hover:#3da05e;--color-primary-hl:#1a3a22;
  --color-gold:#e8a830;--color-gold-hl:#3a2a08;
  --color-rgnr-corps:#4db88a;--color-rgnr-emotions:#c47ad8;
  --color-rgnr-pensees:#4aa8c8;--color-rgnr-env:#e8a830;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 16px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);background:var(--color-bg);line-height:1.6}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
a{text-decoration:none;color:inherit}

/* ── LAYOUT ── */
.page{min-height:100dvh;display:flex;flex-direction:column}
.topbar{background:var(--color-surface);border-bottom:1px solid var(--color-border);
  padding:var(--space-4) var(--space-6);display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)}
.topbar-left{display:flex;align-items:center;gap:var(--space-4)}
.back-btn{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);color:var(--color-text-muted);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);transition:all var(--transition)}
.back-btn:hover{background:var(--color-surface-2);color:var(--color-text)}
.logo-name{font-family:var(--font-display);font-size:var(--text-base);color:var(--color-primary);font-style:italic}
.theme-toggle{width:32px;height:32px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);border:1px solid var(--color-border);transition:all var(--transition)}
.theme-toggle:hover{background:var(--color-surface-2)}

.main{flex:1;padding:var(--space-8) var(--space-6);display:flex;flex-direction:column;gap:var(--space-8);max-width:800px;margin:0 auto;width:100%}
@media(max-width:768px){.main{padding:var(--space-4)}}

/* ── SEANCE HEADER ── */
.seance-header{background:linear-gradient(135deg,var(--color-primary-hl),var(--color-surface));
  border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-6);
  display:flex;gap:var(--space-5);align-items:center;flex-wrap:wrap}
.seance-date-badge{background:var(--color-primary);color:#fff;border-radius:var(--radius-lg);
  padding:var(--space-3) var(--space-5);text-align:center;flex-shrink:0}
.seance-day-num{font-family:var(--font-display);font-size:var(--text-xl);line-height:1}
.seance-day-name{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.seance-info-title{font-family:var(--font-display);font-size:var(--text-lg);font-style:italic;margin-bottom:var(--space-1)}
.seance-info-meta{font-size:var(--text-sm);color:var(--color-text-muted)}

/* ── SECTION CARD ── */
.section-card{background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-xl);padding:var(--space-6);box-shadow:var(--shadow-sm)}
.section-title{font-size:var(--text-sm);font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--color-text-muted);margin-bottom:var(--space-5)}

/* ── RGNR MINI ── */
.rgnr-mini-row{display:flex;gap:var(--space-3);flex-wrap:wrap}
.rgnr-mini-chip{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);
  border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:600;
  background:var(--color-surface-2);border:1px solid var(--color-border)}

/* ── QUESTIONS LIST ── */
.questions-list{display:flex;flex-direction:column;gap:var(--space-4)}
.question-block{}
.question-label{font-size:var(--text-sm);font-weight:600;margin-bottom:var(--space-2);display:flex;align-items:center;gap:var(--space-2)}
.question-hint{font-size:var(--text-xs);color:var(--color-text-muted);margin-bottom:var(--space-2)}
textarea{width:100%;min-height:80px;resize:vertical;padding:var(--space-3) var(--space-4);
  border:1.5px solid var(--color-border);border-radius:var(--radius-lg);
  font-family:var(--font-body);font-size:var(--text-sm);background:var(--color-surface);
  color:var(--color-text);outline:none;transition:border-color var(--transition);line-height:1.6}
textarea:focus{border-color:var(--color-primary)}

/* ── PRIORITÉ CHIPS ── */
.priority-chips{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-3)}
.p-chip{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);
  border:1.5px solid var(--color-border);border-radius:var(--radius-full);
  font-size:var(--text-xs);font-weight:600;cursor:pointer;transition:all var(--transition);
  background:var(--color-surface);color:var(--color-text-muted)}
.p-chip:hover{border-color:var(--color-primary);color:var(--color-primary)}
.p-chip.active{background:var(--color-primary-hl);border-color:var(--color-primary);color:var(--color-primary)}

/* ── MERLIN PRE-ANALYSE ── */
.merlin-block{background:linear-gradient(135deg,var(--color-gold-hl),var(--color-surface));
  border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-5)}
.merlin-header{display:flex;align-items:center;gap:var(--space-2);
  font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--color-gold);margin-bottom:var(--space-4)}
.merlin-text{font-size:var(--text-sm);color:var(--color-text-muted);font-style:italic;line-height:1.6;
  border-left:2px solid var(--color-gold);padding-left:var(--space-4)}

/* ── BTN ── */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-5);
  border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:600;
  transition:all var(--transition);cursor:pointer;border:none}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-primary:hover{background:var(--color-primary-hover);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-ghost{background:transparent;border:1.5px solid var(--color-border);color:var(--color-text-muted)}
.btn-ghost:hover{background:var(--color-surface-2);color:var(--color-text)}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="topbar-left">
      <a href="ivia-seances.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Mes séances
      </a>
      <span class="logo-name">ivia</span>
    </div>
    <button class="theme-toggle" data-theme-toggle aria-label="Thème">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
  </header>

  <main class="main">

    <!-- En-tête séance -->
    <div class="seance-header">
      <div class="seance-date-badge">
        <div class="seance-day-num">14</div>
        <div class="seance-day-name">Juil</div>
      </div>
      <div>
        <div class="seance-info-title">Préparer ma séance — Semaine 13</div>
        <div class="seance-info-meta">Lundi 14 juillet 2026 · 14h00 – 15h00 · Visioconférence · Dr. Amélie Fortin</div>
      </div>
    </div>

    <!-- Contexte RGNR actuel -->
    <div class="section-card">
      <div class="section-title">Mon état RGNR depuis la dernière séance</div>
      <div class="rgnr-mini-row">
        <div class="rgnr-mini-chip"><span style="width:8px;height:8px;border-radius:50%;background:var(--color-rgnr-corps);display:inline-block"></span>Corps <strong style="color:var(--color-rgnr-corps)">72</strong> <span style="color:var(--color-text-faint)">↑+8</span></div>
        <div class="rgnr-mini-chip"><span style="width:8px;height:8px;border-radius:50%;background:var(--color-rgnr-emotions);display:inline-block"></span>Émotions <strong style="color:var(--color-rgnr-emotions)">58</strong> <span style="color:var(--color-text-faint)">→</span></div>
        <div class="rgnr-mini-chip"><span style="width:8px;height:8px;border-radius:50%;background:var(--color-rgnr-pensees);display:inline-block"></span>Pensées <strong style="color:var(--color-rgnr-pensees)">65</strong> <span style="color:var(--color-text-faint)">↑+12</span
