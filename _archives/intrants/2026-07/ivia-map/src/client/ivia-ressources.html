<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IVIA — Ressources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300..700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --color-bg:#f4f7f4;--color-surface:#ffffff;--color-surface-2:#f0f4f0;
  --color-surface-offset:#e8efe8;--color-border:rgba(30,80,40,.1);
  --color-text:#1a2e1a;--color-text-muted:#5a7a5a;--color-text-faint:#9ab09a;
  --color-primary:#1a6b3a;--color-primary-hover:#145430;--color-primary-hl:#d4eadc;
  --color-gold:#c8860a;--color-gold-hl:#fdf0d4;
  --color-rgnr-corps:#2e7d5c;--color-rgnr-emotions:#8b4a9c;
  --color-rgnr-pensees:#1a6b8a;--color-rgnr-env:#c8860a;
  --shadow-sm:0 1px 3px rgba(20,60,20,.08);--shadow-md:0 4px 16px rgba(20,60,20,.10);
  --radius-sm:.375rem;--radius-md:.5rem;--radius-lg:.75rem;--radius-xl:1rem;--radius-full:9999px;
  --font-display:'DM Serif Display',Georgia,serif;--font-body:'DM Sans','Helvetica Neue',sans-serif;
  --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);--text-sm:clamp(.875rem,.8rem + .35vw,1rem);
  --text-base:clamp(1rem,.95rem + .25vw,1.125rem);--text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-5:1.25rem;
  --space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;--space-12:3rem;
  --transition:180ms cubic-bezier(.16,1,.3,1);
}
[data-theme="dark"]{
  --color-bg:#0f1a0f;--color-surface:#152015;--color-surface-2:#1a281a;
  --color-surface-offset:#1f301f;--color-border:rgba(100,200,100,.1);
  --color-text:#d4e8d4;--color-text-muted:#7a9a7a;--color-text-faint:#4a6a4a;
  --color-primary:#5ab878;--color-primary-hover:#3da05e;--color-primary-hl:#1a3a22;
  --color-gold:#e8a830;--color-gold-hl:#3a2a08;
  --color-rgnr-corps:#4db88a;--color-rgnr-emotions:#c47ad8;
  --color-rgnr-pensees:#4aa8c8;--color-rgnr-env:#e8a830;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 16px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);
  color:var(--color-text);background:var(--color-bg);line-height:1.6}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
a{text-decoration:none;color:inherit}
/* Layout & sidebar identiques */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100dvh}
@media(max-width:768px){.app{grid-template-columns:1fr}}
.sidebar{background:var(--color-surface);border-right:1px solid var(--color-border);
  padding:var(--space-6) var(--space-4);display:flex;flex-direction:column;gap:var(--space-6);
  position:sticky;top:0;height:100dvh;overflow-y:auto}
@media(max-width:768px){.sidebar{display:none}}
.logo{display:flex;align-items:center;gap:var(--space-3)}
.logo-name{font-family:var(--font-display);font-size:var(--text-lg);color:var(--color-primary);font-style:italic}
.user-card{background:var(--color-surface-2);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
.user-avatar{width:48px;height:48px;border-radius:var(--radius-full);background:var(--color-primary-hl);display:flex;align-items:center;justify-content:center;font-size:var(--text-lg);color:var(--color-primary);font-weight:600}
.user-name{font-weight:600;font-size:var(--text-sm)}
.user-since{font-size:var(--text-xs);color:var(--color-text-muted)}
.nav-section{display:flex;flex-direction:column;gap:var(--space-1)}
.nav-label{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-faint);padding:var(--space-2) var(--space-3);font-weight:600}
.nav-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);font-size:var(--text-sm);transition:all var(--transition);color:var(--color-text-muted);cursor:pointer}
.nav-item:hover{background:var(--color-surface-2);color:var(--color-text)}
.nav-item.active{background:var(--color-primary-hl);color:var(--color-primary);font-weight:600}
.nav-icon{width:18px;height:18px;opacity:.7}
.nav-item.active .nav-icon{opacity:1}
.theme-toggle{width:32px;height:32px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);border:1px solid var(--color-border);transition:all var(--transition)}
.theme-toggle:hover{background:var(--color-surface-2)}

.main{padding:var(--space-8);display:flex;flex-direction:column;gap:var(--space-8)}
@media(max-width:768px){.main{padding:var(--space-4)}}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:var(--space-4)}
.page-title{font-family:var(--font-display);font-size:var(--text-xl);line-height:1.2;font-style:italic}
.page-subtitle{font-size:var(--text-sm);color:var(--color-text-muted);margin-top:var(--space-1)}

/* ── FILTRES ── */
.filter-bar{display:flex;gap:var(--space-2);flex-wrap:wrap}
.filter-chip{display:flex;align-items:center;gap:var(--space-1);padding:var(--space-1) var(--space-3);
  border:1.5px solid var(--color-border);border-radius:var(--radius-full);
  font-size:var(--text-xs);font-weight:600;cursor:pointer;transition:all var(--transition);
  background:var(--color-surface);color:var(--color-text-muted)}
.filter-chip:hover{border-color:var(--color-primary);color:var(--color-primary)}
.filter-chip.active{background:var(--color-primary-hl);border-color:var(--color-primary);color:var(--color-primary)}

/* ── RESSOURCES MISES EN AVANT (MERLIN) ── */
.merlin-highlight{background:linear-gradient(135deg,var(--color-gold-hl),var(--color-surface));
  border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-6)}
.merlin-label{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-xs);
  font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--color-gold);
  margin-bottom:var(--space-4)}
.merlin-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4)}
@media(max-width:900px){.merlin-cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.merlin-cards{grid-template-columns:1fr}}

/* ── RESOURCE CARD ── */
.resource-card{background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;
  gap:var(--space-3);box-shadow:var(--shadow-sm);transition:box-shadow var(--transition);cursor:pointer}
.resource-card:hover{box-shadow:var(--shadow-md)}
.resource-card-header{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.resource-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  padding:2px 8px;border-radius:var(--radius-full)}
.tag-tcc{background:rgba(26,107,138,.12);color:var(--color-rgnr-pensees)}
.tag-dbt{background:rgba(139,74,156,.12);color:var(--color-rgnr-emotions)}
.tag-act{background:rgba(46,125,92,.12);color:var(--color-rgnr-corps)}
.tag-rgnr{background:rgba(200,134,10,.12);color:var(--color-rgnr-env)}
.tag-neuro{background:rgba(26,107,58,.12);color:var(--color-primary)}
.resource-card-title{font-weight:700;font-size:var(--text-sm);line-height:1.3}
.resource-card-desc{font-size:var(--text-xs);color:var(--color-text-muted);line-height:1.5}
.resource-card-meta{display:flex;align-items:center;justify-content:space-between;
  margin-top:auto;font-size:var(--text-xs);color:var(--color-text-faint)}
.resource-type-badge{display:flex;align-items:center;gap:4px}

/* ── ALL RESOURCES GRID ── */
.resources-section{}
.resources-section-title{font-size:var(--text-sm);font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--color-text-muted);margin-bottom:var(--space-4)}
.resources-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--space-4)}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="18" fill="var(--color-primary-hl)"/><path d="M18 8c0 0-8 6-8 12a8 8 0 0016 0c0-6-8-12-8-12z" fill="var(--color-primary)" opacity=".5"/><circle cx="18" cy="20" r="4" fill="var(--color-primary)"/></svg>
      <span class="logo-name">ivia</span>
    </div>
    <div class="user-card">
      <div class="user-avatar">S</div>
      <div class="user-name">Sophie Martin</div>
      <div class="user-since">Parcours depuis Jan 2026</div>
    </div>
    <nav class="nav-section">
      <div class="nav-label">Espace personnel</div>
      <a href="ivia-client-dashboard.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Tableau de bord
      </a>
      <a href="ivia-checkin.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 11-10 10"/><polyline points="12 6 12 12 16 14"/></svg>
        Check-in RGNR
      </a>
      <a href="ivia-ressources.html" class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        Ressources
      </a>
    </nav>
    <nav class="nav-section">
      <div class="nav-label">Suivi</div>
      <a href="ivia-seances.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Mes séances
      </a>
      <a href="ivia-progression.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Ma progression
      </a>
    </nav>
    <div style="margin-top:auto">
      <button class="theme-toggle" data-theme-toggle aria-label="Thème">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Ressources</h1>
        <p class="page-subtitle">Outils thérapeutiques recommandés par votre praticien et MERLIN</p>
      </div>
    </div>

    <!-- Filtres -->
    <div class="filter-bar">
      <button class="filter-chip active" onclick="filterResources(this,'all')">Toutes</button>
      <button class="filter-chip" onclick="filterResources(this,'tcc')">TCC</button>
      <button class="filter-chip" onclick="filterResources(this,'dbt')">DBT</button>
      <button class="filter-chip" onclick="filterResources(this,'act')">ACT</button>
      <button class="filter-chip" onclick="filterResources(this,'rgnr')">RGNR</button>
      <button class="filter-chip" onclick="filterResources(this,'neuro')">Neurosciences</button>
    </div>

    <!-- MERLIN recommande -->
    <div class="merlin-highlight">
      <div class="merlin-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        MERLIN recommande · Basé sur votre dernière séance
      </div>
      <div class="merlin-cards" id="merlin-cards"></div>
    </div>

    <!-- Toutes les ressources -->
    <div class="resources-section">
      <div class="resources-section-title">Bibliothèque complète</div>
      <div class="resources-grid" id="resources-grid"></div>
    </div>
  </main>
</div>

<script>
const RESOURCES = [
  {id:1,title:'Identifier les pensées automatiques',desc:'Fiche pratique pour reconnaître et nommer les pensées automatiques négatives.',tag:'tcc',type:'Fiche',duration:'5 min',merlin:true},
  {id:2,title:'Tolérance à la détresse',desc:'Techniques DBT pour traverser les moments de crise sans aggraver la situation.',tag:'dbt',type:'Exercice',duration:'10 min',merlin:true},
  {id:3,title:'Défusion cognitive — 5 exercices',desc:'Prendre de la distance avec ses pensées sans les combattre.',tag:'act',type:'Exercice',duration:'15 min',merlin:true},
  {id:4,title:'Journal RGNR quotidien',desc:'Modèle de journal pour suivre les 4 axes RGNR au quotidien.',tag:'rgnr',type:'Modèle',duration:'3 min',merlin:false},
  {id:5,title:'Le système nerveux et le stress',desc:'Comprendre la réponse nerveuse autonome pour mieux réguler.',tag:'neuro',type:'Lecture',duration:'8 min',merlin:false},
  {id:6,title:'Restructuration cognitive — Guide',desc:'Identifier les distorsions cognitives et les challenger.',tag:'tcc',type:'Guide',duration:'20 min',merlin:false},
  {id:7,title:'TIPP — Régulation émotionnelle rapide',desc:'Température, Intensité, Pleine conscience, Pause : 4 outils DBT.',tag:'dbt',type:'Fiche',duration:'5 min',merlin:false},
  {id:8,title:'Matrice ACT — Carte visuelle',desc:'Visualiser ses valeurs et ses actions engagées.',tag:'act',type:'Modèle',duration:'15 min',merlin:false},
  {id:9,title:'Check-in corps — Scan corporel',desc:'Micro-pratique de 3 minutes pour se reconnecter à son corps.',tag:'rgnr',type:'Audio',duration:'3 min',merlin:false},
  {id:10,title:'Neuroplasticité et habitudes',desc:'Comment le cerveau se reconfigure par la répétition.',tag:'neuro',type:'Lecture',duration:'12 min',merlin:false},
  {id:11,title:'Registre de pensées TCC',desc:'Tableau structuré pour analyser et recadrer les pensées.',tag:'tcc',type:'Modèle',duration:'10 min',merlin:false},
  {id:12,title:'Pleine conscience — 5 minutes',desc:'Exercice guidé de retour au présent.',tag:'act',type:'Audio',duration:'5 min',merlin:false},
];

const TAG_LABELS = {tcc:'TCC',dbt:'DBT',act:'ACT',rgnr:'RGNR',neuro:'Neuro'};
const TYPE_ICONS = {
  'Fiche':'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  'Exercice':'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
  'Lecture':'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>',
  'Modèle':'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>',
  'Audio':'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>',
};

function cardHTML(r, size='normal'){
  return `<div class="resource-card" data-tag="${r.tag}">
    <div class="resource-card-header">
      <span class="resource-tag tag-${r.tag}">${TAG_LABELS[r.tag]}</span>
    </div>
    <div class="resource-card-title">${r.title}</div>
    <div class="resource-card-desc">${r.desc}</div>
    <div class="resource-card-meta">
      <div class="resource-type-badge">${TYPE_ICONS[r.type]||''} ${r.type}</div>
      <span>${r.duration}</span>
    </div>
  </div>`;
}

function render(filter='all'){
  // MERLIN
  const merlinEl = document.getElementById('merlin-cards');
  merlinEl.innerHTML = RESOURCES.filter(r => r.merlin).map(r => cardHTML(r)).join('');
  // All
  const gridEl = document.getElementById('resources-grid');
  const filtered = filter === 'all' ? RESOURCES : RESOURCES.filter(r => r.tag === filter);
  gridEl.innerHTML = filtered.map(r => cardHTML(r)).join('');
}

function filterResources(btn, filter){
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render(filter);
}

render();

document.querySelectorAll('[data-theme-toggle]').forEach(btn =>{
  btn.addEventListener('click', () =>{
    const html = document.documentElement;
    html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
});
</script>
</body>
</html>
