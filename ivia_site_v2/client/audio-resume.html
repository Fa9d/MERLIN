<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/shared/session.js"></script>
  <script>requireAuth();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVIA — Résumé audio de séance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- WaveSurfer v7 -->
  <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
  <script src="/shared/mock.js"></script>
  <script>tailwind.config={theme:{extend:{colors:{forest:'#4A7C59',sage:'#8FB99A','forest-deep':'#2D6A4F',cream:'#FAFDF8',surface:'#F0F7F2',ink:'#1A2E1D',muted:'#4B6350',bdr:'#D4E8D0',trust:'#2563EB'},fontFamily:{heading:['"Lora"','Georgia','serif']}}}}</script>
  <style>
    body{font-family:'Raleway',system-ui,sans-serif;background:#FAFDF8;color:#1A2E1D;}
    h1,h2{font-family:'Lora',Georgia,serif;}
    /* Conteneur WaveSurfer */
    #waveform{border-radius:12px;overflow:hidden;background:#F0F7F2;padding:12px 0;}
    /* Sélecteur de vitesse */
    .speed-btn{padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;border:1.5px solid #D4E8D0;color:#4B6350;background:#fff;cursor:pointer;transition:all .12s;}
    .speed-btn.active{background:#2D6A4F;border-color:#2D6A4F;color:#fff;}
    .tag{display:inline-block;background:#F0F7F2;border:1px solid #D4E8D0;border-radius:6px;padding:2px 10px;font-size:12px;color:#4B6350;font-weight:500;}
  </style>
</head>
<body class="antialiased min-h-screen bg-cream">

<div id="ivia-header"></div>
<script src="/shared/layout.js?v=20260624b"></script>
<script>renderLayout('parler');</script>

    <main class="mx-auto px-4 sm:px-8 py-8 max-w-[780px]">

      <!-- Breadcrumb -->
      <nav class="text-xs text-muted mb-6 flex items-center gap-1.5" aria-label="Fil d'Ariane">
        <a href="/client/dashboard.html" class="hover:text-ink cursor-pointer">Mon espace</a>
        <span>/</span>
        <span class="text-ink font-medium">Résumé audio</span>
      </nav>

      <!-- En-tête séance -->
      <div class="bg-white border border-bdr rounded-[24px] p-7 mb-5 shadow-sm">
        <div class="flex items-start justify-between gap-4 flex-wrap mb-5">
          <div>
            <h1 id="seance-titre" class="font-heading text-xl font-bold text-ink mb-1">Chargement…</h1>
            <p id="seance-meta" class="text-sm text-muted"></p>
          </div>
          <div id="seance-tags" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- LECTEUR WAVESURFER -->
        <div id="waveform" class="mb-4"></div>

        <!-- Contrôles -->
        <div class="flex items-center gap-4 mb-4 flex-wrap">
          <button id="btn-play-pause"
                  class="w-12 h-12 bg-forest-deep text-white rounded-full flex items-center justify-center hover:bg-forest transition-colors cursor-pointer shrink-0"
                  aria-label="Lire / Pause">
            <svg id="play-pause-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 3l14 9-14 9V3z"/>
            </svg>
          </button>

          <div class="flex-1 min-w-[120px]">
            <div class="flex justify-between text-xs text-muted font-medium mb-1">
              <span id="current-time">0:00</span>
              <span id="total-time">4:12</span>
            </div>
          </div>

          <!-- Volume -->
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-muted shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07"/>
            </svg>
            <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="0.8"
                   class="w-20 accent-forest-deep cursor-pointer" aria-label="Volume">
          </div>
        </div>

        <!-- Vitesse de lecture -->
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs text-muted font-medium">Vitesse :</span>
          <button class="speed-btn active" data-speed="1" onclick="setSpeed(this)">×1</button>
          <button class="speed-btn" data-speed="1.25" onclick="setSpeed(this)">×1.25</button>
          <button class="speed-btn" data-speed="1.5" onclick="setSpeed(this)">×1.5</button>
          <button class="speed-btn" data-speed="2" onclick="setSpeed(this)">×2</button>
        </div>

        <!-- Spinner de chargement -->
        <div id="loading-indicator" class="text-xs text-muted mt-3 hidden">Chargement de l'audio…</div>
      </div>

      <!-- Autres résumés disponibles -->
      <section class="bg-white border border-bdr rounded-[24px] p-6" aria-labelledby="autres-title">
        <h2 id="autres-title" class="font-heading text-base font-semibold text-ink mb-4">Autres résumés</h2>
        <ul id="autres-list" class="space-y-3">
          <li class="text-sm text-muted py-2">Chargement…</li>
        </ul>
      </section>

    </main>

<div id="ivia-footer"></div>
<script>renderLayout('parler');</script>

  <script>
    // ── Render depuis mock (swap → GET /api/v1/client/seances/:id/audio) ──
    getMockSeances().then(seances => {
      // Séance active = sea_001 (ou paramètre URL ?id=)
      const params  = new URLSearchParams(location.search);
      const activeId = params.get('id') || 'sea_001';
      const all     = seances.filter(s => s.audio_resume);
      const active  = all.find(s => s.id === activeId) || all[0];

      if (active) {
        document.getElementById('seance-titre').textContent =
          'Séance du ' + formatDateSeance(active.date_iso);
        document.getElementById('seance-meta').textContent =
          'avec ' + active.praticien.prenom + ' ' + active.praticien.nom[0] + '.' +
          ' · ' + active.format +
          ' · ' + active.audio_resume.duree;
        const tagsEl = document.getElementById('seance-tags');
        (active.tags || []).forEach(t => {
          const s = document.createElement('span');
          s.className = 'tag'; s.textContent = t; tagsEl.appendChild(s);
        });
      }

      // Autres résumés
      const autres = all.filter(s => s.id !== (active && active.id));
      const ul = document.getElementById('autres-list');
      if (autres.length === 0) {
        ul.innerHTML = '<li class="text-sm text-muted py-2">Aucun autre résumé disponible.</li>';
      } else {
        ul.innerHTML = autres.map(s => `
          <li class="flex items-center justify-between gap-4 py-2 border-b border-bdr last:border-0">
            <div>
              <p class="text-sm font-medium text-ink">Séance du ${formatDateSeance(s.date_iso)}</p>
              <p class="text-xs text-muted mt-0.5">${s.praticien.prenom} ${s.praticien.nom[0]}. · ${s.audio_resume.duree} · ${(s.tags||[]).join(', ')}</p>
            </div>
            <a href="/client/audio-resume.html?id=${s.id}"
               class="text-xs font-semibold text-forest border border-bdr px-3 py-1.5 rounded-[8px] hover:bg-surface transition-colors cursor-pointer">
              Écouter
            </a>
          </li>`).join('');
      }
    });

    // ── WaveSurfer ──
    const demoAudioUrl = 'https://upload.wikimedia.org/wikipedia/commons/0/0b/Kaval_sviri.ogg';

    document.getElementById('loading-indicator').classList.remove('hidden');

    const ws = WaveSurfer.create({
      container: '#waveform',
      waveColor: '#8FB99A',
      progressColor: '#2D6A4F',
      cursorColor: '#4A7C59',
      barWidth: 3,
      barRadius: 3,
      barGap: 2,
      height: 80,
      normalize: true,
    });

    ws.load(demoAudioUrl);

    ws.on('ready', () => {
      document.getElementById('loading-indicator').classList.add('hidden');
      document.getElementById('total-time').textContent = formatTime(ws.getDuration());
    });

    ws.on('timeupdate', (t) => {
      document.getElementById('current-time').textContent = formatTime(t);
    });

    ws.on('finish', () => {
      document.getElementById('play-pause-icon').innerHTML = '<path d="M5 3l14 9-14 9V3z"/>';
    });

    document.getElementById('btn-play-pause').addEventListener('click', () => {
      ws.playPause();
      const playing = ws.isPlaying();
      document.getElementById('play-pause-icon').innerHTML = playing
        ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
        : '<path d="M5 3l14 9-14 9V3z"/>';
    });

    document.getElementById('volume-slider').addEventListener('input', (e) => {
      ws.setVolume(parseFloat(e.target.value));
    });

    function setSpeed(btn) {
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ws.setPlaybackRate(parseFloat(btn.dataset.speed));
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60).toString().padStart(2,'0');
      return `${m}:${sec}`;
    }
  </script>

</body>
</html>
