<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="/shared/session.js"></script>
  <script>requireAuth();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVIA — Nouvelle entrée de journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{forest:'#4A7C59',sage:'#8FB99A','forest-deep':'#2D6A4F',cream:'#FAFDF8',surface:'#F0F7F2',ink:'#1A2E1D',muted:'#4B6350',bdr:'#D4E8D0',trust:'#2563EB'},fontFamily:{heading:['"Lora"','Georgia','serif']}}}}</script>
  <style>
    body{font-family:'Raleway',system-ui,sans-serif;background:#FAFDF8;color:#1A2E1D;}
    h1{font-family:'Lora',Georgia,serif;}
    .tag-chip.selected{background:#2D6A4F;color:#fff;border-color:#2D6A4F;}
    #entry-text{resize:vertical;min-height:180px;}
    #char-count.near{color:#b45309;}
    #char-count.over{color:#dc2626;}
  </style>
</head>
<body class="antialiased min-h-screen bg-cream flex flex-col">

<div id="ivia-header"></div>
<script src="/shared/layout.js?v=20260617a"></script>
<script>renderLayout('ecrire');</script>

  <main class="flex-1 max-w-xl mx-auto w-full px-4 py-10">
    <a href="/client/journal.html" class="inline-block text-sm text-muted hover:text-ink transition-colors cursor-pointer mb-6">← Retour au journal</a>
    <h1 class="font-heading text-3xl font-bold text-ink mb-1">Nouvelle entrée</h1>
    <p class="text-xs text-muted mb-8">
      <time id="today-date"></time>
    </p>

    <form id="entry-form" novalidate class="space-y-6">

      <!-- Registres (tags) -->
      <div>
        <label class="block text-xs font-semibold text-ink mb-2.5">Registre(s) <span class="text-muted font-normal">— jusqu'à 3</span></label>
        <div class="flex flex-wrap gap-2">
          <button type="button" data-tag="Corporel"    onclick="toggleTag(this)" class="tag-chip border border-bdr rounded-full text-xs font-semibold text-muted px-4 py-1.5 bg-white cursor-pointer hover:border-forest transition-colors">Corporel</button>
          <button type="button" data-tag="Émotionnel"  onclick="toggleTag(this)" class="tag-chip border border-bdr rounded-full text-xs font-semibold text-muted px-4 py-1.5 bg-white cursor-pointer hover:border-forest transition-colors">Émotionnel</button>
          <button type="button" data-tag="Spirituel"   onclick="toggleTag(this)" class="tag-chip border border-bdr rounded-full text-xs font-semibold text-muted px-4 py-1.5 bg-white cursor-pointer hover:border-forest transition-colors">Spirituel</button>
          <button type="button" data-tag="Relationnel" onclick="toggleTag(this)" class="tag-chip border border-bdr rounded-full text-xs font-semibold text-muted px-4 py-1.5 bg-white cursor-pointer hover:border-forest transition-colors">Relationnel</button>
          <button type="button" data-tag="Mental"      onclick="toggleTag(this)" class="tag-chip border border-bdr rounded-full text-xs font-semibold text-muted px-4 py-1.5 bg-white cursor-pointer hover:border-forest transition-colors">Mental</button>
        </div>
        <p id="tag-error" class="text-red-600 text-xs mt-1.5 hidden">Choisissez au moins un registre.</p>
      </div>

      <!-- Texte libre -->
      <div>
        <label for="entry-text" class="block text-xs font-semibold text-ink mb-1.5">Ce que je porte aujourd'hui</label>
        <textarea id="entry-text" name="entry-text" maxlength="2000"
                  placeholder="Écrivez librement. Cette entrée reste privée."
                  class="w-full border border-bdr rounded-[16px] px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-forest transition bg-white leading-relaxed"
                  oninput="updateCount(this)"></textarea>
        <div class="flex justify-between items-center mt-1">
          <p id="text-error" class="text-red-600 text-xs hidden">Veuillez écrire quelques mots.</p>
          <p id="char-count" class="text-xs text-muted ml-auto">0 / 2000</p>
        </div>
      </div>

      <!-- Intensité -->
      <div>
        <label class="block text-xs font-semibold text-ink mb-2.5">Intensité ressentie aujourd'hui</label>
        <div class="flex gap-2.5 items-end">
          <button type="button" data-level="1" onclick="setLevel(1)" class="level-dot w-8 h-5  rounded-sm bg-bdr hover:bg-sage cursor-pointer transition-colors border border-transparent" title="1"></button>
          <button type="button" data-level="2" onclick="setLevel(2)" class="level-dot w-8 h-7  rounded-sm bg-bdr hover:bg-sage cursor-pointer transition-colors border border-transparent" title="2"></button>
          <button type="button" data-level="3" onclick="setLevel(3)" class="level-dot w-8 h-9  rounded-sm bg-bdr hover:bg-sage cursor-pointer transition-colors border border-transparent" title="3"></button>
          <button type="button" data-level="4" onclick="setLevel(4)" class="level-dot w-8 h-11 rounded-sm bg-bdr hover:bg-sage cursor-pointer transition-colors border border-transparent" title="4"></button>
          <button type="button" data-level="5" onclick="setLevel(5)" class="level-dot w-8 h-14 rounded-sm bg-bdr hover:bg-sage cursor-pointer transition-colors border border-transparent" title="5"></button>
        </div>
        <p id="level-label" class="text-xs text-muted mt-1.5">Aucune sélection</p>
      </div>

      <!-- Boutons -->
      <div class="flex gap-3 pt-2">
        <a href="/client/journal.html"
           class="border border-bdr text-sm font-medium text-ink px-5 py-2.5 rounded-[12px] hover:bg-surface transition-colors cursor-pointer">
          Annuler
        </a>
        <button type="submit"
                class="flex-1 bg-forest-deep text-white font-semibold text-sm px-5 py-2.5 rounded-[12px] hover:bg-forest transition-colors cursor-pointer">
          Enregistrer l'entrée →
        </button>
      </div>

    </form>
  </main>

  <script>
    // Date du jour
    document.getElementById('today-date').textContent = new Date().toLocaleDateString('fr-CA', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

    const levelLabels = ['','Légère', 'Présente', 'Marquée', 'Intense', 'Très intense'];
    let selectedLevel = 0;
    const selectedTags = new Set();

    function toggleTag(btn) {
      const tag = btn.dataset.tag;
      if (selectedTags.has(tag)) {
        selectedTags.delete(tag);
        btn.classList.remove('selected');
      } else {
        if (selectedTags.size >= 3) return;
        selectedTags.add(tag);
        btn.classList.add('selected');
      }
    }

    function setLevel(n) {
      selectedLevel = n;
      document.querySelectorAll('.level-dot').forEach(d => {
        const l = parseInt(d.dataset.level);
        d.classList.toggle('bg-forest', l <= n);
        d.classList.toggle('bg-bdr', l > n);
      });
      document.getElementById('level-label').textContent = levelLabels[n] || '';
    }

    function updateCount(el) {
      const len = el.value.length;
      const c = document.getElementById('char-count');
      c.textContent = `${len} / 2000`;
      c.className = len > 1900 ? 'text-xs over' : len > 1600 ? 'text-xs near' : 'text-xs text-muted';
    }

    document.getElementById('entry-form').addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;

      const tagErr = document.getElementById('tag-error');
      if (selectedTags.size === 0) { tagErr.classList.remove('hidden'); valid = false; }
      else tagErr.classList.add('hidden');

      const textEl = document.getElementById('entry-text');
      const textErr = document.getElementById('text-error');
      if (textEl.value.trim().length < 5) { textErr.classList.remove('hidden'); valid = false; }
      else textErr.classList.add('hidden');

      if (!valid) return;

      const btn = e.target.querySelector('button[type=submit]');
      btn.textContent = 'Enregistrement…';
      btn.disabled = true;
      setTimeout(() => { window.location.href = '/client/journal.html'; }, 900);
    });
  </script>

<div id="ivia-footer"></div>
<script>renderLayout('ecrire');</script>

</body>
</html>
