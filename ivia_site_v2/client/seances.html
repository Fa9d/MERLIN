<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="/shared/session.js"></script>
  <script>requireAuth();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVIA — Mes séances</title>
  <script src="/shared/mock.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{forest:'#4A7C59',sage:'#8FB99A','forest-deep':'#2D6A4F',cream:'#FAFDF8',surface:'#F0F7F2',ink:'#1A2E1D',muted:'#4B6350',bdr:'#D4E8D0',trust:'#2563EB'},fontFamily:{heading:['"Lora"','Georgia','serif']}}}}}</script>
  <style>
    body{font-family:'Raleway',system-ui,sans-serif;background:#FAFDF8;color:#1A2E1D;}
    h1,h2,h3{font-family:'Lora',Georgia,serif;}
    .sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;color:#4B6350;cursor:pointer;transition:all .15s;}
    .sidebar-link:hover{background:#D4E8D0;color:#1A2E1D;}
    .sidebar-link.active{background:#D4E8D0;color:#1A2E1D;font-weight:600;}
    .card{background:#fff;border:1.5px solid #D4E8D0;border-radius:16px;padding:20px 24px;}
    .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
    .badge-upcoming{background:#E8F5EE;color:#2D6A4F;}
    .badge-past{background:#F0F7F2;color:#4B6350;}
    .badge-pending{background:#FEF3C7;color:#92400E;}
  </style>
</head>
<body class="antialiased min-h-screen bg-cream pb-20 lg:pb-0">

  <div class="flex min-h-screen">

    <!-- SIDEBAR desktop -->
    <aside class="hidden lg:flex flex-col w-60 bg-cream border-r border-bdr px-4 py-6 fixed top-0 left-0 h-screen z-10">
      <a href="/" class="font-heading text-xl font-semibold text-forest-deep px-2 mb-8 block">IVIA</a>
      <nav class="flex flex-col gap-1 flex-1">
        <a href="/client/dashboard.html" class="sidebar-link">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Accueil
        </a>
        <a href="/client/seances.html" class="sidebar-link active">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Séances
        </a>
        <a href="/client/journal.html" class="sidebar-link">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
          Journal
        </a>
        <a href="/client/audio-resume.html" class="sidebar-link">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M12 9v6m-3.536-4.536a5 5 0 000 7.072"/></svg>
          Résumés audio
        </a>
        <div class="flex-1"></div>
        <a href="/client/compte.html" class="sidebar-link">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path stroke-linecap="round" stroke-linejoin="round" d="M4 20c0-4 3.582-7 8-7s8 3 8 7"/></svg>
          Mon compte
        </a>
        <div id="sidebar-logout"></div>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 lg:ml-60 px-4 sm:px-8 py-8 max-w-[820px]">

      <!-- Header -->
      <div class="flex items-start justify-between mb-8">
        <div>
          <h1 class="font-heading text-2xl font-bold text-ink mb-1">Mes séances</h1>
          <p class="text-sm text-muted">Vos séances passées et à venir avec votre praticien·ne.</p>
        </div>
        <a href="/rendez-vous.html"
           class="inline-flex items-center gap-2 bg-forest-deep text-white text-sm font-semibold px-5 py-2.5 rounded-[12px] hover:bg-forest transition-colors cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Réserver une séance
        </a>
      </div>

      <!-- Prochaine séance -->
      <section class="card mb-6" aria-labelledby="prochaine-title" id="prochaine-section">
        <div class="flex items-center justify-between mb-4">
          <h2 id="prochaine-title" class="font-heading text-base font-semibold text-ink">Prochaine séance</h2>
          <span class="badge badge-upcoming">À venir</span>
        </div>
        <div id="prochaine-content" class="flex items-start gap-4">
          <!-- rempli par JS -->
        </div>
      </section>

      <!-- Séances passées -->
      <section aria-labelledby="passees-title">
        <h2 id="passees-title" class="font-heading text-base font-semibold text-ink mb-4">Séances passées</h2>
        <div class="space-y-3" id="passees-list">
          <!-- rempli par JS -->
        </div>
      </section>

    </main>
  </div>

  <!-- NAV MOBILE -->
  <nav class="fixed bottom-0 left-0 right-0 lg:hidden bg-white border-t border-bdr flex justify-around py-2 z-20" aria-label="Navigation mobile">
    <a href="/client/dashboard.html" class="flex flex-col items-center gap-0.5 px-3 py-1 text-muted">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span class="text-[10px] font-medium">Accueil</span>
    </a>
    <a href="/client/seances.html" class="flex flex-col items-center gap-0.5 px-3 py-1 text-forest-deep">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <span class="text-[10px] font-semibold">Séances</span>
    </a>
    <a href="/client/journal.html" class="flex flex-col items-center gap-0.5 px-3 py-1 text-muted">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
      <span class="text-[10px] font-medium">Journal</span>
    </a>
    <a href="/client/compte.html" class="flex flex-col items-center gap-0.5 px-3 py-1 text-muted">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path stroke-linecap="round" stroke-linejoin="round" d="M4 20c0-4 3.582-7 8-7s8 3 8 7"/></svg>
      <span class="text-[10px] font-medium">Compte</span>
    </a>
  </nav>

  <script>
    // ── Logout ────────────────────────────────────────────────────────────────
    renderLogoutButton(document.getElementById('sidebar-logout'));

    // ── Helpers render ─────────────────────────────────────────────────
    function moisAbrege(isoDate) {
      return new Date(isoDate).toLocaleDateString('fr-CA', { month: 'short' }).replace('.','');
    }
    function jourNum(isoDate) {
      return new Date(isoDate).getDate();
    }

    // ── Prochaine séance ───────────────────────────────────────────────
    getMockSeances().then(seances => {
      const a_venir = seances
        .filter(s => s.statut === 'confirmee' || s.statut === 'en_attente')
        .sort((a, b) => new Date(a.date_iso) - new Date(b.date_iso));
      const passees = seances
        .filter(s => s.statut === 'complete')
        .sort((a, b) => new Date(b.date_iso) - new Date(a.date_iso));

      // Prochaine
      const prochaine = a_venir[0];
      const pc = document.getElementById('prochaine-content');
      if (prochaine && pc) {
        pc.innerHTML = `
          <div class="w-12 h-12 rounded-[12px] bg-surface border border-bdr flex flex-col items-center justify-center shrink-0">
            <span class="text-[10px] font-semibold text-forest uppercase">${moisAbrege(prochaine.date_iso)}</span>
            <span class="text-xl font-bold text-ink leading-none">${jourNum(prochaine.date_iso)}</span>
          </div>
          <div class="flex-1">
            <p class="font-semibold text-ink">${formatDateSeance(prochaine.date_iso)}</p>
            <p class="text-sm text-muted mt-0.5">Avec <strong class="text-forest-deep">${prochaine.praticien.prenom} ${prochaine.praticien.nom.charAt(0)}.</strong> · ${prochaine.format} · ${prochaine.duree_min} min</p>
            <div class="flex gap-2 mt-3">
              <a href="/client/premier-ancrage.html" class="text-xs font-semibold text-forest-deep border border-bdr rounded-[8px] px-3 py-1.5 hover:bg-surface transition-colors">
                Préparer →
              </a>
              <button onclick="annulerSeance('${prochaine.id}')" class="text-xs font-medium text-muted hover:text-ink px-3 py-1.5">
                Annuler
              </button>
            </div>
          </div>`;
      } else if (pc) {
        document.getElementById('prochaine-section').classList.add('hidden');
      }

      // Passées
      const list = document.getElementById('passees-list');
      if (list) {
        list.innerHTML = passees.map(s => `
          <div class="card flex items-start gap-4">
            <div class="w-12 h-12 rounded-[12px] bg-surface border border-bdr flex flex-col items-center justify-center shrink-0">
              <span class="text-[10px] font-semibold text-muted uppercase">${moisAbrege(s.date_iso)}</span>
              <span class="text-xl font-bold text-ink leading-none">${jourNum(s.date_iso)}</span>
            </div>
            <div class="flex-1">
              <div class="flex items-center gap-2 mb-0.5">
                <p class="font-semibold text-ink text-sm">${formatDateSeance(s.date_iso)}</p>
                <span class="badge badge-past">Passée</span>
              </div>
              <p class="text-xs text-muted">Avec ${s.praticien.prenom} ${s.praticien.nom.charAt(0)}. · ${s.format} · ${s.duree_min} min</p>
              <div class="flex gap-2 mt-2">
                ${s.audio_resume ? `<a href="${s.audio_resume.url}" class="text-xs font-semibold text-forest-deep hover:underline">Écouter le résumé →</a>` : '<span class="text-xs text-muted">Résumé non disponible</span>'}
              </div>
            </div>
          </div>`).join('');
      }
    });

    function annulerSeance(id) {
      if (confirm('Annuler cette séance ? Cette action est irréversible.')) {
        alert('Annulation enregistrée. Vous recevrez une confirmation par courriel.');
      }
    }
  </script>

</body>
</html>
