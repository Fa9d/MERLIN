<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/shared/session.js"></script>
  <script>requireAuth();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVIA — Mes séances</title>
  <script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('ivia_recorder_theme')||'signature';}catch(e){document.documentElement.dataset.theme='signature';}})();</script>
  <script src="/shared/api.js?v=20260702b"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/ivia-espace.css?v=20260624a" data-ivia-espace="1">
  <script>tailwind.config={theme:{extend:{colors:{forest:'var(--forest)',sage:'var(--sage)','forest-deep':'var(--forest-deep)',cream:'var(--cream)',surface:'var(--surface)',ink:'var(--ink)',muted:'var(--muted)',bdr:'var(--bdr)',card:'var(--card-bg)',trust:'#2563EB'},fontFamily:{heading:['"Lora"','Georgia','serif']}}}}}</script>
  <style>
    body{font-family:'Raleway',system-ui,sans-serif;background:var(--cream);color:var(--ink);}
    h1,h2,h3{font-family:'Lora',Georgia,serif;}
    .sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;}
    .sidebar-link:hover{background:var(--surface);color:var(--ink);}
    .sidebar-link.active{background:var(--surface);color:var(--ink);font-weight:600;}
    .card{background:var(--card-bg);border:1.5px solid var(--bdr);border-radius:16px;padding:20px 24px;}
    .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
    .badge-upcoming{background:#E8F5EE;color:#2D6A4F;}
    .badge-past{background:#F0F7F2;color:#4B6350;}
    .badge-pending{background:#FEF3C7;color:#92400E;}
  </style>
</head>
<body class="antialiased min-h-screen bg-cream">

<div id="ivia-header"></div>
<script src="/shared/layout.js?v=20260702a"></script>
<script>renderLayout('aujourdhui', 'Mes séances');</script>

    <!-- MAIN -->
    <main class="max-w-5xl mx-auto px-4 sm:px-8 py-8">

      <!-- Header -->
      <div class="flex items-start justify-between mb-8">
        <div>
          <h1 class="font-heading text-2xl font-bold text-ink mb-1">Mes séances</h1>
          <p class="text-sm text-muted">Vos séances passées et à venir avec votre praticien·ne.
            Entre les séances : <a href="/client/mes-enregistrements.html" class="font-semibold text-forest-deep hover:underline">vos enregistrements solo →</a></p>
        </div>
        <a href="/reserver.html"
           class="inline-flex items-center gap-2 bg-forest-deep text-white text-sm font-semibold px-5 py-2.5 rounded-[12px] hover:bg-forest transition-colors cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Réserver une séance
        </a>
      </div>

      <!-- Prochaine séance -->
      <section class="card mb-6" aria-labelledby="prochaine-title" id="prochaine-section">
        <div class="flex items-center justify-between mb-4">
          <h2 id="prochaine-title" class="font-heading text-base font-semibold text-ink">Prochaine séance</h2>
          <span class="badge badge-upcoming">À venir</span>
        </div>
        <div id="prochaine-content" class="flex items-start gap-4">
          <!-- rempli par JS -->
        </div>
      </section>

      <!-- Séances passées -->
      <section aria-labelledby="passees-title" id="liste-section">
        <h2 id="passees-title" class="font-heading text-base font-semibold text-ink mb-4">Séances passées</h2>
        <div class="space-y-3" id="passees-list">
          <!-- rempli par JS -->
        </div>
      </section>

    </main>

<div id="ivia-footer"></div>
<script>renderLayout('aujourdhui', 'Mes séances');</script>

  <script>
    // ── Helpers d'affichage ────────────────────────────────────────────
    function moisAbrege(isoDate) {
      return new Date(isoDate + 'T12:00:00').toLocaleDateString('fr-CA', { month: 'short' }).replace('.', '');
    }
    function jourNum(isoDate) {
      return new Date(isoDate + 'T12:00:00').getDate();
    }
    function dateLongue(isoDate) {
      return new Date(isoDate + 'T12:00:00').toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }
    function renderSessionCard(s, badgeLabel, badgeClass) {
      return `
        <div class="card flex items-start gap-4">
          <div class="w-12 h-12 rounded-[12px] bg-surface border border-bdr flex flex-col items-center justify-center shrink-0">
            <span class="text-[10px] font-semibold text-muted uppercase">${moisAbrege(s.slot_date)}</span>
            <span class="text-xl font-bold text-ink leading-none">${jourNum(s.slot_date)}</span>
          </div>
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-0.5">
              <p class="font-semibold text-ink text-sm">${dateLongue(s.slot_date)}</p>
              <span class="badge ${badgeClass}">${badgeLabel}</span>
            </div>
            <p class="text-xs text-muted">${formatHeure(s.start_time)} – ${formatHeure(s.end_time)}</p>
          </div>
        </div>`;
    }

    // ── Séances réelles — GET /bookings/my (hold + confirmées) ──────────
    async function chargerSeances() {
      const pc   = document.getElementById('prochaine-content');
      const list = document.getElementById('passees-list');
      const prochaineSection = document.getElementById('prochaine-section');
      const listeSection = document.getElementById('liste-section');
      const listeTitle = document.getElementById('passees-title');
      const vue = new URLSearchParams(location.search).get('vue');
      const vueAVenir = vue === 'a-venir';
      const vueVecues = vue === 'vecues';
      let slots = [];
      try {
        slots = await getMyBookings();
      } catch (e) {
        if (list) list.innerHTML = '<p class="text-sm text-muted">Vos séances apparaîtront ici.</p>';
        prochaineSection.classList.add('hidden');
        return;
      }

      const aujourdhui = new Date().toISOString().slice(0, 10);
      const a_venir = slots.filter(s => s.slot_date >= aujourdhui);
      const passees = slots.filter(s => s.slot_date < aujourdhui).reverse();

      if (vueVecues) {
        prochaineSection.classList.add('hidden');
        listeTitle.textContent = 'Séances vécues';
      } else if (vueAVenir) {
        listeTitle.textContent = 'Autres séances à venir';
      } else {
        listeTitle.textContent = 'Séances passées';
      }

      // Prochaine séance
      const prochaine = a_venir[0];
      if (!vueVecues && prochaine && pc) {
        const enAttente = prochaine.status === 'hold';
        const badge = document.querySelector('#prochaine-section .badge');
        if (badge) badge.textContent = enAttente ? 'À confirmer' : 'À venir';
        pc.innerHTML = `
          <div class="w-12 h-12 rounded-[12px] bg-surface border border-bdr flex flex-col items-center justify-center shrink-0">
            <span class="text-[10px] font-semibold text-forest uppercase">${moisAbrege(prochaine.slot_date)}</span>
            <span class="text-xl font-bold text-ink leading-none">${jourNum(prochaine.slot_date)}</span>
          </div>
          <div class="flex-1">
            <p class="font-semibold text-ink">${dateLongue(prochaine.slot_date)}</p>
            <p class="text-sm text-muted mt-0.5">${formatHeure(prochaine.start_time)} – ${formatHeure(prochaine.end_time)}${enAttente ? ' · <strong class="text-amber-700">paiement à compléter</strong>' : ' · le lien arrive par courriel avant l\'heure'}</p>
            <div class="flex gap-2 mt-3">
              ${enAttente ? `<button onclick="payerSeance('${prochaine.id}')" class="text-sm font-semibold bg-forest-deep text-white rounded-[10px] px-5 py-2 hover:bg-forest transition-colors cursor-pointer">Payer maintenant →</button>` : ''}
              <button onclick="annulerSeance('${prochaine.id}')"               class="text-xs font-medium text-muted hover:text-red-600 px-3 py-1.5 cursor-pointer">
                Annuler
              </button>
            </div>
          </div>`;
      } else {
        prochaineSection.classList.add('hidden');
      }

      // Liste secondaire selon la vue
      if (list) {
        const items = vueAVenir ? a_venir.slice(1) : passees;
        if (!items.length) {
          list.innerHTML = vueAVenir
           ? `<p class="text-sm text-muted">Aucune autre séance à venir pour l'instant.</p>`
           : `<p class="text-sm text-muted">Aucune séance passée pour l'instant.</p>`;
          if (vueAVenir && !prochaine) {
           listeSection.classList.add('hidden');
          }
          return;
        }
        list.innerHTML = items.map(s => renderSessionCard(
          s,
          vueAVenir ? (s.status === 'hold' ? 'À confirmer' : 'À venir') : 'Passée',
          vueAVenir ? (s.status === 'hold' ? 'badge-pending' : 'badge-upcoming') : 'badge-past'
        )).join('');
      }
    }
    chargerSeances();

    async function annulerSeance(id) {
      if (!confirm('Annuler cette séance ?')) return;
      try {
        await cancelSlot(id);
        location.reload();
      } catch (e) {
        alert("L'annulation n'a pas pu être enregistrée. Réessayez ou écrivez-nous.");
      }
    }

    // Aller droit au paiement du créneau déjà retenu (page Stripe ou paiement simulé en test).
    async function payerSeance(slotId) {
      try {
        const r = await bookingCheckout({
          slot_id: slotId,
          success_url: location.origin + '/checkout/success.html',
          cancel_url:  location.origin + '/client/seances.html',
        });
        window.location.href = r.checkout_url;
      } catch (e) {
        alert("Ce créneau ne peut plus être réglé : " + (e.message || 'réessayez') +
              ".\nIl a peut-être expiré (les places sont tenues 15 min). Reprenez une réservation.");
        window.location.href = '/reserver.html';
      }
    }
  </script>

</body>
</html>
