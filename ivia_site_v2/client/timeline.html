<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon historique de séances — IVIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-purple-600">IVIA</a>
            <div class="flex gap-4 items-center">
                <a href="/client/mon-espace.html" class="text-sm text-gray-600 hover:text-gray-900">Accueil</a>
                <a href="/client/agenda.html" class="text-sm text-gray-600 hover:text-gray-900">Agenda</a>
                <a href="/client/timeline.html" class="text-sm text-purple-600 font-semibold">Historique</a>
                <button id="logout-btn" class="text-sm text-red-600 hover:text-red-700">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">📋 Mon historique de séances</h1>
            <p class="text-gray-600">Consultez vos rendez-vous passés et à venir, avec paiement et notes de séance</p>
        </div>

        <!-- Filtres -->
        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
            <div class="flex gap-3 flex-wrap">
                <button onclick="filterBy('all')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-purple-600 text-white" data-status="all">
                    Toutes
                </button>
                <button onclick="filterBy('scheduled')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300" data-status="scheduled">
                    Planifiées
                </button>
                <button onclick="filterBy('paid')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300" data-status="paid">
                    ✓ Payées
                </button>
                <button onclick="filterBy('noted')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300" data-status="noted">
                    📄 Complétées
                </button>
                <button onclick="filterBy('cancelled')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300" data-status="cancelled">
                    ✗ Annulées
                </button>
            </div>
        </div>

        <!-- Timeline -->
        <div id="timeline" class="space-y-4">
            <div class="bg-white rounded-lg shadow-sm p-6 text-center text-gray-500">
                Chargement...
            </div>
        </div>
    </div>

    <!-- Modal pour détails -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[1000]">
        <div class="bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b p-4 flex justify-between items-center">
                <h2 id="modal-title" class="text-xl font-bold"></h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="modal-content" class="p-6"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';
        const TOKEN = localStorage.getItem('access_token');
        let currentFilter = 'all';

        async function loadTimeline(status = 'all') {
            const timelineEl = document.getElementById('timeline');
            timelineEl.innerHTML = '<div class="text-center text-gray-500">Chargement...</div>';

            try {
                const url = status === 'all'
                    ? `${API_BASE}/appointments/history?limit=100`
                    : `${API_BASE}/appointments/history?status=${status}&limit=100`;

                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                const appointments = data.appointments || [];

                if (appointments.length === 0) {
                    timelineEl.innerHTML = '<div class="bg-white rounded-lg shadow-sm p-6 text-center text-gray-500">Aucun rendez-vous pour ce filtre</div>';
                    return;
                }

                // Trier par date décroissante (plus récent d'abord)
                appointments.sort((a, b) => new Date(b.scheduled_at) - new Date(a.scheduled_at));

                // Grouper par mois
                const grouped = groupByMonth(appointments);
                timelineEl.innerHTML = '';

                for (const [monthKey, items] of Object.entries(grouped)) {
                    const monthEl = createMonthSection(monthKey, items);
                    timelineEl.appendChild(monthEl);
                }
            } catch (error) {
                console.error('Erreur chargement timeline:', error);
                timelineEl.innerHTML = `<div class="bg-white rounded-lg shadow-sm p-6 text-center text-red-500">Erreur lors du chargement</div>`;
            }
        }

        function groupByMonth(appointments) {
            const grouped = {};

            appointments.forEach(apt => {
                const date = new Date(apt.scheduled_at);
                const monthKey = date.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
                
                if (!grouped[monthKey]) {
                    grouped[monthKey] = [];
                }
                grouped[monthKey].push(apt);
            });

            return grouped;
        }

        function createMonthSection(monthKey, appointments) {
            const section = document.createElement('div');
            section.className = 'bg-white rounded-lg shadow-sm overflow-hidden';

            const header = document.createElement('div');
            header.className = 'bg-gray-100 px-6 py-3 border-b font-semibold text-gray-700 uppercase text-xs tracking-wider';
            header.textContent = monthKey;
            section.appendChild(header);

            const list = document.createElement('div');
            list.className = 'divide-y';

            appointments.forEach(apt => {
                const card = createAppointmentCard(apt);
                list.appendChild(card);
            });

            section.appendChild(list);
            return section;
        }

        function createAppointmentCard(apt) {
            const card = document.createElement('div');
            card.className = 'p-6 hover:bg-gray-50 cursor-pointer transition';
            card.onclick = () => showDetail(apt);

            // Formatage date
            const date = new Date(apt.scheduled_at);
            const dateStr = date.toLocaleDateString('fr-FR', { weekday: 'short', year: '2-digit', month: 'short', day: 'numeric' });
            const timeStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

            // Badge statut
            const statusBadges = {
                'scheduled': '<span class="inline-block bg-blue-100 text-blue-700 text-xs font-semibold px-2 py-1 rounded">Planifiée</span>',
                'confirmed': '<span class="inline-block bg-yellow-100 text-yellow-700 text-xs font-semibold px-2 py-1 rounded">Confirmée</span>',
                'paid': '<span class="inline-block bg-green-100 text-green-700 text-xs font-semibold px-2 py-1 rounded">✓ Payée</span>',
                'noted': '<span class="inline-block bg-purple-100 text-purple-700 text-xs font-semibold px-2 py-1 rounded">📄 Complétée</span>',
                'cancelled': '<span class="inline-block bg-red-100 text-red-700 text-xs font-semibold px-2 py-1 rounded">✗ Annulée</span>',
            };

            // Montant (si payé)
            let amountStr = '';
            if (apt.amount_cents && (apt.status === 'paid' || apt.status === 'noted')) {
                const amount = (apt.amount_cents / 100).toFixed(2);
                amountStr = `<span class="text-green-600 font-semibold">${amount} CAD</span>`;
            }

            card.innerHTML = `
                <div class="flex justify-between items-start gap-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="text-sm font-medium text-gray-500">${dateStr} ${timeStr}</div>
                            ${statusBadges[apt.status] || ''}
                        </div>
                        <div class="text-lg font-semibold text-gray-900">${apt.practitioner_name || 'Praticien'}</div>
                        ${apt.session_notes ? `<p class="text-sm text-gray-600 mt-2 line-clamp-2">${apt.session_notes}</p>` : ''}
                    </div>
                    <div class="text-right">
                        ${amountStr ? `<div class="mb-2">${amountStr}</div>` : ''}
                        <div class="text-sm text-gray-500">${apt.duration_minutes || 60} min</div>
                    </div>
                </div>
            `;

            return card;
        }

        function filterBy(status) {
            currentFilter = status;

            // Mettre à jour les boutons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-purple-600', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-700');
                if (btn.dataset.status === status) {
                    btn.classList.add('bg-purple-600', 'text-white');
                    btn.classList.remove('bg-gray-200', 'text-gray-700');
                }
            });

            loadTimeline(status);
        }

        async function showDetail(apt) {
            const modal = document.getElementById('detail-modal');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');

            // Récupérer le détail complet (avec audit trail)
            try {
                const response = await fetch(`${API_BASE}/appointments/${apt.id}`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });

                if (!response.ok) throw new Error('Erreur');

                const fullApt = await response.json();

                title.textContent = `Séance avec ${fullApt.practitioner_name}`;

                // Formatage dates
                const scheduedDate = new Date(fullApt.scheduled_at);
                const scheduledStr = scheduedDate.toLocaleDateString('fr-FR', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // Audit trail
                let auditHtml = '<h3 class="font-semibold text-gray-900 mt-6 mb-3">📋 Historique</h3><div class="space-y-2">';
                if (fullApt.audit_trail && fullApt.audit_trail.length > 0) {
                    fullApt.audit_trail.forEach(entry => {
                        const entryDate = new Date(entry.at).toLocaleString('fr-FR');
                        const actionLabel = {
                            'created': '✓ Créée',
                            'confirmed': '✓ Confirmée',
                            'paid': '✓ Payée',
                            'noted': '✓ Complétée'
                        }[entry.action] || entry.action;
                        auditHtml += `<div class="text-sm text-gray-600"><strong>${actionLabel}</strong> — ${entryDate} par ${entry.by}</div>`;
                    });
                }
                auditHtml += '</div>';

                // Notes
                let notesHtml = '';
                if (fullApt.session_notes) {
                    notesHtml = `
                        <div class="bg-blue-50 border border-blue-200 rounded p-4 mt-6">
                            <h3 class="font-semibold text-blue-900 mb-2">📝 Notes de séance</h3>
                            <p class="text-blue-800">${fullApt.session_notes}</p>
                        </div>
                    `;
                }

                content.innerHTML = `
                    <div>
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <div class="text-sm text-gray-500">Date et heure</div>
                                <div class="font-semibold text-gray-900">${scheduledStr}</div>
                            </div>
                            <div>
                                <div class="text-sm text-gray-500">Durée</div>
                                <div class="font-semibold text-gray-900">${fullApt.duration_minutes || 60} minutes</div>
                            </div>
                            <div>
                                <div class="text-sm text-gray-500">Statut</div>
                                <div class="font-semibold text-gray-900">${fullApt.status}</div>
                            </div>
                            ${fullApt.amount_cents ? `
                            <div>
                                <div class="text-sm text-gray-500">Montant</div>
                                <div class="font-semibold text-green-600">${(fullApt.amount_cents / 100).toFixed(2)} CAD</div>
                            </div>
                            ` : ''}
                        </div>

                        ${notesHtml}
                        ${auditHtml}
                    </div>
                `;

                modal.classList.remove('hidden');
            } catch (error) {
                console.error('Erreur détail:', error);
                content.innerHTML = '<div class="text-red-500">Erreur lors du chargement</div>';
            }
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        document.getElementById('logout-btn').onclick = () => {
            localStorage.removeItem('access_token');
            window.location.href = '/';
        };

        // Charger timeline au démarrage
        loadTimeline();
    </script>
</body>
</html>
