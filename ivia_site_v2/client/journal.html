<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script>if(!localStorage.getItem('ivia_session')){location.replace('/connexion.html?retour='+encodeURIComponent(location.pathname+location.search));}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>IVIA — Journal</title>
  <script src="/shared/api.js?v=20260615b"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{forest:'#4A7C59',sage:'#8FB99A','forest-deep':'#2D6A4F',cream:'#FAFDF8',surface:'#F0F7F2',ink:'#1A2E1D',muted:'#4B6350',bdr:'#D4E8D0'},fontFamily:{heading:['"Lora"','Georgia','serif']}}}}</script>
  <style>
    body{font-family:'Raleway',system-ui,sans-serif;background:#FAFDF8;color:#1A2E1D;}
    h1,h2{font-family:'Lora',Georgia,serif;}
    .tone-chip{border:1.5px solid #D4E8D0;border-radius:99px;padding:5px 14px;font-size:12px;font-weight:600;color:#4B6350;cursor:pointer;background:#fff;transition:all .15s;}
    .tone-chip.selected{background:#2D6A4F;border-color:#2D6A4F;color:#fff;}
  </style>
</head>
<body class="antialiased">

<div id="ivia-header"></div>
<script src="/shared/layout.js?v=20260611d"></script>
<script>renderLayout('ecrire');</script>

<div class="max-w-3xl mx-auto px-4 py-10 space-y-8">

  <!-- Composer -->
  <section class="bg-white border border-bdr rounded-[20px] p-6">
    <h1 class="font-heading text-xl font-bold text-ink mb-1">Déposer ce qui est là.</h1>
    <p class="text-sm text-muted mb-4">Quelques mots suffisent. Personne ne corrige, personne ne note.</p>

    <textarea id="entry-text" rows="5" placeholder="Aujourd'hui…"
      class="w-full border border-bdr rounded-[14px] px-4 py-3 text-sm bg-surface focus:outline-none focus:ring-2 focus:ring-forest resize-none"></textarea>

    <p class="text-xs font-semibold text-muted uppercase tracking-wider mt-4 mb-2">Le ton du moment <span class="font-normal normal-case">(facultatif)</span></p>
    <div class="flex flex-wrap gap-2" id="tones">
      <button class="tone-chip" data-tone="calme">calme</button>
      <button class="tone-chip" data-tone="charge">chargé·e</button>
      <button class="tone-chip" data-tone="fatigue">fatigué·e</button>
      <button class="tone-chip" data-tone="confus">confus·e</button>
      <button class="tone-chip" data-tone="leger">léger·ère</button>
      <button class="tone-chip" data-tone="triste">triste</button>
      <button class="tone-chip" data-tone="en_colere">en colère</button>
    </div>

    <div id="entry-error" class="hidden mt-4 bg-red-50 border border-red-200 rounded-[10px] px-4 py-3 text-sm text-red-700"></div>

    <button id="btn-save" class="mt-5 bg-forest-deep text-white font-semibold px-6 py-3 rounded-[14px] hover:bg-forest transition-colors cursor-pointer">
      Déposer cette entrée
    </button>
  </section>

  <!-- Entrées -->
  <section>
    <h2 class="font-heading text-lg font-bold text-ink mb-4">Vos entrées</h2>
    <div id="entries" class="space-y-3">
      <p class="text-sm text-muted">Chargement…</p>
    </div>
  </section>

</div>

<p class="max-w-3xl mx-auto px-4 text-center text-xs text-muted">
  Votre journal vous appartient. Il n'est partagé avec votre praticien·ne que si vous le décidez, en séance.
</p>
<div id="ivia-footer"></div>
<script>renderLayout('ecrire');</script>

<script>
(function () {
  let selectedTone = null;
  document.querySelectorAll('.tone-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const isSel = chip.classList.contains('selected');
      document.querySelectorAll('.tone-chip').forEach(c => c.classList.remove('selected'));
      selectedTone = isSel ? null : chip.dataset.tone;
      if (!isSel) chip.classList.add('selected');
    });
  });

  const TONES_LABELS = { calme:'calme', charge:'chargé·e', fatigue:'fatigué·e', confus:'confus·e', leger:'léger·ère', triste:'triste', en_colere:'en colère' };

  async function chargerEntrees() {
    const zone = document.getElementById('entries');
    try {
      const entries = await getMyJournal();
      zone.innerHTML = '';
      if (!entries.length) {
        zone.innerHTML = '<p class="text-sm text-muted">Encore vierge. La première entrée est souvent la plus courte.</p>';
        return;
      }
      entries
        .sort((a, b) => new Date(b.written_at) - new Date(a.written_at))
        .forEach(en => {
          const d = new Date(en.written_at);
          const el = document.createElement('article');
          el.className = 'bg-white border border-bdr rounded-[16px] px-5 py-4';
          el.innerHTML = `
            <p class="text-xs text-muted mb-1.5">${d.toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
              · ${d.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}${en.emotional_tone ? ' · <span class="text-forest font-medium">' + (TONES_LABELS[en.emotional_tone] || en.emotional_tone) + '</span>' : ''}</p>
            <p class="text-sm text-ink leading-relaxed whitespace-pre-wrap entry-body"></p>`;
          el.querySelector('.entry-body').textContent = en.body_text;
          zone.appendChild(el);
        });
    } catch (err) {
      zone.innerHTML = '<p class="text-sm text-muted">Vos entrées apparaîtront ici après votre première écriture.</p>';
    }
  }

  document.getElementById('btn-save').addEventListener('click', async () => {
    const txt = document.getElementById('entry-text').value.trim();
    const errDiv = document.getElementById('entry-error');
    const btn = document.getElementById('btn-save');
    errDiv.classList.add('hidden');
    if (!txt) { errDiv.textContent = 'Quelques mots d\'abord — même trois.'; errDiv.classList.remove('hidden'); return; }

    btn.disabled = true; btn.textContent = 'Dépôt en cours…';
    try {
      await createMyJournalEntry({ body_text: txt, emotional_tone: selectedTone || null });
      document.getElementById('entry-text').value = '';
      document.querySelectorAll('.tone-chip').forEach(c => c.classList.remove('selected'));
      selectedTone = null;
      await chargerEntrees();
    } catch (err) {
      errDiv.textContent = err.message || 'Impossible d\'enregistrer. Réessayez.';
      errDiv.classList.remove('hidden');
    } finally {
      btn.disabled = false; btn.textContent = 'Déposer cette entrée';
    }
  });

  chargerEntrees();
})();
</script>

</body>
</html>
