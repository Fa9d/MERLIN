<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/shared/session.js?v=20260709b"></script>
  <script>requireAuth();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVIA — Mes exercices</title>
  <script src="/shared/api.js?v=20260709b"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('ivia_recorder_theme')||'signature';}catch(e){document.documentElement.dataset.theme='signature';}})();</script>
  <link rel="stylesheet" href="/shared/ivia-espace.css?v=20260709b" data-ivia-espace="1">
  <script>tailwind.config={theme:{extend:{colors:{forest:'var(--forest)',sage:'var(--sage)','forest-deep':'var(--forest-deep)',cream:'var(--cream)',surface:'var(--surface)',ink:'var(--ink)',muted:'var(--muted)',bdr:'var(--bdr)',card:'var(--card-bg)'},fontFamily:{heading:['"Lora"','Georgia','serif']}}}}</script>
  <style>
    body { font-family: 'Raleway', system-ui, sans-serif; background-color: var(--surface); color: var(--ink); }
    h1, h2, h3 { font-family: 'Lora', Georgia, serif; }
    .card { background: var(--card-bg); border: 1.5px solid var(--bdr); border-radius: 20px; padding: 24px; }
    .chip { display:inline-block; background:var(--surface); border:1px solid var(--bdr); border-radius:999px; padding:2px 10px; font-size:11px; font-weight:600; color:var(--muted); }
    .btn { font-size:13px; font-weight:600; border-radius:10px; padding:7px 14px; cursor:pointer; transition:all .15s; border:1.5px solid var(--bdr); background:var(--card-bg); color:var(--ink); }
    .btn:hover { border-color: var(--forest); }
    .btn.primary { background: var(--forest-deep); border-color: var(--forest-deep); color:#fff; }
    .btn.primary:hover { background: var(--forest); }
  </style>
</head>
<body class="antialiased min-h-screen">
<script src="/shared/layout.js?v=20260709c"></script>
<script>renderLayout('aujourdhui', 'Mes exercices');</script>

<main class="max-w-2xl mx-auto px-4 py-8">
  <header class="mb-6">
    <h1 class="text-2xl font-bold">Mes exercices</h1>
    <p class="text-sm text-muted mt-1">
      Des invitations proposées en séance — à ton rythme, sans obligation.
      Mettre un exercice de côté est un choix, pas un échec.
    </p>
  </header>

  <div id="vide" class="hidden card text-sm text-muted">
    Aucun exercice pour l'instant. Ton praticien pourra t'en proposer en séance.
  </div>
  <div id="liste" class="space-y-4"></div>
</main>

<script>
  (async function () {
    const esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
    const STATUT = { propose: 'proposé', en_cours: 'en cours', termine: 'terminé', abandonne: 'mis de côté' };
    const liste = document.getElementById('liste');

    function actions(e) {
      const b = [];
      if (e.status === 'propose') b.push(['en_cours', 'Je commence', 'primary']);
      if (e.status === 'en_cours') {
        b.push(['termine', "Je l'ai fait", 'primary']);
        b.push(['abandonne', 'Je le mets de côté', '']);
      }
      if (e.status === 'abandonne') b.push(['en_cours', 'Je réessaie', '']);
      return b.map(([st, label, cls]) =>
        `<button class="btn ${cls}" data-id="${esc(e.id)}" data-st="${st}">${label}</button>`
      ).join(' ');
    }

    function render(e) {
      return `
        <div class="card">
          <div class="flex items-start justify-between gap-3 flex-wrap">
            <h2 class="text-base font-bold">${esc(e.exercise.title)}</h2>
            <span class="chip">${esc(STATUT[e.status] || e.status)}</span>
          </div>
          <p class="text-sm leading-relaxed mt-2">${esc(e.exercise.instructions)}</p>
          ${e.message ? '<p class="text-xs text-muted mt-2 italic">Mot de ton praticien : « ' + esc(e.message) + ' »</p>' : ''}
          <div class="flex gap-2 mt-4 flex-wrap">${actions(e)}</div>
          <div class="mt-3">
            <textarea class="w-full text-sm border rounded-[10px] px-3 py-2" style="border-color:var(--bdr);background:var(--card-bg)"
              rows="2" placeholder="Comment ça s'est passé ? (optionnel — visible par ton praticien)"
              data-note="${esc(e.id)}">${esc(e.client_note || '')}</textarea>
            <button class="btn mt-1" data-save="${esc(e.id)}">Garder ma note</button>
          </div>
        </div>`;
    }

    async function refresh() {
      try {
        const xs = await listMyExercises();
        document.getElementById('vide').classList.toggle('hidden', xs.length > 0);
        liste.innerHTML = xs.map(render).join('');
      } catch (e) {
        liste.innerHTML = '<div class="card text-sm text-red-600">Chargement impossible — ' + esc(e.message || 'erreur') + '</div>';
      }
    }

    liste.addEventListener('click', async (ev) => {
      const btn = ev.target.closest('button');
      if (!btn) return;
      try {
        if (btn.dataset.st) {
          await updateMyExercise(btn.dataset.id, { status: btn.dataset.st });
          await refresh();
        } else if (btn.dataset.save) {
          const ta = liste.querySelector('textarea[data-note="' + btn.dataset.save + '"]');
          await updateMyExercise(btn.dataset.save, { client_note: ta.value });
          btn.textContent = 'Note gardée ✓';
          setTimeout(() => { btn.textContent = 'Garder ma note'; }, 2000);
        }
      } catch (e) {
        alert('Impossible — ' + (e.message || 'erreur'));
      }
    });

    await refresh();
  })();
</script>
</body>
</html>
