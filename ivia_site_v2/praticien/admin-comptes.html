<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comptes — Admin IVIA</title>
  <script src="/shared/session.js?v=20260617e"></script>
  <script>requireAuth();</script>
  <script src="/shared/api.js?v=20260617c"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{forest:'#4A7C59',sage:'#8FB99A','forest-deep':'#2D6A4F',cream:'#FAFDF8',surface:'#F0F7F2',ink:'#1A2E1D',muted:'#4B6350',bdr:'#D4E8D0',trust:'#2563EB'},fontFamily:{heading:['"Lora"','Georgia','serif']}}}}</script>
  <style>
    body{font-family:'Raleway',system-ui,sans-serif;background:#FAFDF8;color:#1A2E1D;}
    h1,h2{font-family:'Lora',Georgia,serif;}
    .sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:10px;font-size:14px;font-weight:500;color:#4B6350;transition:all .15s;cursor:pointer;text-decoration:none;}
    .sidebar-link:hover,.sidebar-link.active{background:#D4E8D0;color:#1A2E1D;}
    .sidebar-link.active{font-weight:700;}
    #toast{position:fixed;bottom:24px;right:24px;background:#1A2E1D;color:#fff;font-size:14px;font-weight:500;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;}
    #toast.show{opacity:1;}#toast.err{background:#991B1B;}
    .badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:9999px;padding:2px 8px;display:inline-block;}
    .act{font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;border:1px solid #D4E8D0;background:#fff;cursor:pointer;}
    .act:hover{background:#F0F7F2;}
    .fld{border:1.5px solid #D4E8D0;border-radius:10px;padding:6px 10px;font-size:13px;background:#fff;outline:none;}
  </style>
</head>
<body class="antialiased min-h-screen bg-cream pb-20 lg:pb-0">
  <div class="flex min-h-screen">
    <aside id="admin-sidebar" class="hidden lg:flex flex-col w-60 bg-[#13261A] border-r border-[#22432F] px-4 py-6 fixed top-0 left-0 h-screen z-10"></aside>

    <main class="flex-1 lg:ml-60 px-4 sm:px-8 py-8 max-w-[1000px] space-y-5">
      <div>
        <h1 class="font-heading text-2xl font-bold text-ink">Comptes &amp; accès</h1>
        <p class="text-sm text-muted mt-1">Inscriptions, vérification du courriel, rôles, activation. Réservé à l'administration.</p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <input id="q" class="fld flex-1 max-w-xs" placeholder="Filtrer par courriel ou nom…">
        <button id="btn-refresh" class="act">Rafraîchir</button>
      </div>

      <!-- Actions groupées sur les comptes cochés -->
      <div class="flex flex-wrap items-center gap-2 bg-surface/60 border border-bdr rounded-[12px] px-3 py-2">
        <span id="sel-count" class="text-xs font-semibold text-muted">0 sélectionné·s</span>
        <select id="bulk-action" class="fld">
          <option value="">Action groupée…</option>
          <option value="resend">Renvoyer le lien de confirmation</option>
          <option value="verify">Vérifier le courriel</option>
          <option value="suspend">Suspendre</option>
          <option value="reactivate">Réactiver</option>
          <option value="sub_active">Abonnement → Actif</option>
          <option value="sub_unpaid">Abonnement → Impayé</option>
          <option value="sub_inactive">Abonnement → Inactif</option>
          <option value="supprimer">⚠️ Supprimer le compte (définitif)</option>
        </select>
        <button id="bulk-apply" class="act font-semibold">Appliquer</button>
      </div>

      <div id="zone" class="bg-white border border-bdr rounded-[20px] overflow-x-auto">
        <p id="loading" class="text-sm text-muted p-6">Chargement…</p>
      </div>
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    const ROLES = ['public_client','practitioner','operator','supervisor','admin_tech'];
    const ROLE_LBL = {public_client:'Client',practitioner:'Praticien·ne',operator:'Opérateur',supervisor:'Superviseur',admin_tech:'Admin tech'};

    function toast(m, err){const t=document.getElementById('toast');t.textContent=m;t.classList.toggle('err',!!err);t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
    function dateCourte(iso){return new Date(iso).toLocaleDateString('fr-CA',{day:'numeric',month:'short',year:'numeric'});}

    function render(accounts){
      const zone=document.getElementById('zone');
      if(!accounts.length){zone.innerHTML='<p class="text-sm text-muted p-6">Aucun compte.</p>';return;}
      const rows=accounts.map(a=>{
        const verifBadge=a.email_verified
          ? '<span class="badge bg-surface text-forest-deep border border-bdr">vérifié</span>'
          : '<span class="badge bg-amber-50 text-amber-700 border border-amber-200">non vérifié</span>';
        const suspended=a.record_status!=='active';
        const statutBadge=suspended
          ? '<span class="badge bg-red-50 text-red-700 border border-red-200">suspendu</span>'
          : '<span class="badge bg-surface text-forest-deep border border-bdr">actif</span>';
        const adminBadge=a.is_admin?' <span class="badge bg-blue-50 text-trust border border-blue-100">admin</span>':'';
        const profilBadge=a.profile_complete?'':' <span class="badge bg-amber-50 text-amber-700 border border-amber-200">profil incomplet</span>';
        const roleSel=`<select class="fld" data-role="${a.id}">`+ROLES.map(r=>`<option value="${r}" ${r===a.role?'selected':''}>${ROLE_LBL[r]}</option>`).join('')+`</select>`;
        const SUBLBL={active:'Actif',unpaid:'Impayé',inactive:'Inactif'};
        const subCell = a.role==='practitioner'
          ? `<select class="fld" data-sub="${a.id}">`+['active','unpaid','inactive'].map(s=>`<option value="${s}" ${s===a.subscription_status?'selected':''}>${SUBLBL[s]}</option>`).join('')+`</select>`
          : '<span class="text-xs text-muted">—</span>';
        return `<tr class="border-t border-bdr align-top">
          <td class="p-3"><input type="checkbox" data-sel="${a.id}" class="w-4 h-4 accent-forest-deep cursor-pointer"></td>
          <td class="p-3">
            <p class="text-sm font-semibold text-ink">${(a.display_name||'').replace(/[<>&]/g,'')}</p>
            <p class="text-xs text-muted">${(a.email||'').replace(/[<>&]/g,'')}</p>
            <p class="text-[11px] text-muted mt-1">inscrit le ${dateCourte(a.created_at)}</p>
          </td>
          <td class="p-3 whitespace-nowrap">${verifBadge}${adminBadge}<br>${statutBadge}${profilBadge}</td>
          <td class="p-3">${roleSel}</td>
          <td class="p-3 text-center"><input type="checkbox" data-admin="${a.id}" ${a.is_admin?'checked':''} class="w-4 h-4 accent-trust cursor-pointer" title="Droit admin — cumulé au rôle, sans le remplacer"></td>
          <td class="p-3">${subCell}</td></tr>`;
      }).join('');
      zone.innerHTML=`<table class="w-full text-left"><thead><tr class="text-[11px] uppercase tracking-wider text-muted">
        <th class="p-3"><input type="checkbox" id="sel-all" class="w-4 h-4 accent-forest-deep cursor-pointer" title="Tout sélectionner"></th>
        <th class="p-3 font-semibold">Personne</th><th class="p-3 font-semibold">Statut</th><th class="p-3 font-semibold">Rôle</th><th class="p-3 font-semibold">Admin</th><th class="p-3 font-semibold">Abonnement</th></tr></thead><tbody>${rows}</tbody></table>`;
      bindActions();
    }

    function majCompteur(){
      const n = document.querySelectorAll('[data-sel]:checked').length;
      document.getElementById('sel-count').textContent = n + ' sélectionné·s';
    }

    function bindActions(){
      // Édition inline (par compte) : rôle + abonnement.
      document.querySelectorAll('[data-role]').forEach(s=>s.onchange=async()=>{try{await adminSetRole(s.dataset.role,s.value);toast('Rôle mis à jour ✓');}catch(e){toast(e.message,true);charger();}});
      document.querySelectorAll('[data-sub]').forEach(s=>s.onchange=async()=>{try{await adminSetSubscription(s.dataset.sub,s.value);toast('Abonnement mis à jour ✓');}catch(e){toast(e.message,true);charger();}});
      document.querySelectorAll('[data-admin]').forEach(c=>c.onchange=async()=>{try{await adminSetAdmin(c.dataset.admin,c.checked);toast(c.checked?'Droit admin accordé ✓':'Droit admin retiré ✓');}catch(e){toast(e.message,true);charger();}});
      // Sélection (cases à cocher).
      const all = document.getElementById('sel-all');
      if (all) all.onchange = () => { document.querySelectorAll('[data-sel]').forEach(c=>c.checked=all.checked); majCompteur(); };
      document.querySelectorAll('[data-sel]').forEach(c=>c.onchange=majCompteur);
      majCompteur();
    }

    const BULK_LBL = {resend:'Renvoyer le lien', verify:'Vérifier le courriel', suspend:'Suspendre', reactivate:'Réactiver', sub_active:'Abonnement → Actif', sub_unpaid:'Abonnement → Impayé', sub_inactive:'Abonnement → Inactif', supprimer:'Supprimer le compte'};
    const BULK_FN = {
      resend:      id=>adminResendVerification(id),
      verify:      id=>adminVerifyAccount(id),
      suspend:     id=>adminSetStatus(id,true),
      reactivate:  id=>adminSetStatus(id,false),
      sub_active:  id=>adminSetSubscription(id,'active'),
      sub_unpaid:  id=>adminSetSubscription(id,'unpaid'),
      sub_inactive:id=>adminSetSubscription(id,'inactive'),
      supprimer:   id=>adminDeleteAccount(id),
    };
    async function bulkApply(){
      const action = document.getElementById('bulk-action').value;
      if(!action){ toast('Choisissez une action.', true); return; }
      let ids = Array.from(document.querySelectorAll('[data-sel]:checked')).map(c=>c.dataset.sel);
      // Garde-fou : ne jamais s'appliquer à soi-même une action de verrouillage
      // (suspension ou retrait d'admin → sortie hors de l'app/admin).
      let autoExclu = false;
      if(action==='suspend' || action==='supprimer'){
        const moi = (typeof getCurrentUser==='function' ? getCurrentUser() : null);
        const monId = moi && (moi.id || moi.user_id);
        if(monId && ids.includes(String(monId))){ ids = ids.filter(id=>id!==String(monId)); autoExclu = true; }
      }
      if(!ids.length){ toast(autoExclu ? 'Seul votre propre compte était sélectionné — action non appliquée à vous-même.' : 'Aucun compte sélectionné.', true); return; }
      // Suppression = irréversible : double confirmation + saisie de SUPPRIMER.
      if(action==='supprimer'){
        if(!confirm(`⚠️ SUPPRESSION DÉFINITIVE de ${ids.length} compte·s et de toutes leurs données (séances, notes, audio). Irréversible.\n\nContinuer ?` + (autoExclu ? '\n(Votre propre compte est exclu.)' : ''))) return;
        if((prompt('Tapez SUPPRIMER en majuscules pour confirmer :')||'').trim() !== 'SUPPRIMER'){ toast('Suppression annulée.', true); return; }
      } else {
        if(!confirm(`Appliquer « ${BULK_LBL[action]} » à ${ids.length} compte·s ?` + (autoExclu ? '\n(Votre propre compte est exclu.)' : ''))) return;
      }
      const res = await Promise.allSettled(ids.map(id => BULK_FN[action](id)));
      const ok = res.filter(r=>r.status==='fulfilled').length;
      const ko = res.length - ok;
      toast(`${ok} appliqué·s` + (ko ? ` · ${ko} échec·s` : ' ✓'), ko>0);
      charger();
    }

    async function charger(){
      const zone=document.getElementById('zone');
      try{
        const list=await adminListAccounts(document.getElementById('q').value.trim());
        render(list);
      }catch(e){
        zone.innerHTML='<p class="text-sm text-red-700 p-6">Accès refusé ou indisponible : '+(e.message||'erreur')+'</p>';
      }
    }
    document.getElementById('btn-refresh').onclick=charger;
    document.getElementById('bulk-apply').onclick=bulkApply;
    document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')charger();});
    charger();
  </script>
</body>
</html>
