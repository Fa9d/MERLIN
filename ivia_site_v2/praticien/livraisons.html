<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/shared/session.js?v=20260710a"></script>
  <script>requireAuth();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVIA — Analyses de séances</title>
  <script src="/shared/api.js?v=20260709b"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{forest:'#4A7C59',sage:'#8FB99A','forest-deep':'#2D6A4F',cream:'#FAFDF8',surface:'#F0F7F2',ink:'#1A2E1D',muted:'#4B6350',bdr:'#D4E8D0',trust:'#2563EB'},fontFamily:{heading:['"Lora"','Georgia','serif']}}}}</script>
  <style>
    body{font-family:'Raleway',system-ui,sans-serif;background:#FAFDF8;color:#1A2E1D;}
    h1,h2,h3{font-family:'Lora',Georgia,serif;}
    .sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:10px;font-size:14px;font-weight:500;color:#4B6350;transition:all .15s;cursor:pointer;text-decoration:none;}
    .sidebar-link:hover,.sidebar-link.active{background:#D4E8D0;color:#1A2E1D;}
    .sidebar-link.active{font-weight:700;}
    .axe{background:#F0F7F2;border:1px solid #D4E8D0;border-radius:12px;padding:12px 14px;}
  </style>
</head>
<body class="antialiased min-h-screen bg-cream pb-20 lg:pb-0">

  <div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside id="praticien-sidebar" class="hidden lg:flex"></aside>

    <main class="flex-1 lg:ml-60 px-4 sm:px-8 py-8 max-w-3xl">

      <div class="flex items-center justify-between mb-2 flex-wrap gap-3">
        <h1 class="font-heading text-2xl font-bold text-ink">Analyses de séances</h1>
        <span id="badge-count" class="text-xs bg-surface text-muted border border-bdr font-semibold px-3 py-1.5 rounded-full">…</span>
      </div>
      <p class="text-sm text-muted mb-7 leading-relaxed">
        Générées automatiquement après chaque enregistrement transcrit (observation, hypothèse,
        orientation). <strong>Lecture d'appui à votre jugement — jamais un verdict</strong> ;
        rien n'est transmis au client sans votre validation.
      </p>

      <div id="liste" class="space-y-4">
        <p class="text-sm text-muted">Chargement…</p>
      </div>
    </main>
  </div>

  <!-- Nav mobile -->
  <nav id="praticien-mobile-nav" class="lg:hidden"></nav>

  <script>
    renderPraticienChrome();

    function dateLisible(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }
    function esc(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }

    // Vigilance : couleur selon le niveau (tolérant aux libellés)
    function vigilanceBadge(code) {
      const c = (code || '').toLowerCase();
      const urgent = c.includes('urgent') || c.includes('eleve') || c.includes('élevé') || c.includes('high');
      const cls = urgent ? 'bg-red-50 text-red-700 border-red-200' : 'bg-surface text-forest-deep border-bdr';
      return `<span class="text-[10px] font-semibold uppercase tracking-wider border ${cls} rounded-full px-2.5 py-1">Vigilance : ${esc(code || 'non précisée')}</span>`;
    }

    function bloc(titre, texte) {
      if (!texte) return '';
      return `<div class="mt-3"><p class="text-[10px] font-semibold uppercase tracking-wider text-muted mb-1">${titre}</p>
        <p class="text-sm text-ink leading-relaxed whitespace-pre-wrap">${esc(texte)}</p></div>`;
    }
    function axe(nom, texte) {
      if (!texte) return '';
      return `<div class="axe"><p class="text-[11px] font-semibold text-forest-deep mb-1">${nom}</p>
        <p class="text-xs text-ink leading-relaxed">${esc(texte)}</p></div>`;
    }

    async function archiverSeance(sessionId) {
      if (typeof archiveSession === 'function') {
        return archiveSession(sessionId);
      }
      if (typeof _req === 'function') {
        return _req('/api/v1/sessions/' + encodeURIComponent(sessionId) + '/archive', { method: 'PATCH' });
      }
      throw new Error('Action d\'archivage indisponible (archiveSession non chargee).');
    }

    async function supprimerSeance(sessionId) {
      if (typeof deleteSession === 'function') {
        return deleteSession(sessionId);
      }
      if (typeof _req === 'function') {
        return _req('/api/v1/sessions/' + encodeURIComponent(sessionId), { method: 'DELETE' });
      }
      throw new Error('Action de suppression indisponible (deleteSession non chargee).');
    }

    (async function charger() {
      const zone = document.getElementById('liste');
      let notes = [];
      let sessions = [];
      let clients = [];
      try {
        notes = await getSessionNotes();
      } catch (e) {
        zone.innerHTML = `<p class="text-sm text-muted">Impossible de charger les analyses (${esc(e.message)}).</p>`;
        document.getElementById('badge-count').textContent = '—';
        return;
      }
      try { sessions = await listMySessions(); } catch (e) {}
      try {
        if (typeof _req === 'function') clients = await _req('/api/v1/clients?limit=200');
      } catch (e) {}

      const sessionsById = new Map(sessions.map(s => [s.id, s]));
      const clientsById = new Map((clients || []).map(c => {
        const nom = [c.first_name_or_alias, c.last_name].filter(Boolean).join(' ').trim();
        return [c.id, nom || c.email || c.public_client_code || 'Client'];
      }));

      // Filtre éventuel passé par les vignettes du tableau de bord (?filtre=a-valider|vigilance).
      const filtre = new URLSearchParams(location.search).get('filtre');
      const titre = document.querySelector('h1');
      const estVigilance = (n) => {
        const c = (n.vigilance_level_code || '').toLowerCase();
        return c.includes('urgent') || c.includes('eleve') || c.includes('élevé') || c.includes('high');
      };
      let liste = notes, titreFiltre = '';
      if (filtre === 'a-valider') {
        liste = notes.filter(n => !n.validated_by_practitioner);
        titreFiltre = 'à valider';
        if (titre) titre.textContent = 'Analyses à valider';
      } else if (filtre === 'vigilance') {
        liste = notes.filter(estVigilance);
        titreFiltre = 'vigilance élevée';
        if (titre) titre.textContent = 'Analyses en vigilance élevée';
      } else if (titre) {
        titre.textContent = 'Toutes les analyses de séances';
      }

      function refreshBadge() {
        const remaining = zone.querySelectorAll('article').length;
        document.getElementById('badge-count').textContent =
          remaining + (remaining > 1 ? ' analyses' : ' analyse');
      }

      const chip = titreFiltre
        ? `<div class="flex items-center justify-between gap-3 bg-surface border border-bdr rounded-[14px] px-4 py-2.5 mb-4">
            <span class="text-sm text-ink">Filtre : <strong>${titreFiltre}</strong></span>
            <a href="/praticien/livraisons.html" class="text-xs font-semibold text-forest-deep hover:underline">Voir tout →</a>
          </div>` : '';

      if (!liste.length) {
        zone.innerHTML = chip + `<div class="bg-white border border-bdr rounded-[20px] p-8 text-center">
          <p class="text-sm text-muted leading-relaxed">${titreFiltre
            ? 'Aucune analyse ' + titreFiltre + ' pour l\'instant.'
            : 'Aucune analyse pour l\'instant. Elles apparaîtront ici automatiquement après le premier enregistrement transcrit (séance solo ou express).'}</p></div>`;
        return;
      }

      zone.innerHTML = chip;
      document.getElementById('badge-count').textContent =
        liste.length + (liste.length > 1 ? ' analyses' : ' analyse');
      liste.forEach(n => {
        const card = document.createElement('article');
        card.className = 'bg-white border border-bdr rounded-[20px] p-6 shadow-sm';
        const session = sessionsById.get(n.session_id);
        const patientId = n.client_id || session?.client_id || null;
        const patientLabel = patientId ? (clientsById.get(patientId) || ('Client ' + patientId.slice(0, 8))) : 'Client non attribue';

        const axes = [axe('Cœur', n.coeur_summary_text), axe('Corps', n.corps_summary_text),
                      axe('Esprit', n.esprit_summary_text), axe('Être', n.etre_summary_text)].filter(Boolean).join('');
        const valide = n.validated_by_practitioner
          ? '<span class="text-[10px] font-semibold uppercase tracking-wider text-forest-deep bg-surface border border-bdr rounded-full px-2.5 py-1">validée</span>'
          : '<span class="text-[10px] font-semibold uppercase tracking-wider text-amber-700 bg-amber-50 border border-amber-200 rounded-full px-2.5 py-1">à valider</span>';

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3 mb-2 flex-wrap">
            <div>
              <a href="/praticien/compte-rendu-seance.html?note=${encodeURIComponent(n.id)}" class="text-sm font-semibold text-forest-deep hover:underline">Séance analysée${n.note_sequence_number ? ' · n°' + n.note_sequence_number : ''} ↗</a>
              <p class="text-xs text-muted mt-0.5">${dateLisible(n.created_at)}</p>
              <p class="text-xs text-muted mt-0.5">Patient : <span class="font-semibold text-ink">${esc(patientLabel)}</span></p>
            </div>
            <div class="flex items-center gap-2 flex-wrap justify-end">${vigilanceBadge(n.vigilance_level_code)} ${valide}</div>
          </div>
          <p class="text-sm text-ink leading-relaxed">${esc(n.summary_text)}</p>
          <details class="mt-3 group">
            <summary class="text-sm font-semibold text-forest-deep cursor-pointer hover:underline">Voir l'analyse complète</summary>
            <div class="mt-3 border-t border-bdr pt-3">
              ${bloc('Observations', n.observations_text)}
              ${bloc('Pistes de suivi', n.follow_up_actions_text)}
              ${bloc('Axe de la prochaine séance', n.next_session_focus_text)}
              ${axes ? `<div class="mt-3"><p class="text-[10px] font-semibold uppercase tracking-wider text-muted mb-2">Lecture multidimensionnelle</p><div class="grid sm:grid-cols-2 gap-2">${axes}</div></div>` : ''}
              ${bloc('Reformulation pour le client (à valider)', n.client_facing_summary_text)}
            </div>
          </details>
          <div class="mt-4 pt-3 border-t border-bdr flex items-center justify-between gap-3 flex-wrap">
            <p class="text-[10px] text-muted">IVIA / MERLIN — Transcription et analyse structurée en temps réel. © IVIA / MERLIN 2026, tous droits réservés.</p>
            <div class="flex items-center gap-2 flex-wrap justify-end">
              <button
                data-session-id="${esc(n.session_id)}"
                class="btn-relancer inline-flex items-center gap-1.5 text-xs text-muted border border-bdr rounded-[10px] px-3 py-1.5 hover:bg-surface transition-colors"
                title="Envoyer un courriel d'invitation à reprendre le suivi">
                ✉ Relancer le client
              </button>
              <button
                data-note-id="${esc(n.id)}" data-session-id="${esc(n.session_id)}"
                class="btn-archiver inline-flex items-center gap-1.5 text-xs text-red-500 border border-red-200 rounded-[10px] px-3 py-1.5 hover:bg-red-50 transition-colors"
                title="Archiver cette séance (masquée, non supprimée)">
                ⊘ Archiver
              </button>
              <button
                data-note-id="${esc(n.id)}" data-session-id="${esc(n.session_id)}"
                class="btn-supprimer inline-flex items-center gap-1.5 text-xs text-red-700 border border-red-300 rounded-[10px] px-3 py-1.5 hover:bg-red-100 transition-colors"
                title="Supprimer définitivement cette séance et ses artefacts">
                ✕ Supprimer
              </button>
              <a href="/praticien/compte-rendu-seance.html?note=${encodeURIComponent(n.id)}"
                 class="${n.validated_by_practitioner
                   ? 'inline-flex items-center text-sm font-medium text-muted hover:text-ink'
                   : 'inline-flex items-center bg-forest-deep text-white text-sm font-semibold px-4 py-2 rounded-[12px] hover:bg-forest transition-colors'}">
                ${n.validated_by_practitioner ? 'Voir le compte-rendu →' : 'Relire et valider →'}
              </a>
            </div>
          </div>`;
        zone.appendChild(card);

        // Archiver
        card.querySelector('.btn-archiver').addEventListener('click', async function () {
          const sid = this.dataset.sessionId;
          if (!confirm('Archiver cette séance ? Elle disparaîtra de la liste mais restera en base pour traçabilité.')) return;
          this.disabled = true;
          this.textContent = '…';
          try {
            await archiverSeance(sid);
            card.remove();
            refreshBadge();
          } catch (e) {
            alert('Impossible d\'archiver : ' + (e.message || e));
            this.disabled = false;
            this.textContent = '⊘ Archiver';
          }
        });

        // Supprimer definitivement
        card.querySelector('.btn-supprimer').addEventListener('click', async function () {
          const sid = this.dataset.sessionId;
          if (!confirm('Supprimer definitivement cette séance ? Cette action est irreversible.')) return;
          this.disabled = true;
          this.textContent = '…';
          try {
            await supprimerSeance(sid);
            card.remove();
            refreshBadge();
          } catch (e) {
            alert('Impossible de supprimer : ' + (e.message || e));
            this.disabled = false;
            this.textContent = '✕ Supprimer';
          }
        });

        // Relancer le client
        card.querySelector('.btn-relancer').addEventListener('click', async function () {
          const sid = this.dataset.sessionId;
          const msg = prompt('Message optionnel à inclure dans le courriel de relance\n(laisser vide pour le message par défaut) :');
          if (msg === null) return; // annulé
          this.disabled = true;
          this.textContent = '…';
          try {
            await sendClientFollowup(sid, msg || null);
            this.textContent = '✓ Envoyé';
            setTimeout(() => { this.textContent = '✉ Relancer le client'; this.disabled = false; }, 3000);
          } catch (e) {
            alert('Impossible d\'envoyer : ' + (e.message || e));
            this.disabled = false;
            this.textContent = '✉ Relancer le client';
          }
        });
      });
    })();
  </script>

</body>
</html>
