  <!-- MODAL : Résumé audio -->
  <div id="modal-resume" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200" onclick="if(event.target===this)closeResume()" aria-modal="true" role="dialog">
    <div class="bg-white rounded-t-[24px] sm:rounded-[24px] w-full sm:max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex items-center justify-between px-6 pt-5 pb-4 border-b border-bdr sticky top-0 bg-white">
        <h2 id="resume-title" class="font-heading text-lg font-bold text-ink">Résumé audio</h2>
        <button onclick="closeResume()" class="text-muted hover:text-ink p-1 rounded-full cursor-pointer" aria-label="Fermer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="px-6 py-5 space-y-4">
        <div class="bg-surface rounded-[14px] px-4 py-3">
          <p id="resume-meta" class="text-sm text-muted"></p>
        </div>
        <div>
          <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2" for="resume-text">Résumé de séance</label>
          <textarea id="resume-text" rows="8" maxlength="1000"
            placeholder="Ce que vous avez entendu, les fils émergents, les éléments à retenir pour la prochaine séance…"
            class="w-full border border-bdr rounded-[12px] px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-forest resize-none"
            oninput="document.getElementById('resume-count').textContent=this.value.length+'/1000'"></textarea>
          <p id="resume-count" class="text-xs text-muted text-right mt-1">0/1000</p>
        </div>
        <div class="flex gap-3">
          <button onclick="sendResume()" class="flex-1 bg-forest-deep text-white text-sm font-semibold py-3 rounded-[12px] hover:bg-forest transition-colors cursor-pointer">Envoyer au client</button>
          <button onclick="closeResume()" class="border border-bdr text-sm font-medium text-ink px-5 py-3 rounded-[12px] hover:bg-surface transition-colors cursor-pointer">Annuler</button>
        </div>
        <p class="text-xs text-muted text-center">Le résumé sera envoyé dans l'espace client. L'audio source sera effacé à J+30.</p>
      </div>
    </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-24 lg:bottom-6 left-1/2 -translate-x-1/2 bg-ink text-white text-sm font-medium px-5 py-2.5 rounded-[12px] shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50"></div>

  <script>
    const LIVRAISONS = {
      cb: { name: 'Camille B.', meta: '27 mai 2026 · 52 min · Émotionnel, Relationnel' },
      tm: { name: 'Théo M.',    meta: '25 mai 2026 · 48 min · Spirituel' }
    };

    // ── Sync badge + LIVRAISONS depuis mock ──
    getMockLivraisons().then(livs => {
      const badge = document.getElementById('badge-livr');
      if (badge) badge.textContent = livs.length + ' en attente';
      livs.forEach(c => {
        const key = (c.prenom[0] + c.nom[0]).toLowerCase();
        LIVRAISONS[key] = {
          name: c.prenom + ' ' + c.nom[0] + '.',
          meta: formatDateCourte(c.livraison_date) + ' · ' + c.livraison_duree + ' · ' + c.livraison_registres.join(', ')
        };
      });
    });
    renderLogoutButton(document.getElementById('sidebar-logout'));

    function toggleDropdown(id) {
      document.querySelectorAll('.dropdown-menu').forEach(m => { if (m.id !== id) m.classList.remove('open'); });
      document.getElementById(id).classList.toggle('open');
    }
    document.addEventListener('click', (e) => {
      if (!e.target.closest('[onclick^="toggleDropdown"]') && !e.target.closest('.dropdown-menu')) {
        document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('open'));
      }
    });
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      setTimeout(() => { t.style.opacity = '0'; }, 2500);
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('open'));
    }

    /* Audio player */
    function toggleAudio(id) {
      const panel = document.getElementById('audio-' + id);
      const isOpen = panel.classList.contains('open');
      document.querySelectorAll('.audio-panel').forEach(p => { p.classList.remove('open'); });
      // pause all
      ['cb','tm'].forEach(k => { const a = document.getElementById('aud-' + k); if (a) { a.pause(); resetPlay(k); }});
      if (!isOpen) panel.classList.add('open');
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('open'));
    }

    const PLAY_ICONS = {
      play: '<path d="M8 5v14l11-7z"/>',
      pause: '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    };
    function togglePlay(id) {
      const aud = document.getElementById('aud-' + id);
      const icon = document.getElementById('play-icon-' + id);
      if (aud.paused) {
        aud.play();
        icon.innerHTML = PLAY_ICONS.pause;
      } else {
        aud.pause();
        icon.innerHTML = PLAY_ICONS.play;
      }
    }
    function resetPlay(id) {
      const icon = document.getElementById('play-icon-' + id);
      if (icon) icon.innerHTML = PLAY_ICONS.play;
      const seek = document.getElementById('seek-' + id);
      if (seek) seek.value = 0;
    }
    function updateSeek(id) {
      const aud = document.getElementById('aud-' + id);
      const seek = document.getElementById('seek-' + id);
      const cur = document.getElementById('cur-' + id);
      if (!aud.duration) return;
      seek.value = (aud.currentTime / aud.duration) * 100;
      const m = Math.floor(aud.currentTime / 60);
      const s = Math.floor(aud.currentTime % 60).toString().padStart(2,'0');
      cur.textContent = m + ':' + s;
    }
    function seekAudio(id, val) {
      const aud = document.getElementById('aud-' + id);
      if (aud.duration) aud.currentTime = (val / 100) * aud.duration;
    }
    function setSpeed(id, v) {
      document.getElementById('aud-' + id).playbackRate = parseFloat(v);
    }

    /* Modal résumé */
    function openResumeModal(id) {
      const l = LIVRAISONS[id];
      document.getElementById('resume-title').textContent = 'Résumé — ' + l.name;
      document.getElementById('resume-meta').textContent = l.meta;
      document.getElementById('resume-text').value = '';
      document.getElementById('resume-count').textContent = '0/1000';
      const m = document.getElementById('modal-resume');
      m.classList.remove('opacity-0','pointer-events-none');
      document.body.style.overflow = 'hidden';
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('open'));
    }
    function closeResume() {
      document.getElementById('modal-resume').classList.add('opacity-0','pointer-events-none');
      document.body.style.overflow = '';
    }
    function sendResume() {
      const txt = document.getElementById('resume-text').value.trim();
      if (!txt) { toast('Veuillez écrire un résumé avant d\'envoyer.'); return; }
      closeResume();
      toast('Résumé envoyé au client ✔');
    }
    function markDelivered(id) {
      toast('Marqué comme livré ✔');
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('open'));
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeResume(); });
  </script>

</body>
</html>
