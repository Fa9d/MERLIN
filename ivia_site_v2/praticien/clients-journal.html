<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/shared/session.js?v=20260711a"></script>
  <script>requireAuth();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{forest:'#4A7C59',sage:'#8FB99A','forest-deep':'#2D6A4F',cream:'#FAFDF8',surface:'#F0F7F2',ink:'#1A2E1D',muted:'#4B6350',bdr:'#D4E8D0',trust:'#2563EB'},fontFamily:{heading:['"Lora"','Georgia','serif']}}}}</script>
  <script src="/shared/api.js?v=20260709b"></script>
  <style>body{font-family:'Raleway',system-ui,sans-serif;background:#FAFDF8;color:#1A2E1D;}h1,h2{font-family:'Lora',Georgia,serif;}.tag{display:inline-block;background:#F0F7F2;border:1px solid #D4E8D0;border-radius:6px;padding:2px 8px;font-size:11px;color:#4B6350;font-weight:500;}</style>
</head>
<body class="antialiased min-h-screen bg-cream pb-20 lg:pb-0">

  <div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside id="praticien-sidebar" class="hidden lg:flex"></aside>

    <main class="flex-1 lg:ml-60 px-4 sm:px-8 py-8">

      <div class="flex items-center justify-between mb-7 flex-wrap gap-3">
        <h1 class="font-heading text-2xl font-bold text-ink">Journal des clients</h1>
        <input type="search" placeholder="Rechercher un client…" oninput="filterClients(this.value)"
               class="border border-bdr rounded-[10px] px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-forest bg-white w-full sm:w-56">
      </div>

      <div id="clients-zone" class="space-y-4 max-w-3xl">
        <p class="text-sm text-muted">Chargement des clients…</p>
      </div>
    </main>
  </div>

  <!-- MODAL : Fiche complète -->
  <div id="modal-fiche" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200" onclick="if(event.target===this)closeModal('fiche')" aria-modal="true" role="dialog">
    <div class="bg-white rounded-t-[24px] sm:rounded-[24px] w-full sm:max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex items-center justify-between px-6 pt-5 pb-4 border-b border-bdr sticky top-0 bg-white">
        <h2 id="fiche-title" class="font-heading text-lg font-bold text-ink">Fiche client</h2>
        <button onclick="closeModal('fiche')" class="text-muted hover:text-ink p-1 rounded-full cursor-pointer" aria-label="Fermer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="px-6 py-5 space-y-5">
        <div class="flex items-center gap-3">
          <div id="fiche-avatar" class="w-12 h-12 rounded-full bg-surface border border-bdr flex items-center justify-center font-heading font-bold text-forest-deep text-sm"></div>
          <div><p id="fiche-name" class="font-semibold text-ink"></p><p id="fiche-meta" class="text-xs text-muted"></p></div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div class="bg-surface rounded-[14px] p-3 text-center"><p id="fiche-seances" class="font-heading text-xl font-bold text-ink"></p><p class="text-xs text-muted mt-0.5">séances</p></div>
          <div class="bg-surface rounded-[14px] p-3 text-center"><p id="fiche-entrees" class="font-heading text-xl font-bold text-ink"></p><p class="text-xs text-muted mt-0.5">entrées</p></div>
          <div class="bg-surface rounded-[14px] p-3 text-center"><p id="fiche-registre" class="font-heading text-xl font-bold text-forest text-sm"></p><p class="text-xs text-muted mt-0.5">registre dominant</p></div>
        </div>
        <div>
          <p class="text-xs font-semibold text-muted uppercase tracking-wider mb-2">Dernières entrées journal</p>
          <div id="fiche-journal" class="space-y-2.5"></div>
        </div>
        <div>
          <p class="text-xs font-semibold text-muted uppercase tracking-wider mb-2">Notes praticien·ne</p>
          <textarea id="fiche-notes" rows="3" placeholder="Observations personnelles… (non visible par le client)" class="w-full border border-bdr rounded-[12px] px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-forest resize-none"></textarea>
          <button onclick="saveFicheNotes()" class="mt-2 text-xs font-semibold bg-forest-deep text-white px-4 py-2 rounded-[10px] hover:bg-forest transition-colors cursor-pointer">Sauvegarder les notes</button>
        </div>
        <div class="border-t border-bdr pt-4">
          <p class="text-xs font-semibold text-muted uppercase tracking-wider mb-2">Écrire au client·e</p>
          <div id="fiche-email-form" class="space-y-2">
            <input id="fiche-email-sujet" type="text" maxlength="150" placeholder="Objet du courriel"
                   class="w-full border border-bdr rounded-[12px] px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-forest">
            <textarea id="fiche-email-message" rows="4" maxlength="4000"
                      placeholder="Votre message… Il sera envoyé tel quel, signé de votre nom. Les contenus de séance restent dans l'espace sécurisé."
                      class="w-full border border-bdr rounded-[12px] px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-forest resize-none"></textarea>
            <div class="flex items-center justify-between gap-3">
              <p class="text-xs text-muted">Envoyé à <span id="fiche-email-dest" class="font-medium"></span></p>
              <button id="fiche-email-btn" onclick="sendFicheEmail()"
                      class="text-xs font-semibold bg-forest-deep text-white px-4 py-2 rounded-[10px] hover:bg-forest transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">Envoyer le courriel</button>
            </div>
          </div>
          <p id="fiche-email-absent" class="hidden text-sm text-muted italic">Aucune adresse courriel au dossier pour ce client.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL : Préparer la séance — retirée (contenu maquette). -->

  <!-- Toast -->
  <div id="toast" class="fixed bottom-24 lg:bottom-6 left-1/2 -translate-x-1/2 bg-ink text-white text-sm font-medium px-5 py-2.5 rounded-[12px] shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50"></div>

  <script>
    // ── Données réelles — clients + journal + séances ──────────────────────
    const FICHES = {}; // client_id → { client, entries, seances }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function dateLisible(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('fr-CA', { day: 'numeric', month: 'long' });
    }
    function initiales(nom) {
      return nom.split(/\s+/).map(m => m[0]).filter(Boolean).slice(0, 2).join('').toUpperCase() || '?';
    }
    const KIND_LABELS = { checkin: 'État du jour', exercice: 'Exercice', moment: 'Moment', libre: 'Journal' };

    function ligneEntree(e) {
      const s = (typeof journalStructured === 'function') ? journalStructured(e) : { kind: 'libre', data: null };
      const tags = [];
      if (s.kind && s.kind !== 'libre') tags.push(KIND_LABELS[s.kind] || s.kind);
      (e.dimensions || []).slice(0, 3).forEach(d => tags.push(d));
      let texte = (e.body_text || '').replace(/^ARCHI_[A-Z_]+::/, '').trim();
      if (texte.length > 180) texte = texte.slice(0, 177) + '…';
      return `<div class="border-l-2 border-sage pl-4 py-0.5">
          <p class="text-xs text-muted mb-1">${dateLisible(e.written_at || e.created_at)}${tags.length ? ' · ' + tags.map(t => `<span class="tag">${esc(t)}</span>`).join(' ') : ''}</p>
          <p class="text-sm text-ink">${esc(texte) || '<span class="italic text-muted">Entrée structurée sans texte.</span>'}</p>
        </div>`;
    }

    function carteClient(client, entries, nbSeances) {
      const nom = [client.first_name_or_alias, client.last_name].filter(Boolean).join(' ').trim()
        || client.email || client.public_client_code || 'Client';
      const semaine = entries.filter(e => {
        const d = new Date(e.written_at || e.created_at);
        return (Date.now() - d.getTime()) < 7 * 86400000;
      }).length;
      const badge = semaine
        ? `<span class="text-xs bg-green-50 text-green-700 border border-green-200 font-semibold px-2.5 py-1 rounded-full shrink-0">${semaine} entrée${semaine > 1 ? 's' : ''} cette semaine</span>`
        : '<span class="text-xs bg-surface text-muted border border-bdr font-semibold px-2.5 py-1 rounded-full shrink-0">rien cette semaine</span>';
      const div = document.createElement('div');
      div.className = 'bg-white border border-bdr rounded-[20px] p-6 shadow-sm' + (entries.length ? '' : ' opacity-70');
      div.dataset.name = nom.toLowerCase();
      div.innerHTML = `
        <div class="flex items-start justify-between gap-4 mb-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-surface border border-bdr flex items-center justify-center font-heading font-bold text-forest-deep text-sm shrink-0">${esc(initiales(nom))}</div>
            <div>
              <p class="font-semibold text-sm text-ink">${esc(nom)}</p>
              <p class="text-xs text-muted">${nbSeances} séance${nbSeances > 1 ? 's' : ''} · ${entries.length} entrée${entries.length > 1 ? 's' : ''} au journal</p>
            </div>
          </div>
          ${badge}
        </div>
        <div class="space-y-2.5">${entries.slice(0, 3).map(ligneEntree).join('') || '<p class="text-sm text-muted italic">Aucune entrée au journal pour l\'instant.</p>'}</div>
        <div class="mt-4 flex gap-2">
          <button onclick="openFiche('${esc(client.id)}')" class="text-xs font-semibold text-forest border border-bdr px-4 py-1.5 rounded-[8px] hover:bg-surface transition-colors cursor-pointer">Voir fiche complète</button>
          <a href="/praticien/carte-de-vie.html?client=${esc(client.id)}" class="text-xs font-semibold text-forest-deep border border-bdr px-4 py-1.5 rounded-[8px] hover:bg-surface transition-colors">Carte de Vie</a>
        </div>`;
      return div;
    }

    async function charger() {
      const zone = document.getElementById('clients-zone');
      let clients = [], sessions = [];
      try {
        clients = await _req('/api/v1/clients?limit=200');
      } catch (e) {
        zone.innerHTML = `<p class="text-sm text-muted">Impossible de charger les clients (${esc(e.message)}).</p>`;
        return;
      }
      try { sessions = await listMySessions(); } catch (e) {}
      const seancesParClient = {};
      sessions.forEach(s => { if (s.client_id) seancesParClient[s.client_id] = (seancesParClient[s.client_id] || 0) + 1; });

      if (!clients.length) {
        zone.innerHTML = '<div class="bg-white border border-bdr rounded-[20px] p-8 text-center"><p class="text-sm text-muted">Aucun client pour l\'instant.</p></div>';
        return;
      }

      // Journal de chaque client (en parallèle, tolérant aux erreurs).
      const journaux = await Promise.all(clients.map(c =>
        _req('/api/v1/clients/' + encodeURIComponent(c.id) + '/journal?limit=50').catch(() => [])
      ));

      zone.innerHTML = '';
      // Clients avec entrées récentes d'abord.
      const items = clients.map((c, i) => ({ c, entries: journaux[i] || [] }));
      items.sort((a, b) => {
        const da = a.entries[0] ? new Date(a.entries[0].written_at || a.entries[0].created_at).getTime() : 0;
        const db2 = b.entries[0] ? new Date(b.entries[0].written_at || b.entries[0].created_at).getTime() : 0;
        return db2 - da;
      });
      items.forEach(({ c, entries }) => {
        FICHES[c.id] = { client: c, entries, seances: seancesParClient[c.id] || 0 };
        zone.appendChild(carteClient(c, entries, seancesParClient[c.id] || 0));
      });
    }
    charger();

    function filterClients(q) {
      const v = q.toLowerCase();
      document.querySelectorAll('[data-name]').forEach(card => {
        card.style.display = card.dataset.name.includes(v) ? '' : 'none';
      });
    }

    function openModal(id) {
      const m = document.getElementById('modal-' + id);
      m.classList.remove('opacity-0','pointer-events-none');
      document.body.style.overflow = 'hidden';
    }
    function closeModal(id) {
      const m = document.getElementById('modal-' + id);
      m.classList.add('opacity-0','pointer-events-none');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal('fiche'); }});

    function openFiche(id) {
      const f = FICHES[id];
      if (!f) return;
      const nom = [f.client.first_name_or_alias, f.client.last_name].filter(Boolean).join(' ').trim()
        || f.client.email || 'Client';
      document.getElementById('fiche-title').textContent = 'Fiche — ' + nom;
      document.getElementById('fiche-avatar').textContent = initiales(nom);
      document.getElementById('fiche-name').textContent = nom;
      document.getElementById('fiche-meta').textContent = f.client.email || '';
      document.getElementById('fiche-seances').textContent = f.seances;
      document.getElementById('fiche-entrees').textContent = f.entries.length;
      // Dimension la plus fréquente dans les entrées structurées.
      const freq = {};
      f.entries.forEach(e => (e.dimensions || []).forEach(d => { freq[d] = (freq[d] || 0) + 1; }));
      const top = Object.entries(freq).sort((a, b) => b[1] - a[1])[0];
      document.getElementById('fiche-registre').textContent = top ? top[0] : '—';
      document.getElementById('fiche-journal').innerHTML =
        f.entries.slice(0, 8).map(ligneEntree).join('') || '<p class="text-sm text-muted italic">Aucune entrée.</p>';
      // Bloc courriel : visible seulement si le client a une adresse au dossier.
      ficheClientId = id;
      const hasEmail = !!f.client.email;
      document.getElementById('fiche-email-form').classList.toggle('hidden', !hasEmail);
      document.getElementById('fiche-email-absent').classList.toggle('hidden', hasEmail);
      document.getElementById('fiche-email-dest').textContent = f.client.email || '';
      document.getElementById('fiche-email-sujet').value = '';
      document.getElementById('fiche-email-message').value = '';
      openModal('fiche');
    }

    let ficheClientId = null;

    async function sendFicheEmail() {
      const subject = document.getElementById('fiche-email-sujet').value.trim();
      const message = document.getElementById('fiche-email-message').value.trim();
      if (!ficheClientId) return;
      if (!subject || !message) { showToast('Objet et message sont requis'); return; }
      const btn = document.getElementById('fiche-email-btn');
      btn.disabled = true;
      btn.textContent = 'Envoi…';
      try {
        await _req('/api/v1/clients/' + encodeURIComponent(ficheClientId) + '/email',
                   { method: 'POST', body: { subject, message } });
        document.getElementById('fiche-email-sujet').value = '';
        document.getElementById('fiche-email-message').value = '';
        showToast('Courriel envoyé');
      } catch (e) {
        showToast('Échec de l\'envoi : ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Envoyer le courriel';
      }
    }

    function saveFicheNotes() { showToast('Notes sauvegardées'); }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      setTimeout(() => { t.style.opacity = '0'; }, 2500);
    }

    // ── Logout ──
    renderPraticienChrome();
  </script>

  <!-- Nav mobile -->
  <nav id="praticien-mobile-nav" class="lg:hidden"></nav>

</body>
</html>
