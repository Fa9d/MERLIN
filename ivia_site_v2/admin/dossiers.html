<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IVIA — Dossiers clients</title>
  <script src="/shared/session.js?v=20260709b"></script>
  <script>requireAuth();</script>
  <script src="/shared/api.js?v=20260709b"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{forest:'#4A7C59',sage:'#8FB99A','forest-deep':'#2D6A4F',cream:'#FAFDF8',surface:'#F0F7F2',ink:'#1A2E1D',muted:'#4B6350',bdr:'#D4E8D0',trust:'#2563EB'},fontFamily:{heading:['"Lora"','Georgia','serif']}}}}</script>
  <style>
    body{font-family:'Raleway',system-ui,sans-serif;background:#FAFDF8;color:#1A2E1D;}
    h1,h2,h3{font-family:'Lora',Georgia,serif;}
    .sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:10px;font-size:14px;font-weight:500;color:#4B6350;transition:all .15s;cursor:pointer;text-decoration:none;}
    .sidebar-link:hover,.sidebar-link.active{background:#D4E8D0;color:#1A2E1D;}
    .sidebar-link.active{font-weight:700;}
    .badge{font-size:10px;font-weight:700;text-transform:uppercase;border-radius:9999px;padding:2px 8px;display:inline-block;}
    .fld{border:1.5px solid #D4E8D0;border-radius:10px;padding:8px 12px;font-size:13px;background:#fff;outline:none;}
    .cli-row{cursor:pointer;border:1px solid #D4E8D0;border-radius:12px;padding:10px 12px;background:#fff;}
    .cli-row:hover{border-color:#4A7C59;background:#F0F7F2;}
    .cli-row.active{border-color:#2D6A4F;background:#E8F5EE;}
  </style>
</head>
<body class="antialiased min-h-screen bg-cream pb-20 lg:pb-0">
  <div class="flex min-h-screen">
    <aside id="admin-sidebar" class="hidden lg:flex flex-col w-60 bg-[#13261A] border-r border-[#22432F] px-4 py-6 fixed top-0 left-0 h-screen z-10"></aside>

    <main class="flex-1 lg:ml-60 px-4 sm:px-8 py-8 max-w-[1100px]">
      <div class="mb-4">
        <h1 class="font-heading text-2xl font-bold text-ink">Dossiers clients</h1>
        <p class="text-sm text-muted mt-1">Pour chaque personne : enregistrements, transcriptions et analyses, réunis.</p>
      </div>

      <div class="grid lg:grid-cols-[320px_1fr] gap-5">
        <!-- Liste clients -->
        <div>
          <input id="q" class="fld w-full mb-3" placeholder="Filtrer par nom ou courriel…">
          <div id="liste" class="space-y-2 max-h-[70vh] overflow-y-auto pr-1">
            <p class="text-sm text-muted p-2">Chargement…</p>
          </div>
        </div>
        <!-- Dossier -->
        <div id="dossier" class="bg-white border border-bdr rounded-[20px] p-5 sm:p-7 min-h-[300px]">
          <p class="text-sm text-muted">Sélectionnez une personne à gauche pour voir son dossier.</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    function dateCourte(iso){return iso?new Date(iso).toLocaleDateString('fr-CA',{day:'numeric',month:'short',year:'numeric'}):'—';}
    function dateLongue(iso){return iso?new Date(iso).toLocaleDateString('fr-CA',{day:'numeric',month:'long',year:'numeric'}):'—';}
    function esc(t){const d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML;}
    function vigBadge(v){if(!v)return '';const u=v.toLowerCase();const urgent=u.includes('urgent')||u.includes('priority');return `<span class="badge ${urgent?'bg-red-100 text-red-700':'bg-amber-50 text-amber-700 border border-amber-200'}">vigilance · ${esc(v)}</span>`;}

    let CLIENTS = [];
    function renderListe(){
      const z=document.getElementById('liste');
      if(!CLIENTS.length){z.innerHTML='<p class="text-sm text-muted p-2">Aucun client.</p>';return;}
      z.innerHTML=CLIENTS.map(c=>`
        <div class="cli-row" data-id="${c.client_id}">
          <p class="text-sm font-semibold text-ink">${esc(c.nom)}</p>
          <p class="text-xs text-muted">${esc(c.email||'')}</p>
          <p class="text-[11px] text-muted mt-1">Inscrit·e ${dateCourte(c.date_inscription)}${c.premiere_activite?(' · 1re activité '+dateCourte(c.premiere_activite)):''}</p>
          <p class="text-[11px] text-muted mt-1">${c.nb_seances_live} live · ${c.nb_enregistrements} enr. · ${c.nb_transcrits} transcrits · ${c.nb_analyses} analyses${c.derniere_activite?(' · actif·ve '+dateCourte(c.derniere_activite)):''}</p>
        </div>`).join('');
      z.querySelectorAll('.cli-row').forEach(r=>r.onclick=()=>{
        z.querySelectorAll('.cli-row').forEach(x=>x.classList.remove('active'));
        r.classList.add('active'); ouvrirDossier(r.dataset.id);
      });
    }

    function bloc(titre,txt){return txt?`<div class="mb-2"><p class="text-[10px] font-semibold uppercase tracking-wider text-muted">${titre}</p><p class="text-sm text-ink whitespace-pre-wrap leading-relaxed">${esc(txt)}</p></div>`:'';}

    async function ouvrirDossier(id){
      const d=document.getElementById('dossier');
      d.innerHTML='<p class="text-sm text-muted">Chargement du dossier…</p>';
      let dos;
      try{ dos=await adminClientDossier(id); }
      catch(e){ d.innerHTML='<p class="text-sm text-red-700">Indisponible : '+esc(e.message||'erreur')+'</p>'; return; }

      const enr=dos.enregistrements.map(r=>`
        <article class="border border-bdr rounded-[14px] p-4">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <p class="text-sm font-semibold text-ink">${esc(r.label)} <span class="text-muted font-normal">· ${dateCourte(r.date)}${r.duration_minutes?(' · '+r.duration_minutes+' min'):''}</span></p>
            ${r.transcript_ready?'<span class="badge bg-surface text-forest-deep border border-bdr">transcrit</span>':'<span class="badge bg-amber-50 text-amber-700 border border-amber-200">transcription en cours</span>'}
          </div>
          ${r.transcript_text?`<details class="mt-2"><summary class="text-xs font-semibold text-forest-deep cursor-pointer">Voir la transcription</summary><p class="text-sm text-ink whitespace-pre-wrap leading-relaxed mt-2 bg-surface/60 border border-bdr rounded-[10px] px-3 py-2">${esc(r.transcript_text)}</p></details>`:''}
        </article>`).join('') || '<p class="text-sm text-muted">Aucun enregistrement.</p>';

      const ana=dos.analyses.map(n=>`
        <article class="border border-bdr rounded-[14px] p-4">
          <div class="flex items-center justify-between gap-2 flex-wrap mb-1">
            <p class="text-sm font-semibold text-ink">Analyse${n.note_sequence_number?(' n°'+n.note_sequence_number):''} <span class="text-muted font-normal">· ${dateCourte(n.date)}</span></p>
            <span class="flex items-center gap-1.5">${vigBadge(n.vigilance_level_code)}${n.validated_by_practitioner?'<span class="badge bg-surface text-forest-deep border border-bdr">validée</span>':'<span class="badge bg-amber-50 text-amber-700 border border-amber-200">à valider</span>'}</span>
          </div>
          ${bloc('Résumé', n.summary_text)}
          ${bloc('Observation', n.observations_text)}
          ${(n.coeur_summary_text||n.corps_summary_text||n.esprit_summary_text||n.etre_summary_text)?`<div class="grid sm:grid-cols-2 gap-2 my-2">
            ${n.coeur_summary_text?`<div class="bg-surface/60 border border-bdr rounded-[10px] px-3 py-2"><p class="text-[11px] font-semibold text-forest-deep">Cœur</p><p class="text-xs text-ink">${esc(n.coeur_summary_text)}</p></div>`:''}
            ${n.corps_summary_text?`<div class="bg-surface/60 border border-bdr rounded-[10px] px-3 py-2"><p class="text-[11px] font-semibold text-forest-deep">Corps</p><p class="text-xs text-ink">${esc(n.corps_summary_text)}</p></div>`:''}
            ${n.esprit_summary_text?`<div class="bg-surface/60 border border-bdr rounded-[10px] px-3 py-2"><p class="text-[11px] font-semibold text-forest-deep">Esprit</p><p class="text-xs text-ink">${esc(n.esprit_summary_text)}</p></div>`:''}
            ${n.etre_summary_text?`<div class="bg-surface/60 border border-bdr rounded-[10px] px-3 py-2"><p class="text-[11px] font-semibold text-forest-deep">Être</p><p class="text-xs text-ink">${esc(n.etre_summary_text)}</p></div>`:''}
          </div>`:''}
          ${n.client_facing_summary_text?`<div class="mt-2 bg-[#E8F5EE] border border-bdr rounded-[10px] px-3 py-2"><p class="text-[11px] font-semibold text-forest-deep">Reformulation pour le client</p><p class="text-sm text-ink whitespace-pre-wrap">${esc(n.client_facing_summary_text)}</p></div>`:''}
        </article>`).join('') || '<p class="text-sm text-muted">Aucune analyse.</p>';

      d.innerHTML=`
        <div class="mb-4">
          <h2 class="font-heading text-xl font-bold text-ink">${esc(dos.nom)}</h2>
          <p class="text-xs text-muted">${esc(dos.email||'')} ${dos.phone?('· '+esc(dos.phone)):''} ${dos.profile_complete?'':'· <span class="text-amber-700">profil incomplet</span>'}</p>
        </div>
        <div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-3 mb-5">
          <div class="border border-bdr rounded-[14px] px-4 py-3 bg-surface/50">
            <p class="text-[10px] font-semibold uppercase tracking-wider text-muted">Inscription</p>
            <p class="text-sm font-semibold text-ink mt-1">${dateLongue(dos.date_inscription)}</p>
            <p class="text-xs text-muted mt-1">${esc(dos.public_client_code || '')}</p>
          </div>
          <div class="border border-bdr rounded-[14px] px-4 py-3 bg-surface/50">
            <p class="text-[10px] font-semibold uppercase tracking-wider text-muted">Activité</p>
            <p class="text-sm font-semibold text-ink mt-1">1re · ${dateLongue(dos.premiere_activite)}</p>
            <p class="text-xs text-muted mt-1">Dernière · ${dateLongue(dos.derniere_activite)}</p>
          </div>
          <div class="border border-bdr rounded-[14px] px-4 py-3 bg-surface/50">
            <p class="text-[10px] font-semibold uppercase tracking-wider text-muted">Suivi</p>
            <p class="text-sm font-semibold text-ink mt-1">${dos.nb_seances_live} séances live</p>
            <p class="text-xs text-muted mt-1">${dos.nb_enregistrements} enregistrements · ${dos.nb_transcrits} transcrits</p>
          </div>
          <div class="border border-bdr rounded-[14px] px-4 py-3 bg-surface/50">
            <p class="text-[10px] font-semibold uppercase tracking-wider text-muted">Profil</p>
            <p class="text-sm font-semibold text-ink mt-1">${esc(dos.territory_code || '—')}${dos.birth_year?(' · '+esc(dos.birth_year)) : ''}</p>
            <p class="text-xs text-muted mt-1">${esc(dos.gender_identity || 'Genre non renseigné')}</p>
          </div>
        </div>
        <div class="grid sm:grid-cols-2 gap-3 mb-6">
          <div class="border border-bdr rounded-[14px] px-4 py-3">
            <p class="text-[10px] font-semibold uppercase tracking-wider text-muted">Origine</p>
            <p class="text-sm text-ink mt-1">${esc(dos.birthplace || 'Lieu de naissance non renseigné')}</p>
            <p class="text-xs text-muted mt-1">Invitation · ${dateCourte(dos.activation_invited_at)} · Activation · ${dateCourte(dos.activation_accepted_at)}</p>
          </div>
          <div class="border border-bdr rounded-[14px] px-4 py-3">
            <p class="text-[10px] font-semibold uppercase tracking-wider text-muted">Analyses</p>
            <p class="text-sm text-ink mt-1">${dos.nb_analyses} note(s) clinique(s)</p>
            <p class="text-xs text-muted mt-1">Repères rapides pour situer le parcours avant lecture détaillée.</p>
          </div>
        </div>
        <h3 class="text-sm font-bold text-ink mb-2">Enregistrements &amp; transcriptions</h3>
        <div class="space-y-3 mb-6">${enr}</div>
        <h3 class="text-sm font-bold text-ink mb-2">Analyses</h3>
        <div class="space-y-3">${ana}</div>`;
    }

    async function charger(){
      try{ CLIENTS=await adminListClients(document.getElementById('q').value.trim()); renderListe(); }
      catch(e){ document.getElementById('liste').innerHTML='<p class="text-sm text-red-700 p-2">Accès refusé ou indisponible : '+esc(e.message||'erreur')+'</p>'; }
    }
    document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')charger();});
    charger();
  </script>
</body>
</html>
