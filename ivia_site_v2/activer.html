<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="Activez votre espace IVIA depuis votre lien d'accès.">
  <title>IVIA — Activation de votre espace</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      colors: { forest:'#4A7C59', sage:'#8FB99A', 'forest-deep':'#2D6A4F', cream:'#FAFDF8', surface:'#F0F7F2', ink:'#1A2E1D', muted:'#4B6350', bdr:'#D4E8D0' },
      fontFamily: { heading: ['"Lora"','Georgia','serif'], body: ['"Raleway"','system-ui','sans-serif'] },
    } } }
  </script>
  <style>
    body { font-family:'Raleway',system-ui,sans-serif; background:#FAFDF8; color:#1A2E1D; }
    h1,h2 { font-family:'Lora',Georgia,serif; }
  </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center px-5 py-12">

  <main class="w-full max-w-md">
    <div class="flex items-center justify-center gap-2.5 mb-8">
      <svg width="30" height="30" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect width="28" height="28" rx="7" fill="#2D6A4F"/>
        <rect x="7" y="11" width="3.5" height="6" rx="1.75" fill="white"/>
        <rect x="12.25" y="7" width="3.5" height="14" rx="1.75" fill="white"/>
        <rect x="17.5" y="9" width="3.5" height="10" rx="1.75" fill="white"/>
      </svg>
      <span class="font-heading text-2xl font-semibold text-forest-deep">IVIA</span>
    </div>

    <div class="bg-white border border-bdr rounded-[20px] shadow-sm p-7 sm:p-9 text-center">
      <p class="text-forest text-xs font-semibold uppercase tracking-[0.22em] mb-3">Activation</p>
      <h1 class="font-heading text-2xl sm:text-3xl font-bold text-ink mb-4" id="titre">Bienvenue dans la maison du vivant.</h1>
      <div id="zone" class="text-muted leading-relaxed">
        <p class="mb-6">Votre espace IVIA est prêt à s'ouvrir. Aucun mot de passe n'est requis pour cette première fois.</p>
        <button id="btn"
          class="inline-flex items-center justify-center bg-forest-deep text-white text-base font-semibold
                 px-8 py-4 rounded-[14px] hover:bg-forest transition-colors duration-200 cursor-pointer shadow-sm">
          Ouvrir mon espace IVIA
        </button>
      </div>
      <p class="text-xs text-muted mt-6">
        Pas un service d'urgence · En crise : <strong><a href="tel:18662773553" class="underline">1 866 APPELLE</a></strong>
      </p>
    </div>
  </main>

  <script>
    (function () {
      function apiBase() {
        if (window.IVIA_API_BASE) return window.IVIA_API_BASE.replace(/\/$/, '');
        if (/(^|\.)ivia\.quebec$/.test(location.hostname)) return 'https://api.ivia.quebec';
        return location.protocol + '//' + location.hostname + ':8000';
      }
      var token = new URLSearchParams(location.search).get('token') || '';
      var zone = document.getElementById('zone');
      var titre = document.getElementById('titre');

      function showError(reason) {
        titre.textContent = 'Ce lien n\'est plus valide';
        zone.innerHTML =
          '<p class="mb-2">Il a peut-être expiré ou a déjà été utilisé.</p>' +
          (reason ? '<p class="text-xs text-muted mb-6">' + reason + '</p>' : '<div class="mb-6"></div>') +
          '<div class="flex flex-col sm:flex-row gap-3 justify-center">' +
          '  <a href="/rendez-vous.html" class="bg-forest-deep text-white font-semibold px-5 py-3 rounded-[12px] hover:bg-forest transition-colors">Recommencer une demande</a>' +
          '  <a href="/connexion.html" class="border border-bdr text-forest-deep font-semibold px-5 py-3 rounded-[12px] hover:bg-surface transition-colors">J\'ai déjà un compte</a>' +
          '</div>';
      }

      if (!token) { showError('Aucun lien fourni.'); return; }

      var btn = document.getElementById('btn');
      btn.addEventListener('click', function () {
        btn.disabled = true; btn.textContent = 'Ouverture…';
        fetch(apiBase() + '/api/v1/public/activate/' + encodeURIComponent(token), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
        })
          .then(function (r) { if (!r.ok) throw new Error('http_' + r.status); return r.json(); })
          .then(function (data) {
            localStorage.setItem('ivia_session', data.access_token);
            localStorage.setItem('ivia_user', JSON.stringify({
              id: data.user_id, email: data.email, display_name: data.display_name, role: data.role,
            }));
            if (data.display_name) localStorage.setItem('ivia_prenom', String(data.display_name).split(' ')[0]);
            location.replace('/client/dashboard.html');
          })
          .catch(function () { showError('Lien expiré ou déjà utilisé.'); });
      });
    })();
  </script>
</body>
</html>
