<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>IVIA — Paiement annulé</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{forest:'#4A7C59','forest-deep':'#2D6A4F',cream:'#FAFDF8',surface:'#F0F7F2',ink:'#1A2E1D',muted:'#4B6350',bdr:'#D4E8D0'},fontFamily:{heading:['"Lora"','Georgia','serif']}}}}</script>
  <style>
    body{font-family:'Raleway',system-ui,sans-serif;background:#FAFDF8;color:#1A2E1D;}
    h1{font-family:'Lora',Georgia,serif;}
  </style>
</head>
<body class="antialiased min-h-screen bg-cream">

  <nav class="border-b border-bdr bg-white/80 backdrop-blur-sm">
    <div class="max-w-6xl mx-auto px-5 py-3">
      <a href="/" class="font-heading text-xl font-semibold text-forest-deep">IVIA</a>
    </div>
  </nav>

  <div class="min-h-[calc(100vh-57px)] flex items-start justify-center py-20 px-4">
    <div class="w-full max-w-md text-center">
      <div class="w-16 h-16 rounded-full bg-surface border border-bdr flex items-center justify-center mx-auto mb-5">
        <svg class="w-8 h-8 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/>
        </svg>
      </div>
      <h1 class="font-heading text-2xl font-bold text-ink mb-2">Paiement annulé — rien n'a été débité.</h1>
      <p class="text-sm text-muted leading-relaxed mb-8">
        Votre créneau reste réservé quelques minutes encore.
        Vous pouvez reprendre la réservation, ou revenir plus tard — sans pression.
      </p>
      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <a href="/reserver.html" class="bg-forest-deep text-white font-semibold px-6 py-3 rounded-[14px] hover:bg-forest transition-colors">
          Reprendre la réservation
        </a>
        <a href="/" class="border border-bdr text-ink font-medium px-6 py-3 rounded-[14px] hover:bg-surface transition-colors">
          Retour à l'accueil
        </a>
      </div>
    </div>
  </div>

  <footer class="py-6 px-4 text-center">
    <p class="text-xs text-muted">
      IVIA n'est pas un service d'urgence · En crise :
      <strong><a href="tel:18662773553" class="underline">1 866 APPELLE (277-3553)</a></strong>
    </p>
  </footer>

</body>
</html>
