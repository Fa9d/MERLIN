<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVIA — « Ton espace en trois temps » (animé)</title>
  <!-- Section de SITE (bloc ④), animee + contenu stimulant. Base mss. Aucun score (CARE). Donnees fictives. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#F5F4EE;--surface:#FFFFFF;--surfaceSubtle:#FAFAF8;--text:#1F2933;--text2:#6B7280;--invert:#F9FAFB;
      --rgnr:#3B7F6A;--soft1:#FBE8D3;--soft2:#E3F4E0;--border:#E5E7EB;--nav:#FAFAF8;--navInactive:#9CA3AF;
      --r:12px;--shadow:0 8px 20px rgba(15,23,42,.08);--shadowNav:0 -4px 12px rgba(15,23,42,.1);}
    *{margin:0;box-sizing:border-box;}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .section{max-width:1120px;margin:0 auto;padding:80px 24px;}
    .kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rgnr);font-weight:700;text-align:center;}
    h2.title{font-size:34px;font-weight:700;letter-spacing:-.02em;text-align:center;margin-top:10px;}
    .lead{text-align:center;color:var(--text2);font-size:16px;margin-top:12px;max-width:540px;margin-inline:auto;}
    .row{position:relative;display:flex;gap:28px;justify-content:center;margin-top:56px;flex-wrap:wrap;}
    .thread{position:absolute;top:34px;left:14%;right:14%;height:2px;z-index:0;overflow:hidden;
      background:repeating-linear-gradient(90deg,var(--rgnr) 0 7px,transparent 7px 13px);
      -webkit-mask:linear-gradient(90deg,#000 0,#000 100%);mask-size:200% 100%;animation:flow 3s linear infinite;}
    @media(max-width:1000px){.thread{display:none;}}
    figure{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;opacity:0;animation:fadeUp .7s ease forwards;}
    figure:nth-child(2){animation-delay:.05s} figure:nth-child(3){animation-delay:.2s} figure:nth-child(4){animation-delay:.35s}
    .dot{width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--rgnr);margin-bottom:24px;}
    .dot::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid var(--rgnr);animation:ping 2.4s ease-out infinite;}
    .cap{font-size:19px;font-weight:700;margin-top:20px;} .capd{color:var(--text2);font-size:14px;margin-top:6px;text-align:center;max-width:250px;line-height:1.45;}
    .device{width:300px;height:600px;border:11px solid #0d1117;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 30px 60px rgba(10,15,20,.22);}
    .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:100px;height:22px;background:#0d1117;border-radius:0 0 12px 12px;z-index:30;}
    .screen{position:absolute;inset:0;display:flex;flex-direction:column;}
    .sc{flex:1;overflow:hidden;padding:14px 16px 76px;}
    .status{display:flex;justify-content:space-between;padding:10px 16px 2px;font-size:10px;font-weight:600;}
    h1{font-size:21px;font-weight:700;letter-spacing:-.01em;}
    .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--rgnr);font-weight:700;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px;box-shadow:var(--shadow);opacity:0;animation:fadeUp .6s ease forwards;}
    .d1{animation-delay:.3s}.d2{animation-delay:.45s}.d3{animation-delay:.6s}
    .chip{font-size:11px;padding:5px 10px;border-radius:999px;background:var(--surfaceSubtle);border:1px solid var(--border);color:var(--text2);display:inline-block;margin:0 3px 3px 0;}
    .chip.on{background:var(--soft2);border-color:transparent;color:#166534;}
    /* barres "equilibre du jour" — sans chiffre */
    .eq{display:flex;gap:8px;align-items:flex-end;height:44px;margin-top:10px;}
    .eq .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;}
    .eq .t{width:100%;height:38px;background:var(--soft2);border-radius:5px;position:relative;overflow:hidden;}
    .eq .t i{position:absolute;bottom:0;left:0;right:0;background:var(--rgnr);border-radius:5px;transform:scaleY(0);transform-origin:bottom;animation:grow 1.1s cubic-bezier(.2,.7,.3,1) forwards;}
    .eq small{font-size:8px;color:var(--text2);}
    /* onde */
    @keyframes w{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
    .bar{width:3px;border-radius:2px;transform-origin:bottom;animation:w 1.4s ease-in-out infinite;display:inline-block;}
    /* carte de vie (courbe qui se dessine) */
    .draw{stroke-dasharray:640;stroke-dashoffset:640;animation:draw 2.4s ease forwards .5s;}
    .jal{opacity:0;animation:pop .4s ease forwards;}
    /* chemin futur qui coule */
    .path{stroke-dasharray:6 8;animation:dash 1.4s linear infinite;}
    /* progression intention */
    .prog{height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
    .prog i{display:block;height:100%;background:var(--rgnr);width:0;border-radius:99px;animation:fill 1.6s ease forwards .6s;}
    .nav{position:absolute;bottom:0;inset-inline:0;height:62px;background:var(--nav);box-shadow:var(--shadowNav);display:flex;align-items:center;justify-content:space-around;padding:0 8px;}
    .nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8px;color:var(--navInactive);font-weight:600;flex:1;}
    .nav a.on{color:var(--rgnr);} .nav svg{width:18px;height:18px;}
    .plus{width:44px;height:44px;border-radius:50%;background:var(--rgnr);display:grid;place-items:center;margin-top:-20px;box-shadow:0 6px 14px rgba(59,127,106,.4);flex:0 0 auto;}
    @keyframes fadeUp{to{opacity:1;transform:none}} figure,.card{transform:translateY(14px);}
    @keyframes grow{to{transform:scaleY(1)}} @keyframes draw{to{stroke-dashoffset:0}} @keyframes pop{to{opacity:1;transform:scale(1)}}
    @keyframes dash{to{stroke-dashoffset:-28}} @keyframes fill{to{width:70%}} @keyframes flow{to{mask-position:-200% 0}}
    @keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.4);opacity:0}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important;}}
  </style>
</head>
<body>
<section class="section">
  <p class="kick">Ton espace</p>
  <h2 class="title">Ton espace, en trois temps.</h2>
  <p class="lead">Un fil qui te suit. On ne repart jamais de zéro — on continue.</p>

  <div class="row">
    <div class="thread"></div>

    <!-- ══ OÙ J'EN SUIS ══ -->
    <figure>
      <span class="dot" style="position:relative;"></span>
      <div class="device"><span class="notch"></span><div class="screen">
        <div class="status"><span>9:41</span><span>● ● ● 🔋</span></div>
        <div class="sc">
          <h1>Bonjour, Camille.</h1>
          <div class="card d1" style="margin-top:12px;">
            <p class="k">Ton équilibre du jour</p>
            <div class="eq">
              <div class="c"><div class="t"><i style="--h:70%;animation-delay:.4s;height:70%"></i></div><small>Corps</small></div>
              <div class="c"><div class="t"><i style="height:50%;animation-delay:.5s"></i></div><small>Émotions</small></div>
              <div class="c"><div class="t"><i style="height:62%;animation-delay:.6s"></i></div><small>Mental</small></div>
              <div class="c"><div class="t"><i style="height:44%;animation-delay:.7s"></i></div><small>Territoire</small></div>
            </div>
            <p style="font-size:10px;color:var(--text2);margin-top:8px;">un ressenti, jamais une note</p>
          </div>
          <div class="card d2" style="margin-top:11px;background:#153026;border:0;color:var(--invert);">
            <p style="font-size:15px;font-weight:600;">Dépose ce qui vient.</p>
            <div style="margin-top:11px;display:flex;align-items:center;gap:9px;border-top:1px solid rgba(255,255,255,.18);padding-top:10px;">
              <span style="flex:1;font-size:12px;color:rgba(249,250,251,.6);">écrire ou parler…</span>
              <span class="bar" style="height:8px;background:#EFEBDD"></span><span class="bar" style="height:15px;background:#EFEBDD;animation-delay:.15s"></span><span class="bar" style="height:10px;background:#EFEBDD;animation-delay:.3s"></span><span class="bar" style="height:14px;background:#EFEBDD;animation-delay:.1s"></span>
            </div>
          </div>
        </div>
        <nav class="nav">
          <a class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Où j'en suis</a>
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v4l3 2M21 12a9 9 0 1 1-9-9M3 5v4h4"/></svg>Mon passé</a>
          <div class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="var(--invert)" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Mon futur</a>
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 3.5a3 3 0 0 1 0 5.8"/></svg>Praticiens</a>
        </nav>
      </div></div>
      <p class="cap">Où j'en suis</p>
      <p class="capd">Dépose ce qui vient, sens où tu en es aujourd'hui.</p>
    </figure>

    <!-- ══ MON PASSÉ ══ -->
    <figure>
      <span class="dot" style="position:relative;"></span>
      <div class="device"><span class="notch"></span><div class="screen">
        <div class="status"><span>9:41</span><span>● ● ● 🔋</span></div>
        <div class="sc">
          <h1>Mon passé.</h1>
          <!-- Carte de Vie animée -->
          <div class="card d1" style="margin-top:12px;">
            <p class="k">Ton chemin</p>
            <svg viewBox="0 0 250 80" style="width:100%;height:64px;margin-top:6px;">
              <path class="draw" d="M2 64 C 40 64, 55 26, 92 36 S 150 74, 180 34 S 235 20, 248 30" fill="none" stroke="#3B7F6A" stroke-width="2.5" stroke-linecap="round"/>
              <circle class="jal" cx="92" cy="36" r="4" fill="#3B7F6A" style="animation-delay:1.4s"/>
              <circle class="jal" cx="180" cy="34" r="4" fill="#3B7F6A" style="animation-delay:2s"/>
              <circle class="jal" cx="248" cy="30" r="4.5" fill="#3B7F6A" style="animation-delay:2.6s"/>
            </svg>
            <p style="font-size:10px;color:var(--text2);">des hauts, des bas — et tu avances.</p>
          </div>
          <div class="card d2" style="margin-top:11px;background:var(--rgnr);border:0;color:#fff;">
            <p style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;">Depuis ta rencontre · 12 juin</p>
            <p style="font-size:14px;font-weight:600;margin-top:5px;">Ce qu'on a déposé ensemble.</p>
            <p style="font-size:12px;font-weight:600;margin-top:9px;border-bottom:2px solid rgba(255,255,255,.6);display:inline-block;">Relire →</p>
          </div>
          <div class="card d3" style="margin-top:11px;">
            <div style="display:flex;gap:10px;align-items:center;"><b style="color:var(--rgnr);font-size:11px;width:40px;">Auj.</b><span style="font-size:12px;">Une journée plus légère.</span></div>
            <div style="display:flex;gap:10px;align-items:center;margin-top:9px;border-top:1px solid var(--border);padding-top:9px;"><b style="color:var(--rgnr);font-size:11px;width:40px;">5 juin</b><span style="font-size:12px;">La conversation, enfin dite.</span></div>
          </div>
        </div>
        <nav class="nav">
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Où j'en suis</a>
          <a class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v4l3 2M21 12a9 9 0 1 1-9-9M3 5v4h4"/></svg>Mon passé</a>
          <div class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="var(--invert)" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Mon futur</a>
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 3.5a3 3 0 0 1 0 5.8"/></svg>Praticiens</a>
        </nav>
      </div></div>
      <p class="cap">Mon passé</p>
      <p class="capd">Retrouve tout ce que tu as traversé. Rien ne se perd.</p>
    </figure>

    <!-- ══ MON FUTUR ══ -->
    <figure>
      <span class="dot" style="position:relative;"></span>
      <div class="device"><span class="notch"></span><div class="screen">
        <div class="status"><span>9:41</span><span>● ● ● 🔋</span></div>
        <div class="sc">
          <h1>Mon futur.</h1>
          <!-- chemin qui avance vers la rencontre -->
          <div class="card d1" style="margin-top:12px;background:var(--soft1);border:0;">
            <p style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#9a6a2f;font-weight:700;">Prochaine rencontre</p>
            <p style="font-size:14px;font-weight:600;margin-top:4px;">Mardi · 15 h, en ligne</p>
            <svg viewBox="0 0 240 24" style="width:100%;height:22px;margin-top:8px;">
              <path class="path" d="M4 12 H210" fill="none" stroke="#9a6a2f" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="216" cy="12" r="6" fill="#9a6a2f"/>
            </svg>
          </div>
          <p class="k" style="margin-top:16px;color:var(--text2);">Ce que tu choisis de nourrir</p>
          <div class="card d2" style="margin-top:8px;">
            <p style="font-size:13px;">✿ Prendre un moment, chaque soir.</p>
            <div class="prog" style="margin-top:9px;"><i></i></div>
          </div>
          <div class="card d3" style="margin-top:10px;background:var(--surfaceSubtle);">
            <p style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--rgnr);font-weight:700;">Ton accompagnante</p>
            <p style="font-size:12px;font-style:italic;margin-top:5px;line-height:1.4;">« Et si tu notais ce qui change, même petit ? »</p>
          </div>
        </div>
        <nav class="nav">
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Où j'en suis</a>
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v4l3 2M21 12a9 9 0 1 1-9-9M3 5v4h4"/></svg>Mon passé</a>
          <div class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="var(--invert)" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
          <a class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Mon futur</a>
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 3.5a3 3 0 0 1 0 5.8"/></svg>Praticiens</a>
        </nav>
      </div></div>
      <p class="cap">Mon futur</p>
      <p class="capd">Tes intentions, tes prochains pas, les pistes de ton accompagnant·e.</p>
    </figure>

  </div>
</section>
</body>
</html>
