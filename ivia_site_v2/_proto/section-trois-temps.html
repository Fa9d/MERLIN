<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVIA — section « Ton espace en trois temps »</title>
  <!-- Section de SITE (bloc ④). Ecrans soignes niveau showcase. Base mss. Donnees fictives. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#F5F4EE;--surface:#FFFFFF;--surfaceSubtle:#FAFAF8;--text:#1F2933;--text2:#6B7280;--invert:#F9FAFB;
      --rgnr:#3B7F6A;--soft1:#FBE8D3;--soft2:#E3F4E0;--border:#E5E7EB;--nav:#FAFAF8;--navInactive:#9CA3AF;
      --r-md:12px;--r-lg:16px;--shadow-card:0 8px 20px rgba(15,23,42,.08);--shadow-nav:0 -4px 12px rgba(15,23,42,.10);}
    *{margin:0;box-sizing:border-box;}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .section{max-width:1120px;margin:0 auto;padding:80px 24px;}
    .kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rgnr);font-weight:700;text-align:center;}
    h2.title{font-size:34px;font-weight:700;letter-spacing:-.02em;text-align:center;margin-top:10px;}
    .lead{text-align:center;color:var(--text2);font-size:16px;margin-top:12px;max-width:540px;margin-inline:auto;}
    .row{position:relative;display:flex;gap:28px;justify-content:center;margin-top:56px;flex-wrap:wrap;}
    .thread{position:absolute;top:34px;left:14%;right:14%;height:2px;z-index:0;
      background:repeating-linear-gradient(90deg,var(--rgnr) 0 7px,transparent 7px 13px);}
    @media(max-width:1000px){.thread{display:none;}}
    figure{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;}
    .dot{width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--rgnr);margin-bottom:24px;}
    .cap{font-size:19px;font-weight:700;margin-top:20px;}
    .capd{color:var(--text2);font-size:14px;margin-top:6px;text-align:center;max-width:250px;line-height:1.45;}
    /* device (niveau showcase) */
    .device{width:300px;height:600px;border:11px solid #0d1117;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 30px 60px rgba(10,15,20,.22);}
    .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:100px;height:22px;background:#0d1117;border-radius:0 0 12px 12px;z-index:30;}
    .screen{position:absolute;inset:0;display:flex;flex-direction:column;}
    .sc{flex:1;overflow:hidden;padding:14px 16px 78px;}
    .status{display:flex;justify-content:space-between;padding:10px 16px 2px;font-size:10px;font-weight:600;}
    h1{font-size:22px;font-weight:700;letter-spacing:-.01em;}
    .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--rgnr);font-weight:700;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow-card);}
    .chip{font-size:11px;padding:6px 11px;border-radius:999px;background:var(--surfaceSubtle);border:1px solid var(--border);color:var(--text2);display:inline-block;margin:0 3px 3px 0;}
    .chip.on{background:var(--soft2);border-color:transparent;color:#166534;}
    @keyframes w{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
    .bar{width:3px;border-radius:2px;background:var(--rgnr);transform-origin:bottom;animation:w 1.4s ease-in-out infinite;display:inline-block;}
    .nav{position:absolute;bottom:0;inset-inline:0;height:64px;background:var(--nav);box-shadow:var(--shadow-nav);display:flex;align-items:center;justify-content:space-around;padding:0 8px;}
    .nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8px;color:var(--navInactive);font-weight:600;flex:1;text-align:center;}
    .nav a.on{color:var(--rgnr);} .nav svg{width:18px;height:18px;}
    .plus{width:44px;height:44px;border-radius:50%;background:var(--rgnr);display:grid;place-items:center;margin-top:-20px;box-shadow:0 6px 14px rgba(59,127,106,.4);flex:0 0 auto;}
  </style>
</head>
<body>
<section class="section">
  <p class="kick">Ton espace</p>
  <h2 class="title">Ton espace, en trois temps.</h2>
  <p class="lead">Un fil qui te suit. On ne repart jamais de zéro — on continue.</p>

  <div class="row">
    <div class="thread"></div>

    <!-- ══ OÙ J'EN SUIS ══ -->
    <figure>
      <span class="dot"></span>
      <div class="device"><span class="notch"></span><div class="screen">
        <div class="status"><span>9:41</span><span>● ● ● 🔋</span></div>
        <div class="sc">
          <h1>Bonjour, Camille.</h1>
          <div class="card" style="margin-top:14px;">
            <p class="k">Aujourd'hui</p>
            <p style="font-size:14px;font-weight:600;margin-top:8px;">Comment tu te sens ?</p>
            <div style="margin-top:10px;"><span class="chip on">plus léger</span><span class="chip">calme</span><span class="chip">mêlé</span></div>
          </div>
          <div class="card" style="margin-top:12px;background:#153026;border:0;color:var(--invert);">
            <p style="font-size:16px;font-weight:600;">Dépose ce qui vient.</p>
            <div style="margin-top:12px;display:flex;align-items:center;gap:10px;border-top:1px solid rgba(255,255,255,.18);padding-top:11px;">
              <span style="flex:1;font-size:12px;color:rgba(249,250,251,.6);">écrire ou parler…</span>
              <span class="bar" style="height:8px;background:#EFEBDD"></span><span class="bar" style="height:15px;background:#EFEBDD;animation-delay:.15s"></span><span class="bar" style="height:10px;background:#EFEBDD;animation-delay:.3s"></span>
            </div>
          </div>
        </div>
        <nav class="nav">
          <a class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Où j'en suis</a>
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v4l3 2M21 12a9 9 0 1 1-9-9"/><path d="M3 5v4h4"/></svg>Mon passé</a>
          <div class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="var(--invert)" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Mon futur</a>
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 3.5a3 3 0 0 1 0 5.8"/></svg>Praticiens</a>
        </nav>
      </div></div>
      <p class="cap">Où j'en suis</p>
      <p class="capd">Dépose ce qui vient, vois comment tu vas aujourd'hui.</p>
    </figure>

    <!-- ══ MON PASSÉ ══ -->
    <figure>
      <span class="dot"></span>
      <div class="device"><span class="notch"></span><div class="screen">
        <div class="status"><span>9:41</span><span>● ● ● 🔋</span></div>
        <div class="sc">
          <h1>Mon passé.</h1>
          <div class="card" style="margin-top:14px;background:var(--rgnr);border:0;color:#fff;">
            <p style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;">Depuis ta rencontre · 12 juin</p>
            <p style="font-size:15px;font-weight:600;margin-top:6px;">Ce qu'on a déposé ensemble.</p>
            <p style="font-size:12px;font-weight:600;margin-top:10px;border-bottom:2px solid rgba(255,255,255,.6);display:inline-block;padding-bottom:1px;">Relire →</p>
          </div>
          <p class="k" style="margin-top:18px;color:var(--text2);">Ton fil</p>
          <div style="margin-top:8px;border-top:1px solid var(--border);">
            <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);"><b style="color:var(--rgnr);font-size:12px;width:44px;">Auj.</b><span style="font-size:13px;">Une journée plus légère.</span></div>
            <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);"><b style="color:var(--rgnr);font-size:12px;width:44px;">9 juin</b><span style="font-size:13px;">J'ai posé des mots.</span></div>
            <div style="display:flex;gap:12px;padding:12px 0;"><b style="color:var(--rgnr);font-size:12px;width:44px;">5 juin</b><span style="font-size:13px;">La conversation, enfin dite.</span></div>
          </div>
        </div>
        <nav class="nav">
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Où j'en suis</a>
          <a class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v4l3 2M21 12a9 9 0 1 1-9-9"/><path d="M3 5v4h4"/></svg>Mon passé</a>
          <div class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="var(--invert)" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Mon futur</a>
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 3.5a3 3 0 0 1 0 5.8"/></svg>Praticiens</a>
        </nav>
      </div></div>
      <p class="cap">Mon passé</p>
      <p class="capd">Retrouve tout ce que tu as traversé. Rien ne se perd.</p>
    </figure>

    <!-- ══ MON FUTUR ══ -->
    <figure>
      <span class="dot"></span>
      <div class="device"><span class="notch"></span><div class="screen">
        <div class="status"><span>9:41</span><span>● ● ● 🔋</span></div>
        <div class="sc">
          <h1>Mon futur.</h1>
          <div class="card" style="margin-top:14px;background:var(--soft1);border:0;">
            <p style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#9a6a2f;font-weight:700;">Prochaine rencontre</p>
            <p style="font-size:15px;font-weight:600;margin-top:6px;">Mardi · 15 h, en ligne</p>
          </div>
          <p class="k" style="margin-top:18px;color:var(--text2);">Ce que tu choisis de nourrir</p>
          <div class="card" style="margin-top:8px;">
            <p style="font-size:13px;">✿ Prendre un moment, chaque soir.</p>
          </div>
          <div class="card" style="margin-top:10px;background:var(--surfaceSubtle);">
            <p style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--rgnr);font-weight:700;">Ton accompagnante</p>
            <p style="font-size:13px;font-style:italic;margin-top:5px;line-height:1.4;">« Et si tu notais ce qui change, même petit ? »</p>
          </div>
        </div>
        <nav class="nav">
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Où j'en suis</a>
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v4l3 2M21 12a9 9 0 1 1-9-9"/><path d="M3 5v4h4"/></svg>Mon passé</a>
          <div class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="var(--invert)" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
          <a class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Mon futur</a>
          <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 3.5a3 3 0 0 1 0 5.8"/></svg>Praticiens</a>
        </nav>
      </div></div>
      <p class="cap">Mon futur</p>
      <p class="capd">Tes intentions, tes prochains pas, les pistes de ton accompagnant·e.</p>
    </figure>

  </div>
</section>
</body>
</html>
