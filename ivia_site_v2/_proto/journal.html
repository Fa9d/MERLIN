<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVIA — le journal, ses trois vues (proto)</title>
  <!-- PROTO : 3 vues du journal cote a cote. Donnees fictives. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      colors:{forest:'#4A7C59',sage:'#8FB99A','forest-deep':'#2D6A4F',cream:'#FAFDF8',surface:'#F0F7F2',ink:'#1A2E1D',muted:'#6B7E70',bdr:'#E4EFE6'},
      fontFamily:{heading:['"Lora"','serif'],body:['"Raleway"','sans-serif']} }}}
  </script>
  <style>
    body{font-family:'Raleway',sans-serif;background:radial-gradient(circle at 50% 0%,#EAF3EC,#D7E6DB);}
    h1,h2,h3{font-family:'Lora',serif;}
    .mini{width:300px;min-width:300px;height:648px;border-radius:40px;border:9px solid #0E140D;background:#FAFDF8;position:relative;overflow:hidden;box-shadow:0 24px 60px rgba(20,35,22,.28);}
    .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:100px;height:22px;background:#0E140D;border-radius:0 0 12px 12px;z-index:20;}
    .scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;}
    .sc{flex:1;overflow-y:auto;padding:0 18px 78px;}.sc::-webkit-scrollbar{display:none;}
    @keyframes wave{0%,100%{transform:scaleY(.28)}50%{transform:scaleY(1)}}
    .bar{width:3px;border-radius:3px;background:#4A7C59;opacity:.6;transform-origin:bottom;animation:wave 1.4s ease-in-out infinite;}
    .nav{position:absolute;bottom:0;inset-inline:0;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-top:1px solid #E4EFE6;display:flex;justify-content:space-around;padding:9px 0;font-size:10px;}
    .nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#6B7E70;}.nav .on{color:#4A7C59;font-weight:600;}
    .status{display:flex;justify-content:space-between;padding:12px 22px 2px;font-size:11px;font-weight:600;color:#1A2E1D;}
  </style>
</head>
<body class="min-h-screen p-6">
  <h1 class="text-center text-2xl font-bold text-ink mb-1">Le journal — ses trois vues</h1>
  <p class="text-center text-sm text-muted mb-6">déposer · relire · la présence du praticien</p>

  <div class="flex gap-8 overflow-x-auto pb-6 justify-start md:justify-center">

    <!-- ══ VUE 1 : LE FIL ══ -->
    <figure class="shrink-0">
      <figcaption class="text-center text-sm font-semibold text-forest-deep mb-3">1 · Le fil</figcaption>
      <div class="mini"><div class="notch"></div><div class="scr">
        <div class="status"><span>9:41</span><span>● ● ●&nbsp;🔋</span></div>
        <div class="sc">
          <h2 class="text-xl font-bold text-ink mt-2">Journal</h2>
          <p class="text-xs text-muted mt-0.5">à toi seul·e · effaçable · gardé au Québec</p>
          <!-- humeur en mots, pas en score -->
          <p class="mt-4 text-sm text-ink">Comment tu te sens ?</p>
          <div class="mt-2 flex flex-wrap gap-2 text-xs">
            <span class="px-3 py-1.5 rounded-full bg-sage/40 text-forest-deep">plus léger</span>
            <span class="px-3 py-1.5 rounded-full bg-surface text-muted">mêlé</span>
            <span class="px-3 py-1.5 rounded-full bg-surface text-muted">fatigué</span>
            <span class="px-3 py-1.5 rounded-full bg-surface text-muted">calme</span>
          </div>
          <!-- dépose rapide -->
          <div class="mt-4 flex items-center gap-2 rounded-2xl bg-white border border-bdr px-4 py-3">
            <span class="text-sm text-muted flex-1">Dépose ce qui vient…</span>
            <div class="flex items-end gap-[3px] h-4"><span class="bar h-2"></span><span class="bar h-4" style="animation-delay:.2s"></span><span class="bar h-3" style="animation-delay:.35s"></span></div>
          </div>
          <p class="mt-5 mb-2 text-xs font-semibold text-ink">Ton fil</p>
          <div class="rounded-2xl bg-white border border-bdr p-3 flex gap-2 mb-3"><span class="w-1 rounded bg-sage"></span><div><p class="text-[11px] text-muted">aujourd'hui</p><p class="text-sm text-ink">Une journée plus légère.</p></div></div>
          <!-- carte du praticien -->
          <div class="rounded-2xl bg-forest text-cream p-3 mb-3">
            <p class="text-[10px] uppercase tracking-wide text-cream/70">🌿 de ton accompagnante</p>
            <p class="text-sm mt-1">« J'ai relu ta semaine. Et si on partait de ça mardi ? »</p>
          </div>
          <div class="rounded-2xl bg-white border border-bdr p-3 flex gap-2"><span class="w-1 rounded bg-sage"></span><div><p class="text-[11px] text-muted">9 juin</p><p class="text-sm text-ink">Fatiguée, mais j'ai posé des mots.</p></div></div>
        </div>
        <nav class="nav"><a class="on">◆<span>Journal</span></a><a>▣<span>Séances</span></a><a>＋<span>Déposer</span></a><a>◐<span>Profil</span></a></nav>
      </div></div>
    </figure>

    <!-- ══ VUE 2 : DÉPOSER ══ -->
    <figure class="shrink-0">
      <figcaption class="text-center text-sm font-semibold text-forest-deep mb-3">2 · Déposer</figcaption>
      <div class="mini"><div class="notch"></div><div class="scr">
        <div class="status"><span>9:41</span><span>● ● ●&nbsp;🔋</span></div>
        <div class="sc flex flex-col">
          <p class="text-sm text-muted mt-3">← Journal</p>
          <h2 class="font-heading text-2xl text-ink mt-6 leading-snug">Qu'est-ce qui vient,<br>là, maintenant ?</h2>
          <div class="mt-5 flex-1 rounded-3xl bg-white border border-bdr p-4 text-sm text-muted">j'écris…</div>
          <!-- bascule texte / voix -->
          <div class="mt-4 flex items-center justify-center gap-4">
            <span class="text-xs px-3 py-1.5 rounded-full bg-surface text-muted">écrire</span>
            <span class="text-xs px-3 py-1.5 rounded-full bg-forest text-cream">parler</span>
          </div>
          <div class="mt-4 flex items-end justify-center gap-1.5 h-9">
            <span class="bar h-4"></span><span class="bar h-7" style="animation-delay:.15s"></span><span class="bar h-9" style="animation-delay:.3s"></span><span class="bar h-6" style="animation-delay:.1s"></span><span class="bar h-8" style="animation-delay:.25s"></span><span class="bar h-4" style="animation-delay:.05s"></span>
          </div>
          <button class="mt-5 w-full rounded-full bg-forest text-cream py-3 text-sm font-medium">Déposer</button>
          <p class="mt-3 text-center text-[11px] text-muted">à toi seul·e · ta voix s'efface après la transcription</p>
        </div>
      </div></div>
    </figure>

    <!-- ══ VUE 3 : UNE ENTRÉE + PRATICIEN ══ -->
    <figure class="shrink-0">
      <figcaption class="text-center text-sm font-semibold text-forest-deep mb-3">3 · Une entrée</figcaption>
      <div class="mini"><div class="notch"></div><div class="scr">
        <div class="status"><span>9:41</span><span>● ● ●&nbsp;🔋</span></div>
        <div class="sc">
          <p class="text-sm text-muted mt-3">← Ton fil</p>
          <p class="text-xs text-muted mt-4">5 juin · 21 h 40</p>
          <h2 class="font-heading text-lg text-ink mt-1 leading-snug">La conversation difficile, enfin dite.</h2>
          <p class="mt-3 text-sm text-ink/90 leading-relaxed">J'ai réussi à lui dire ce que je gardais depuis des mois. J'avais les mains qui tremblaient, mais je l'ai fait. Je me sens vidée et soulagée en même temps.</p>
          <p class="mt-2 text-[11px] text-muted">🎙 déposé à voix haute · transcrit</p>
          <!-- réponse du praticien : piste, pas prescription -->
          <div class="mt-6 rounded-2xl bg-forest text-cream p-4">
            <p class="text-[10px] uppercase tracking-wide text-cream/70">🌿 de ton accompagnante</p>
            <p class="text-sm mt-2 leading-relaxed">« Ça a demandé du courage. Tu n'as pas juste parlé — tu t'es choisie. »</p>
            <p class="text-sm mt-3 leading-relaxed">Et si, d'ici mardi, tu notais ce que ça change, même petit ?</p>
          </div>
          <p class="mt-4 text-center text-[11px] text-muted">une piste, jamais une consigne</p>
        </div>
        <nav class="nav"><a class="on">◆<span>Journal</span></a><a>▣<span>Séances</span></a><a>＋<span>Déposer</span></a><a>◐<span>Profil</span></a></nav>
      </div></div>
    </figure>

  </div>
</body>
</html>
