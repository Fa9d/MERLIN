<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVIA — première vue mobile « Le geste »</title>
  <!-- PROTOTYPE 1re vue mobile. Ne touche pas index.html ni la prod. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      colors: { forest:'#4A7C59', sage:'#8FB99A', 'forest-deep':'#2D6A4F',
                cream:'#FAFDF8', surface:'#F0F7F2', ink:'#1A2E1D', muted:'#4B6350', bdr:'#D4E8D0' },
      fontFamily: { heading:['"Lora"','Georgia','serif'], body:['"Raleway"','system-ui','sans-serif'] },
    }}}
  </script>
  <style>
    body{font-family:'Raleway',system-ui,sans-serif;}
    h1,h2{font-family:'Lora',Georgia,serif;}
    /* fond apaisant autour du "téléphone" (visible sur desktop) */
    .stage{background:radial-gradient(circle at 50% 20%,#EAF3EC,#DDEAE0);}
    /* cadre téléphone : plein écran sur mobile, encadré sur desktop */
    .device{width:100%;max-width:400px;height:100dvh;max-height:860px;
      background:linear-gradient(180deg,#FAFDF8 0%,#F0F7F2 100%);position:relative;overflow:hidden;}
    @media(min-width:430px){ .device{border-radius:2.5rem;box-shadow:0 30px 80px rgba(26,46,29,.25);border:8px solid #1A2E1D;height:min(90vh,860px);} }
    /* onde de voix */
    @keyframes wave{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
    .bar{width:4px;border-radius:3px;background:#4A7C59;opacity:.55;transform-origin:bottom;
      animation:wave 1.5s ease-in-out infinite;}
    .listening .bar{opacity:.9;animation-duration:.8s;background:#2D6A4F;}
    @media(prefers-reduced-motion:reduce){.bar{animation:none;transform:scaleY(.6)}}
  </style>
</head>
<body class="stage min-h-screen flex items-center justify-center p-0 sm:p-6">

  <div class="device flex flex-col px-7">
    <!-- barre du haut -->
    <div class="flex items-center justify-between pt-7">
      <span class="font-heading text-lg font-bold text-ink">◐ IVIA</span>
      <button aria-label="Menu" class="text-2xl text-ink/70 leading-none">☰</button>
    </div>

    <!-- cœur de la vue : le geste -->
    <div class="flex-1 flex flex-col items-center justify-center text-center">
      <h1 class="text-4xl font-bold text-ink leading-tight">Dis ce que<br>tu vis.</h1>
      <p class="mt-4 text-lg text-muted">Quelqu'un écoute. Pour vrai.</p>

      <!-- LE bouton (le geste) -->
      <button id="mic" class="mt-10 w-24 h-24 rounded-full bg-forest text-cream grid place-items-center shadow-lg active:scale-95 transition hover:bg-forest-deep">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/>
        </svg>
      </button>

      <!-- l'onde de voix -->
      <div id="wave" class="mt-6 flex items-end gap-1.5 h-10">
        <span class="bar h-6" style="animation-delay:0s"></span>
        <span class="bar h-9" style="animation-delay:.15s"></span>
        <span class="bar h-10" style="animation-delay:.3s"></span>
        <span class="bar h-8" style="animation-delay:.1s"></span>
        <span class="bar h-10" style="animation-delay:.35s"></span>
        <span class="bar h-9" style="animation-delay:.2s"></span>
        <span class="bar h-6" style="animation-delay:.05s"></span>
      </div>

      <p id="hint" class="mt-8 text-sm text-muted">gratuit · anonyme · dès maintenant</p>
    </div>

    <!-- indice de scroll -->
    <p class="pb-7 text-center text-xs text-muted/70">↓ pourquoi ici plutôt qu'ailleurs</p>
  </div>

  <script>
    // Le micro = invitation (pas de captation sans consentement — CARE/Loi 25)
    const mic = document.getElementById('mic'), wave = document.getElementById('wave'), hint = document.getElementById('hint');
    mic.addEventListener('click', () => {
      wave.classList.add('listening');
      hint.textContent = 'On y va — crée ton espace en 30 secondes.';
      hint.classList.add('text-forest','font-medium');
    });
  </script>
</body>
</html>
