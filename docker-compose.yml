services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-merlin_v1}
      POSTGRES_USER: ${POSTGRES_USER:-merlin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-merlin} -d ${POSTGRES_DB:-merlin_v1}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./10_backend_merlin_api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MERLIN_ENV: ${MERLIN_ENV:-production}
      MERLIN_APP_NAME: ${MERLIN_APP_NAME:-MERLIN API}
      MERLIN_API_V1_PREFIX: ${MERLIN_API_V1_PREFIX:-/api/v1}
      MERLIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-merlin}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-merlin_v1}
      MERLIN_AUTH_SECRET_KEY: ${MERLIN_AUTH_SECRET_KEY:-change-this-secret-in-prod}
      MERLIN_AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${MERLIN_AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      MERLIN_MEDIA_PROVIDER_CODE: ${MERLIN_MEDIA_PROVIDER_CODE:-livekit}
      MERLIN_MEDIA_LIVEKIT_WS_URL: ${LIVEKIT_URL:-}
      MERLIN_MEDIA_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      MERLIN_MEDIA_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      MERLIN_MEDIA_RECORDING_ENABLED: ${MERLIN_MEDIA_RECORDING_ENABLED:-true}
      MERLIN_MEDIA_RECORDING_STRATEGY: ${MERLIN_MEDIA_RECORDING_STRATEGY:-livekit_egress}
      MERLIN_MEDIA_RECORDINGS_DIR: /app/storage/recordings
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_RECORDING_STORAGE: ${LIVEKIT_RECORDING_STORAGE:-local}
      LIVEKIT_RECORDING_LOCAL_DIR: /app/storage/recordings
      LIVEKIT_S3_ENDPOINT: ${LIVEKIT_S3_ENDPOINT:-}
      LIVEKIT_S3_BUCKET: ${LIVEKIT_S3_BUCKET:-}
      LIVEKIT_S3_ACCESS_KEY: ${LIVEKIT_S3_ACCESS_KEY:-}
      LIVEKIT_S3_SECRET_KEY: ${LIVEKIT_S3_SECRET_KEY:-}
      LIVEKIT_S3_REGION: ${LIVEKIT_S3_REGION:-}
      LIVEKIT_S3_FORCE_PATH_STYLE: ${LIVEKIT_S3_FORCE_PATH_STYLE:-true}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MERLIN_CORS_ORIGINS: ${MERLIN_CORS_ORIGINS:-https://ivia.quebec,https://api.ivia.quebec,http://localhost:3000,http://127.0.0.1:3000}
      MERLIN_AUTO_CREATE_TABLES: ${MERLIN_AUTO_CREATE_TABLES:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-IVIA}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MERLIN_PILOT_EMAIL_OVERRIDE: ${MERLIN_PILOT_EMAIL_OVERRIDE:-0}
      MERLIN_PILOT_CLIENT_PRACTITIONER_EMAIL: ${MERLIN_PILOT_CLIENT_PRACTITIONER_EMAIL:-}
      MERLIN_PILOT_ADMIN_EMAIL: ${MERLIN_PILOT_ADMIN_EMAIL:-}
    ports:
      - "8000:8000"
    volumes:
      - audio_data:/app/storage/recordings
      - ./11_PROMPTS:/11_PROMPTS:ro

  frontend:
    build:
      context: ./09_app_ivia_merlin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MERLIN_API_BASE_URL: ${NEXT_PUBLIC_MERLIN_API_BASE_URL:-https://api.ivia.quebec}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_MERLIN_API_BASE_URL: ${NEXT_PUBLIC_MERLIN_API_BASE_URL:-https://api.ivia.quebec}
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro

volumes:
  postgres_data:
  audio_data:
