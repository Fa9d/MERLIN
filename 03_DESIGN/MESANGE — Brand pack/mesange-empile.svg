<?xml version="1.0" encoding="UTF-8"?>
<!--
  MESANGE — VERSION EMPILÉE
  Icône au-dessus, wordmark en dessous. Pour cartes de visite, packaging.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460" role="img" aria-label="MESANGE">
  <title>MESANGE</title>
  <style>
    .bg     { fill: #0a0a0a; }
    .figure { fill: #fdfaf2; }
    .eye    { fill: #0a0a0a; }
  </style>

  <rect class="bg" x="60" y="0" width="280" height="280" rx="12"/>
  <g transform="translate(102, 91)">
    <path class="figure" d="M 80 70
             Q 72 12 118 -4
             Q 155 -12 182 6
             Q 208 -4 240 6
             Q 262 16 268 42
             Q 245 48 218 46
             Q 245 76 255 112
             Q 218 94 182 89
             Q 175 122 150 134
             Q 128 122 128 94
             Q 95 86 80 70 Z"/>
    <polygon class="figure" points="75,24 50,30 75,36"/>
    <circle class="eye" cx="108" cy="22" r="4.2"/>
  </g>

  <text x="200" y="360" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="44" font-weight="300" fill="#0a0a0a"
        letter-spacing="12">MESANGE</text>

  <!-- Filet décoratif fin -->
  <line x1="170" y1="395" x2="230" y2="395" stroke="#0a0a0a" stroke-width="1"/>

  <!-- Tagline optionnelle (modifiable) -->
  <text x="200" y="425" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="400" fill="#0a0a0a"
        letter-spacing="6">PRÉSENCE · INTELLIGENCE · VIVANT</text>
</svg>
